<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const params=new URLSearchParams(location.search);
const id=params.get("id");

async function loadEvent(){

const snap=await getDoc(doc(db,"event",id));

if(!snap.exists()){
document.body.innerHTML="<h2 style='text-align:center;margin-top:100px;'>행사를 찾을 수 없습니다.</h2>";
return;
}

const e=snap.data();

document.getElementById("title").innerText=e.title;
document.getElementById("eventDate").innerText=e.eventDate||"";
document.getElementById("content").innerText=e.content;

}

loadEvent();

</script>
