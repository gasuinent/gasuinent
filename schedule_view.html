<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행사 상세보기</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}header{background:#222;border-bottom:2px solid #FFD700;padding:20px;text-align:center;position:relative}header h1{margin:0;color:#FFD700;font-size:34px}.close-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid #666;border-radius:50%;background:#111;color:#fff;font-size:28px;line-height:42px;text-align:center;text-decoration:none}.container{width:95%;max-width:1000px;margin:40px auto}.card{background:#1b1b1b;border:1px solid #444;border-radius:12px;padding:30px}.card h2{color:#FFD700;font-size:34px;line-height:1.45;margin-top:0}.info{margin:18px 0;color:#ccc;font-size:18px}.content{margin-top:30px;padding-top:25px;border-top:1px solid #444;line-height:1.9;white-space:pre-wrap;font-size:20px}.backBtn{display:inline-block;margin-top:30px;background:#FFD700;color:#000;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold}@media(max-width:700px){.container{width:92%;margin:25px auto}.card{padding:22px}.card h2{font-size:28px}.content{font-size:18px}.close-btn{right:12px;width:42px;height:42px;line-height:38px}}
</style>
</head>
<body>
<header><h1>📅 행사 상세보기</h1><a class="close-btn" href="schedule.html" title="행사일정으로">×</a></header>
<div class="container"><div class="card"><h2 id="title">행사를 불러오는 중입니다...</h2><div class="info">📅 행사일 : <span id="eventDate"></span></div><div class="info">📍 행사장소 : <span id="eventPlace"></span></div><div id="content" class="content"></div><a href="schedule.html" class="backBtn">목록으로</a></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const db=getFirestore(initializeApp(firebaseConfig));const id=new URLSearchParams(location.search).get("id");
async function load(){if(!id){document.getElementById("title").textContent="행사를 찾을 수 없습니다.";return}const snap=await getDoc(doc(db,"schedule",id));if(!snap.exists()){document.getElementById("title").textContent="행사를 찾을 수 없습니다.";return}const e=snap.data();document.getElementById("title").textContent=e.title||"";document.getElementById("eventDate").textContent=e.date||e.eventDate||"";document.getElementById("eventPlace").textContent=e.place||"";document.getElementById("content").textContent=e.content||"등록된 행사 내용이 없습니다."}load().catch(e=>{console.error(e);document.getElementById("title").textContent="행사 정보를 불러오지 못했습니다."});
</script>
<script type="module" src="visitor_tracker.js"></script>
</body></html>
