<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행사 보기</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}.container{width:90%;max-width:900px;margin:50px auto}h1{color:#FFD700}.date{color:#ccc;margin:20px 0}.content{line-height:1.8;white-space:pre-wrap;font-size:18px}.main-photo,.article-photo{display:block;width:100%;max-height:600px;object-fit:contain;border-radius:10px;margin:30px 0 10px}.photo-caption{text-align:center;color:#aaa;margin-bottom:30px}button{margin-top:40px;background:#FFD700;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1 id="title"></h1>
<div id="date" class="date"></div>
<div id="place" class="date"></div>
<img id="mainPhoto" class="main-photo" style="display:none">
<div id="mainCaption" class="photo-caption"></div>
<div id="content" class="content"></div>
<div id="photoArea"></div>
<button onclick="history.back()">목록으로 돌아가기</button>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),id=new URLSearchParams(location.search).get("id");
function photoHtml(url,n){return `<img class="article-photo" src="${url}" alt="행사 관련 사진 ${n}"><div class="photo-caption">▲ 행사 관련 사진 ${n}</div>`}
async function load(){if(!id){document.getElementById("title").innerText="행사를 찾을 수 없습니다.";return}const snap=await getDoc(doc(db,"event",id));if(!snap.exists()){document.getElementById("title").innerText="행사가 존재하지 않습니다.";return}const e=snap.data();document.getElementById("title").innerText=e.title||"";document.getElementById("date").innerText=e.eventDate||"";document.getElementById("place").innerText="📍 행사장소 : "+(e.place||"");document.getElementById("content").innerText=e.content||"";if(e.image){const m=document.getElementById("mainPhoto");m.src=e.image;m.style.display="block";document.getElementById("mainCaption").innerText="▲ 행사 대표사진"}const photos=Array.isArray(e.images)?e.images.filter(Boolean).slice(0,2):[];document.getElementById("photoArea").innerHTML=photos.map((u,i)=>photoHtml(u,i+2)).join("")}
load();
</script>
</body>
</html>
