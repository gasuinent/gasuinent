<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공지사항</title>

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}

.container{
    width:95%;
    max-width:900px;
    margin:40px auto;
}

h1{
    color:#FFD700;
    font-size:42px;
    margin-bottom:30px;
}

#content{
    font-size:22px;
    line-height:1.9;
    white-space:pre-wrap;
}

#image{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin:30px 0;
    display:none;
}

button{
    margin-top:40px;
    padding:12px 25px;
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:17px;
}

</style>

</head>

<body>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

authDomain: "gasuinent.firebaseapp.com",

projectId: "gasuinent",

storageBucket: "gasuinent.firebasestorage.app",

messagingSenderId: "122370674182",

appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",

measurementId: "G-39M5K1M6K7"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const params = new URLSearchParams(location.search);

const id = params.get("id");


if(id){

    const snap = await getDoc(
        doc(db,"notice",id)
    );


    if(snap.exists()){

        const n = snap.data();


        document.body.insertAdjacentHTML(
            "beforeend",
            `

            <div class="container">

            <h1>
            ${n.title || ""}
            </h1>


            <img
            id="image"
            src="${n.image || ""}"
            >


            <div id="content">
            ${n.content || ""}
            </div>


            <button onclick="location.href='notice.html'">
            ← 공지 목록
            </button>

            </div>

            `
        );


        if(n.image){

            document.getElementById("image")
            .style.display="block";

        }

    }else{

        document.body.innerHTML =
        "<h2 style='text-align:center;margin-top:80px;'>공지를 찾을 수 없습니다.</h2>";

    }

}

</script>

</body>
</html>
