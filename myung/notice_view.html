<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지 보기</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Malgun Gothic,sans-serif;
}
header{
    background:#222;
    padding:20px;
    text-align:center;
}
header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}
.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}
#title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:20px;
}
#date{
    color:#aaa;
    margin-bottom:30px;
}
#image{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:30px;
}
#content{
    font-size:22px;
    line-height:1.8;
    white-space:pre-wrap;
}
button{
    margin-top:40px;
    padding:15px 35px;
    background:#FFD700;
    border:none;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>

<body>

<header>
<h1>📢 공지 보기</h1>
</header>

<div class="container">

<div id="title"></div>
<div id="date"></div>

<img id="image">

<div id="content"></div>

<button onclick="history.back()">
목록으로 돌아가기
</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain: "gasuinent.firebaseapp.com",
projectId: "gasuinent",
storageBucket: "gasuinent.firebasestorage.app",
messagingSenderId: "122370674182",
appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId: "G-39M5K1M6K7"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadNotice(){

    if(!id){
        document.getElementById("title").innerHTML="공지를 찾을 수 없습니다.";
        return;
    }

    const snap = await getDoc(doc(db,"notice",id));

    if(!snap.exists()){
        document.getElementById("title").innerHTML="공지가 존재하지 않습니다.";
        return;
    }

    const notice = snap.data();

    document.getElementById("title").innerHTML = notice.title;
    document.getElementById("date").innerHTML = notice.date;
    document.getElementById("content").innerHTML = notice.content;

    if(notice.image){
        document.getElementById("image").src = notice.image;
        document.getElementById("image").style.display = "block";
    }else{
        document.getElementById("image").style.display = "none";
    }

}

loadNotice();

</script>

</body>
</html>
