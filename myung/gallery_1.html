<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 임시 1번 관리</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}
header{background:#222;padding:20px;text-align:center}
header h1{margin:0;color:#FFD700;font-size:34px}
.container{width:95%;max-width:1200px;margin:30px auto}
input,textarea{width:100%;padding:12px;border:none;border-radius:8px;font-size:18px;box-sizing:border-box}
textarea{height:160px;resize:vertical}
label{display:block;margin-top:20px;margin-bottom:8px;font-weight:bold}
button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#ffcc00}
table{width:100%;border-collapse:collapse;margin-top:20px}
th{background:#333;padding:12px}
td{padding:10px;border-bottom:1px solid #444;text-align:center}
.thumb{width:90px;height:70px;object-fit:cover;border-radius:6px}
#previewImage{max-width:250px;max-height:200px;margin-top:10px;display:none;border-radius:8px}
.notice{background:#222;border:1px solid #555;border-radius:8px;padding:15px;margin-bottom:20px;line-height:1.7}
</style>
</head>
<body>
<header>
<h1>🖼 갤러리 임시 1번</h1>
</header>

<div class="container">
<div class="notice">
<strong style="color:#FFD700">임시 테스트용입니다.</strong><br>
사진은 Firebase Storage가 아니라 현재 사용 중인 컴퓨터의 브라우저 저장공간에 보관됩니다.
따라서 이 컴퓨터에서만 확인할 수 있으며, 정상 결제 후 기존 갤러리로 되돌리면 됩니다.
</div>

<h2>등록된 사진</h2>
<table>
<thead>
<tr>
<th>번호</th><th>사진</th><th>제목</th><th>고정여부</th><th>등록일</th><th>보기</th><th>삭제</th>
</tr>
</thead>
<tbody id="galleryBody"></tbody>
</table>

<hr>

<h2>사진 등록</h2>

<label>사진 제목</label>
<input type="text" id="galleryTitle" placeholder="사진 제목을 입력하세요">

<label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:20px;">
<input type="checkbox" id="galleryPinned" style="width:20px;height:20px;">
<span>상단 3개 고정하기</span>
</label>

<label>사진 선택</label>
<input type="file" id="galleryImage" accept="image/*">
<img id="previewImage" alt="사진 미리보기">

<label>사진 설명</label>
<textarea id="galleryContent" placeholder="사진 설명을 입력하세요"></textarea>

<button id="saveGallery" style="margin-top:20px">사진 저장</button>
<button onclick="location.href='admin.html'" style="margin-left:15px;background:#555;color:#fff">🏠 관리 메인</button>
</div>

<script>
const DB_NAME="gasuinent_gallery_temp_1";
const STORE_NAME="photos";
let editId=null;
let selectedImageData="";

function openDB(){
    return new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,1);
        request.onupgradeneeded=e=>{
            const db=e.target.result;
            if(!db.objectStoreNames.contains(STORE_NAME)){
                const store=db.createObjectStore(STORE_NAME,{keyPath:"id",autoIncrement:true});
                store.createIndex("timestamp","timestamp");
            }
        };
        request.onsuccess=e=>resolve(e.target.result);
        request.onerror=()=>reject(request.error);
    });
}

async function getAllPhotos(){
    const db=await openDB();
    return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE_NAME,"readonly");
        const req=tx.objectStore(STORE_NAME).getAll();
        req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.timestamp-a.timestamp));
        req.onerror=()=>reject(req.error);
    });
}

async function savePhoto(data){
    const db=await openDB();
    return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE_NAME,"readwrite");
        const store=tx.objectStore(STORE_NAME);
        const req=editId ? store.put({...data,id:editId}) : store.add(data);
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
    });
}

async function deletePhoto(id){
    const db=await openDB();
    return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE_NAME,"readwrite");
        const req=tx.objectStore(STORE_NAME).delete(Number(id));
        req.onsuccess=()=>resolve();
        req.onerror=()=>reject(req.error);
    });
}

document.getElementById("galleryImage").onchange=function(){
    const file=this.files[0];
    if(!file)return;
    if(!file.type.startsWith("image/")){
        alert("사진 파일만 선택해 주세요.");
        this.value="";
        return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
        selectedImageData=e.target.result;
        const img=document.getElementById("previewImage");
        img.src=selectedImageData;
        img.style.display="block";
    };
    reader.readAsDataURL(file);
};

document.getElementById("saveGallery").onclick=async()=>{
    try{
        const title=document.getElementById("galleryTitle").value.trim();
        const content=document.getElementById("galleryContent").value.trim();
        const pinned=document.getElementById("galleryPinned").checked;

        if(!title){
            alert("사진 제목을 입력하세요.");
            return;
        }

        if(!editId && !selectedImageData){
            alert("사진을 선택하세요.");
            return;
        }

        const photos=await getAllPhotos();

        if(pinned){
            const count=photos.filter(p=>p.pinned===true && p.id!==editId).length;
            if(count>=3){
                alert("상단 고정은 최대 3개까지만 가능합니다.");
                return;
            }
        }

        const old=editId ? photos.find(p=>p.id===editId) : null;

        const data={
            title:title,
            content:content,
            image:selectedImageData || (old ? old.image : ""),
            pinned:pinned,
            date:new Date().toISOString().slice(0,10),
            timestamp:old ? old.timestamp : Date.now()
        };

        await savePhoto(data);
        alert(editId ? "사진이 수정되었습니다." : "사진이 등록되었습니다.");

        editId=null;
        selectedImageData="";
        document.getElementById("galleryTitle").value="";
        document.getElementById("galleryContent").value="";
        document.getElementById("galleryPinned").checked=false;
        document.getElementById("galleryImage").value="";
        document.getElementById("previewImage").style.display="none";

        loadGallery();
    }catch(err){
        console.error(err);
        alert("사진 저장 중 오류가 발생했습니다.\n"+err.message);
    }
};

async function loadGallery(){
    const photos=await getAllPhotos();
    let html="",no=1;

    photos.forEach(g=>{
        html+=`<tr>
<td>${no++}</td>
<td>${g.image ? `<img src="${g.image}" class="thumb">` : "-"}</td>
<td>${escapeHtml(g.title||"")}</td>
<td>${g.pinned ? '<span style="color:#FFD700;font-weight:bold">고정됨</span>' : "-"}</td>
<td>${g.date||""}</td>
<td><button onclick="viewGallery(${g.id})">보기</button></td>
<td><button onclick="deleteGallery(${g.id})">삭제</button></td>
</tr>`;
    });

    document.getElementById("galleryBody").innerHTML=html ||
        '<tr><td colspan="7" style="padding:30px">등록된 사진이 없습니다.</td></tr>';
}

window.viewGallery=function(id){
    location.href="gallery_view_1.html?id="+encodeURIComponent(id);
};

window.deleteGallery=async function(id){
    if(!confirm("정말 삭제하시겠습니까?"))return;
    await deletePhoto(id);
    loadGallery();
};

function escapeHtml(str){
    return String(str).replace(/[&<>"']/g,m=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
}

loadGallery();
</script>
</body>
</html>
