<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>뉴스관리</title><style>body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}.container{width:95%;max-width:1200px;margin:30px auto}input,textarea,select{width:100%;padding:12px;border:none;border-radius:8px;font-size:18px;box-sizing:border-box}textarea{height:250px;resize:vertical}button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}button:hover{background:#ffcc00}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#333;padding:12px}td{padding:10px;border-bottom:1px solid #444;text-align:center}.thumb{width:80px;border-radius:5px}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:25px 0 35px}.pagination button{min-width:42px;padding:9px 13px;background:#333;color:#fff;border:1px solid #555;border-radius:6px}.pagination button.active{background:#FFD700;color:#000}.news-form-grid{width:100%;border:1px solid #444;border-radius:8px;overflow:hidden;margin-top:10px}.form-row{display:grid;grid-template-columns:125px 1fr;min-height:58px;border-bottom:1px solid #444}.form-label{background:#2d2d2d;display:flex;align-items:center;padding:10px 14px;font-size:17px;font-weight:bold}.form-field{background:#111;padding:8px 10px;display:flex;align-items:center}.form-field input,.form-field select{width:100%;height:42px;padding:8px 12px}.form-field textarea{width:100%;height:130px}.checkbox-field{justify-content:flex-start}.checkbox-field input{width:20px}.calendar-icon{font-size:30px;margin-right:7px}.content-row{min-height:150px}.photo-upload{display:flex;flex-direction:column;gap:10px;width:100%}.photo-preview{display:none;max-width:250px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid #555}.form-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.btn-secondary{background:#555!important;color:#fff!important}@media(max-width:700px){.form-row{grid-template-columns:100px 1fr}.form-label{font-size:14px}.form-actions button{width:100%;max-width:320px}}</style></head><body><header><h1>📰 뉴스관리</h1><div style="margin-top:20px"><input id="searchText" type="text" placeholder="뉴스 검색..." style="width:320px"><button id="searchBtn">검색</button></div></header><div class="container"><h2>등록된 뉴스</h2><table><thead><tr><th>번호</th><th>분류</th><th>사진</th><th>제목</th><th>작성일</th><th>보기</th><th>수정</th><th>삭제</th></tr></thead><tbody id="noticeBody"></tbody></table><div id="pagination" class="pagination"></div><hr><h2>뉴스 등록</h2><div class="news-form-grid"><div class="form-row"><div class="form-label">뉴스 제목</div><div class="form-field"><input type="text" id="noticeTitle"></div></div><div class="form-row"><div class="form-label"><span class="calendar-icon">📅</span>작성 날짜</div><div class="form-field"><input type="date" id="noticeDate"></div></div><div class="form-row"><div class="form-label">대표사진</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage" accept="image/*"><img id="previewImage" class="photo-preview"></div></div></div><div class="form-row"><div class="form-label">보조사진 1</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage2" accept="image/*"><img id="previewImage2" class="photo-preview"></div></div></div><div class="form-row"><div class="form-label">보조사진 2</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage3" accept="image/*"><img id="previewImage3" class="photo-preview"></div></div></div><div class="form-row"><div class="form-label">뉴스 분류</div><div class="form-field"><select id="category"><option>행사안내</option><option>무료공연</option><option>봉사활동</option><option>노래교실</option><option>사회환원</option><option>보도자료</option></select></div></div><div class="form-row"><div class="form-label">📌 공지 / 상단 고정</div><div class="form-field checkbox-field"><input type="checkbox" id="pinned"></div></div><div class="form-row"><div class="form-label">🎬 영상센터 연결</div><div class="form-field checkbox-field"><input type="checkbox" id="videoCenter"><span style="margin-left:10px;color:#bbb">체크하면 기사에 우리 영상센터 바로가기 버튼이 표시됩니다.</span></div></div><div class="form-row content-row"><div class="form-label">뉴스 내용</div><div class="form-field"><textarea id="noticeContent"></textarea></div></div></div><div class="form-actions"><button id="saveNotice">뉴스 저장</button><button id="resetNotice" class="btn-secondary">입력 초기화</button><button id="adminHome" class="btn-secondary">🏠 관리 메인</button></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);let editId=null,editCollection="news";const ids=["noticeImage","noticeImage2","noticeImage3"],previewIds=["previewImage","previewImage2","previewImage3"];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}noticeDate.value=today();ids.forEach((id,i)=>document.getElementById(id).addEventListener("change",function(){const f=this.files[0],img=document.getElementById(previewIds[i]);if(!f){img.style.display="none";return}const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display="block"};r.readAsDataURL(f)}));const PAGE_SIZE=5;let currentPage=1,allNews=[],filteredNews=[];function isNewsData(n){return !!(n.category||n.type==="news")}
async function load(){try{const[a,b]=await Promise.all([getDocs(query(collection(db,"news"),orderBy("timestamp","desc"))),getDocs(query(collection(db,"notice"),orderBy("timestamp","desc")))]);allNews=[];a.forEach(x=>allNews.push({id:x.id,collection:"news",data:x.data()}));b.forEach(x=>{const d=x.data();if(isNewsData(d))allNews.push({id:x.id,collection:"notice",data:d})});allNews.sort((a,b)=>(b.data.timestamp||0)-(a.data.timestamp||0));filteredNews=[...allNews];render()}catch(e){console.error(e);noticeBody.innerHTML='<tr><td colspan="8">뉴스를 불러오지 못했습니다.</td></tr>'}}
function render(){const body=document.getElementById("noticeBody"),s=(currentPage-1)*PAGE_SIZE,items=filteredNews.slice(s,s+PAGE_SIZE);body.innerHTML=items.length?items.map((x,i)=>{const n=x.data;return `<tr><td>${s+i+1}</td><td>${n.category||"행사안내"}</td><td>${n.image?`<img src="${n.image}" class="thumb">`:"-"}</td><td>${n.title||""}</td><td>${n.date||""}</td><td><button onclick="viewNotice('${x.id}','${x.collection}')">보기</button></td><td><button onclick="editNotice('${x.id}','${x.collection}')">수정</button></td><td><button onclick="deleteNotice('${x.id}','${x.collection}')">삭제</button></td></tr>`}).join(""):'<tr><td colspan="8">등록된 뉴스가 없습니다.</td></tr>';const total=Math.ceil(filteredNews.length/PAGE_SIZE);pagination.innerHTML=total>1?Array.from({length:total},(_,i)=>`<button class="${i+1===currentPage?'active':''}" onclick="changePage(${i+1})">${i+1}</button>`).join(""):""}
window.changePage=p=>{currentPage=p;render();scrollTo({top:0,behavior:"smooth"})};function reset(){editId=null;editCollection="news";noticeTitle.value="";noticeContent.value="";category.value="행사안내";pinned.checked=false;videoCenter.checked=false;noticeDate.value=today();ids.forEach((id,i)=>{document.getElementById(id).value="";document.getElementById(previewIds[i]).style.display="none"})}
function compress(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);const r=new FileReader();r.onerror=()=>reject(new Error("사진을 읽을 수 없습니다."));r.onload=e=>{const im=new Image();im.onerror=()=>reject(new Error("사진 형식을 읽을 수 없습니다."));im.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(new Error("사진 압축에 실패했습니다.")),"image/jpeg",.78)};im.src=e.target.result};r.readAsDataURL(file)})}
async function uploadFile(file){const blob=await compress(file);const path="news/"+Date.now()+"_"+Math.random().toString(36).slice(2)+".jpg";const r=ref(storage,path);await uploadBytes(r,blob,{contentType:"image/jpeg"});return await getDownloadURL(r)}
document.getElementById("saveNotice").onclick=async()=>{const btn=document.getElementById("saveNotice");try{const title=noticeTitle.value.trim(),content=noticeContent.value.trim(),selectedDate=noticeDate.value;if(!title)return alert("제목을 입력하세요.");if(!selectedDate)return alert("📅 작성 날짜를 선택하세요.");btn.disabled=true;btn.textContent="사진 저장 중...";let oldData={};if(editId){const old=await getDoc(doc(db,editCollection,editId));if(old.exists())oldData=old.data()}let image=oldData.image||"",images=Array.isArray(oldData.images)?[...oldData.images]:[];const files=ids.map(id=>document.getElementById(id).files[0]);if(files[0])image=await uploadFile(files[0]);for(let i=1;i<files.length;i++)if(files[i])images[i-1]=await uploadFile(files[i]);images=images.filter(Boolean).slice(0,2);const data={title,content,image,images,category:category.value,pinned:pinned.checked,videoCenter:videoCenter.checked,date:selectedDate,timestamp:Date.now(),type:"news"};if(editId)await updateDoc(doc(db,editCollection,editId),data);else await addDoc(collection(db,"news"),data);alert(editId?"뉴스가 수정되었습니다.":"뉴스가 등록되었습니다.");reset();await load()}catch(e){console.error("NEWS_SAVE_ERROR",e);alert("저장 중 오류가 발생했습니다.\n"+(e?.code||"오류")+"\n"+(e?.message||"사진 저장 또는 Firebase 권한을 확인해주세요."))}finally{btn.disabled=false;btn.textContent="뉴스 저장"}};
resetNotice.onclick=reset;adminHome.onclick=()=>location.href="admin.html";window.deleteNotice=async(id,col)=>{if(!confirm("정말 삭제하시겠습니까?"))return;await deleteDoc(doc(db,col,id));await load()};window.editNotice=async(id,col)=>{editId=id;editCollection=col;const s=await getDoc(doc(db,col,id));if(!s.exists())return;const n=s.data();noticeTitle.value=n.title||"";noticeContent.value=n.content||"";noticeDate.value=n.date||today();category.value=n.category||"행사안내";pinned.checked=n.pinned===true;videoCenter.checked=n.videoCenter===true;const urls=[n.image||"",...(Array.isArray(n.images)?n.images:[])];urls.slice(0,3).forEach((u,i)=>{if(u){const img=document.getElementById(previewIds[i]);img.src=u;img.style.display="block"}});scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};window.viewNotice=(id,col)=>location.href="../news_view.html?id="+encodeURIComponent(id);searchBtn.onclick=()=>{const k=searchText.value.trim().toLowerCase();filteredNews=k?allNews.filter(x=>(x.data.title||"").toLowerCase().includes(k)||(x.data.content||"").toLowerCase().includes(k)):[...allNews];currentPage=1;render()};load();</script></body></html>
