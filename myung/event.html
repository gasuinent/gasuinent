<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행사일정 관리</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}.container{width:95%;max-width:1200px;margin:30px auto}input,textarea,select{width:100%;padding:12px;border:none;border-radius:8px;font-size:18px;box-sizing:border-box}textarea{height:220px;resize:vertical}label{display:block;margin-top:20px;margin-bottom:8px;font-weight:bold}button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}button:hover{background:#ffcc00}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#333;padding:12px}td{padding:10px;border-bottom:1px solid #444;text-align:center}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:25px 0 35px}.pagination button{min-width:42px;padding:9px 13px;background:#333;color:#fff;border:1px solid #555}.pagination button:hover,.pagination button.active{background:#FFD700;color:#000;border-color:#FFD700}.pagination button.arrow{background:#555}.empty{padding:30px;color:#aaa;text-align:center}.event-form-grid{width:100%;border:1px solid #444;border-radius:8px;overflow:hidden;margin-top:10px}.form-row{display:grid;grid-template-columns:125px 1fr;min-height:58px;border-bottom:1px solid #444}.form-row:last-child{border-bottom:none}.form-label{background:#2d2d2d;display:flex;align-items:center;padding:10px 14px;font-size:17px;font-weight:bold;box-sizing:border-box}.form-field{background:#111;padding:8px 10px;display:flex;align-items:center;box-sizing:border-box}.form-field input[type=text],.form-field input[type=date]{width:100%;height:42px;padding:8px 12px;border:none;border-radius:6px;font-size:17px;box-sizing:border-box}.form-field input[type=file]{font-size:16px}.form-field textarea{width:100%;height:160px;padding:12px;border:none;border-radius:6px;font-size:17px;box-sizing:border-box;resize:vertical}.photo-upload{display:flex;flex-direction:column;gap:10px;width:100%}.photo-preview{display:none;max-width:300px;max-height:200px;object-fit:contain;border-radius:8px;border:1px solid #555}.form-actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.btn-secondary{background:#555!important;color:#fff!important}@media(max-width:700px){.form-row{grid-template-columns:100px 1fr}.form-label{font-size:14px;padding:8px}.form-actions button{width:100%;max-width:320px}}
</style>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);window.db=db;window.editId=null;
</script>
</head>
<body>
<header><h1>📅 행사일정 관리</h1><div style="margin-top:20px"><input id="searchText" type="text" placeholder="행사 검색..." style="width:320px;padding:10px;border-radius:6px;border:none"><button id="searchBtn">검색</button><button id="allBtn" style="margin-left:8px;background:#555;color:#fff">전체보기</button></div></header>
<div class="container">
<h2>등록된 행사</h2>
<table><thead><tr><th>번호</th><th>행사명</th><th>행사일</th><th>장소</th><th>보기</th><th>수정</th><th>삭제</th></tr></thead><tbody id="eventBody"></tbody></table>
<div id="pagination" class="pagination"></div><hr>
<h2>행사 등록</h2>
<div class="event-form-grid">
<div class="form-row"><div class="form-label">행사명</div><div class="form-field"><input type="text" id="eventTitle"></div></div>
<div class="form-row"><div class="form-label">행사일</div><div class="form-field"><input type="date" id="eventDate"></div></div>
<div class="form-row"><div class="form-label">행사장소</div><div class="form-field"><input type="text" id="eventPlace"></div></div>
<div class="form-row"><div class="form-label">대표사진</div><div class="form-field"><div class="photo-upload"><input type="file" id="eventImage" accept="image/*"><img id="previewImage" class="photo-preview"></div></div></div>
<div class="form-row"><div class="form-label">보조사진 1</div><div class="form-field"><div class="photo-upload"><input type="file" id="eventImage2" accept="image/*"><img id="previewImage2" class="photo-preview"></div></div></div>
<div class="form-row"><div class="form-label">보조사진 2</div><div class="form-field"><div class="photo-upload"><input type="file" id="eventImage3" accept="image/*"><img id="previewImage3" class="photo-preview"></div></div></div>
<div class="form-row"><div class="form-label">행사 내용</div><div class="form-field"><textarea id="eventContent"></textarea></div></div>
</div>
<div class="form-actions"><button id="saveEvent">행사 저장</button><button id="resetEvent" class="btn-secondary">입력 초기화</button><button id="adminHome" class="btn-secondary">🏠 관리 메인</button></div>
</div>
<script type="module">
import{collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import{ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const db=window.db,storage=getStorageSafe();
function getStorageSafe(){return window._storage||(window._storage=window.firebaseStorageInstance||null)}
// Firebase Storage instance is initialized here using the same project configuration.
import{getStorage as getStorageInstance}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const realStorage=getStorageInstance();
const fileIds=["eventImage","eventImage2","eventImage3"],previewIds=["previewImage","previewImage2","previewImage3"];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
document.getElementById("eventDate").value=today();
fileIds.forEach((id,i)=>document.getElementById(id).addEventListener("change",function(){const f=this.files[0],img=document.getElementById(previewIds[i]);if(!f){img.style.display="none";return}const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display="block"};r.readAsDataURL(f)}));
const PAGE_SIZE=5;let currentPage=1,allEvents=[],filteredEvents=[];
async function loadEvent(){try{const s=await getDocs(query(collection(db,"event"),orderBy("timestamp","desc")));allEvents=[];s.forEach(x=>allEvents.push({id:x.id,data:x.data()}));filteredEvents=[...allEvents];currentPage=1;renderEvents()}catch(e){console.error(e);document.getElementById("eventBody").innerHTML='<tr><td colspan="7" class="empty">행사 목록을 불러오지 못했습니다.</td></tr>'}}
function renderEvents(){const start=(currentPage-1)*PAGE_SIZE,items=filteredEvents.slice(start,start+PAGE_SIZE);let h="";if(!items.length)h='<tr><td colspan="7" class="empty">등록된 행사가 없습니다.</td></tr>';else items.forEach((item,i)=>{const e=item.data;h+=`<tr><td>${start+i+1}</td><td>${esc(e.title||"")}</td><td>${esc((e.eventDate||"").substring(0,10))}</td><td>${esc(e.place||"")}</td><td><button onclick="viewEvent('${item.id}')">보기</button></td><td><button onclick="editEvent('${item.id}')">수정</button></td><td><button onclick="deleteEvent('${item.id}')">삭제</button></td></tr>`});document.getElementById("eventBody").innerHTML=h;renderPagination()}
function renderPagination(){const p=document.getElementById("pagination"),total=Math.ceil(filteredEvents.length/PAGE_SIZE);if(total<=1){p.innerHTML="";return}let h="";if(currentPage>1)h+=`<button class="arrow" onclick="changePage(${currentPage-1})">◀</button>`;for(let i=1;i<=total;i++)h+=`<button class="${i===currentPage?"active":""}" onclick="changePage(${i})">${i}</button>`;if(currentPage<total)h+=`<button class="arrow" onclick="changePage(${currentPage+1})">▶</button>`;p.innerHTML=h}
window.changePage=p=>{currentPage=p;renderEvents();window.scrollTo({top:0,behavior:"smooth"})};
async function uploadFile(file){const r=ref(realStorage,"event/"+Date.now()+"_"+file.name);await uploadBytes(r,file);return getDownloadURL(r)}
function resetForm(){window.editId=null;document.getElementById("eventTitle").value="";document.getElementById("eventDate").value=today();document.getElementById("eventPlace").value="";document.getElementById("eventContent").value="";fileIds.forEach((id,i)=>{document.getElementById(id).value="";document.getElementById(previewIds[i]).style.display="none"})}
document.getElementById("saveEvent").onclick=async()=>{try{const title=document.getElementById("eventTitle").value.trim(),eventDate=document.getElementById("eventDate").value,place=document.getElementById("eventPlace").value.trim(),content=document.getElementById("eventContent").value.trim();if(!title){alert("행사명을 입력하세요.");return}if(!eventDate){alert("행사일을 선택하세요.");return}if(!content){alert("행사 내용을 입력하세요.");return}let old={};if(window.editId){const s=await getDoc(doc(db,"event",window.editId));if(s.exists())old=s.data()}let images=Array.isArray(old.images)?[...old.images]:[];const files=fileIds.map(id=>document.getElementById(id).files[0]);if(files[0])old.image=await uploadFile(files[0]);for(let i=1;i<files.length;i++)if(files[i])images[i-1]=await uploadFile(files[i]);images=images.filter(Boolean);const data={title,eventDate,place,content,date:old.date||today(),timestamp:Date.now(),image:old.image||"",images};if(window.editId){await updateDoc(doc(db,"event",window.editId),data);alert("행사가 수정되었습니다.")}else{await addDoc(collection(db,"event"),data);alert("행사가 등록되었습니다.")}resetForm();await loadEvent()}catch(e){console.error(e);alert("행사 저장 중 오류가 발생했습니다.\n\n"+(e.message||e))}};
document.getElementById("resetEvent").onclick=resetForm;document.getElementById("adminHome").onclick=()=>location.href="admin.html";
window.deleteEvent=async id=>{if(!confirm("정말 삭제하시겠습니까?"))return;await deleteDoc(doc(db,"event",id));await loadEvent()};
window.editEvent=async id=>{const s=await getDoc(doc(db,"event",id));if(!s.exists()){alert("행사를 찾을 수 없습니다.");return}window.editId=id;const e=s.data();document.getElementById("eventTitle").value=e.title||"";document.getElementById("eventDate").value=e.eventDate||today();document.getElementById("eventPlace").value=e.place||"";document.getElementById("eventContent").value=e.content||"";const urls=[e.image||"",...(Array.isArray(e.images)?e.images:[])];urls.slice(0,3).forEach((u,i)=>{if(u){const img=document.getElementById(previewIds[i]);img.src=u;img.style.display="block"}});window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
window.viewEvent=id=>location.href="../event_view.html?id="+encodeURIComponent(id);
document.getElementById("searchBtn").onclick=()=>{const k=document.getElementById("searchText").value.trim().toLowerCase();filteredEvents=k?allEvents.filter(x=>(x.data.title||"").toLowerCase().includes(k)||(x.data.content||"").toLowerCase().includes(k)||(x.data.place||"").toLowerCase().includes(k)):[...allEvents];currentPage=1;renderEvents()};document.getElementById("allBtn").onclick=()=>{document.getElementById("searchText").value="";filteredEvents=[...allEvents];currentPage=1;renderEvents()};
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
loadEvent();
</script>
</body>
</html>
