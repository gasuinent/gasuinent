<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 관리</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}.container{width:95%;max-width:1200px;margin:30px auto}input,textarea{width:100%;padding:12px;border:none;border-radius:8px;font-size:18px;box-sizing:border-box}textarea{height:250px;resize:vertical}label{display:block;margin-top:20px;margin-bottom:8px;font-weight:bold}button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}button:hover{background:#ffcc00}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#333;padding:12px}td{padding:10px;border-bottom:1px solid #444;text-align:center}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:25px 0 35px}.pagination button{min-width:42px;padding:9px 13px;background:#333;color:#fff;border:1px solid #555}.pagination button:hover,.pagination button.active{background:#FFD700;color:#000}.pagination button.arrow{background:#555}.photo-upload{display:flex;flex-direction:column;gap:10px}.photo-preview{display:none;max-width:250px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid #555}
</style>
</head>
<body>
<header><h1>📢 공지사항 관리</h1><div style="margin-top:20px"><input id="searchText" type="text" placeholder="공지 검색..." style="width:320px;padding:10px;border-radius:6px;border:none;"><button id="searchBtn">검색</button></div></header>
<div class="container"><h2>등록된 공지</h2><table><thead><tr><th>번호</th><th>제목</th><th>작성일</th><th>보기</th><th>수정</th><th>삭제</th></tr></thead><tbody id="noticeBody"></tbody></table><div id="pagination" class="pagination"></div><hr>
<h2>공지 등록</h2><label>공지 제목</label><input type="text" id="noticeTitle">
<label style="display:flex;align-items:center;gap:10px;margin-top:20px;"><input type="checkbox" id="pinned" style="width:22px;height:22px;">📌 상단 고정</label>
<label><span style="font-size:25px;">📅</span> 작성 날짜</label><input type="date" id="noticeDate">
<label>대표사진</label><div class="photo-upload"><input type="file" id="noticeImage" accept="image/*"><img id="previewImage" class="photo-preview"></div>
<label>보조사진 1</label><div class="photo-upload"><input type="file" id="noticeImage2" accept="image/*"><img id="previewImage2" class="photo-preview"></div>
<label>보조사진 2</label><div class="photo-upload"><input type="file" id="noticeImage3" accept="image/*"><img id="previewImage3" class="photo-preview"></div>
<label>공지 내용</label><textarea id="noticeContent"></textarea>
<button id="saveNotice">공지 저장</button><button onclick="location.href='admin.html'" style="margin-left:15px;background:#555;color:#fff;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer;">🏠 관리 메인</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);let editId=null;
const photoIds=["noticeImage","noticeImage2","noticeImage3"],previewIds=["previewImage","previewImage2","previewImage3"];
function todayString(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
document.getElementById("noticeDate").value=todayString();
photoIds.forEach((id,i)=>document.getElementById(id).addEventListener("change",function(){const f=this.files[0],img=document.getElementById(previewIds[i]);if(!f){img.style.display="none";return}const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display="block"};r.readAsDataURL(f)}));
const PAGE_SIZE=5;let currentPage=1,allNotices=[],filteredNotices=[];
function isNewsData(n){return !!(n.category||n.type==="news");}
async function loadNotice(){try{const s=await getDocs(query(collection(db,"notice"),orderBy("timestamp","desc")));allNotices=[];s.forEach(x=>{const d=x.data();if(!isNewsData(d))allNotices.push({id:x.id,data:d})});filteredNotices=[...allNotices];currentPage=1;renderNotice()}catch(e){console.error(e);document.getElementById("noticeBody").innerHTML='<tr><td colspan="6">공지사항을 불러오지 못했습니다.</td></tr>'}}
function renderNotice(){const body=document.getElementById("noticeBody"),start=(currentPage-1)*PAGE_SIZE,items=filteredNotices.slice(start,start+PAGE_SIZE);let html="";if(!items.length)html='<tr><td colspan="6">등록된 공지가 없습니다.</td></tr>';else items.forEach((item,index)=>{const n=item.data;html+=`<tr><td>${start+index+1}</td><td>${n.title||""}</td><td>${n.date||""}</td><td><button onclick="viewNotice('${item.id}')">보기</button></td><td><button onclick="editNotice('${item.id}')">수정</button></td><td><button onclick="deleteNotice('${item.id}')">삭제</button></td></tr>`});body.innerHTML=html;renderPagination()}
function renderPagination(){const p=document.getElementById("pagination"),total=Math.ceil(filteredNotices.length/PAGE_SIZE);if(total<=1){p.innerHTML="";return}let h="";if(currentPage>1)h+=`<button class="arrow" onclick="changePage(${currentPage-1})">◀</button>`;for(let i=1;i<=total;i++)h+=`<button class="${i===currentPage?"active":""}" onclick="changePage(${i})">${i}</button>`;if(currentPage<total)h+=`<button class="arrow" onclick="changePage(${currentPage+1})">▶</button>`;p.innerHTML=h}window.changePage=p=>{currentPage=p;renderNotice();window.scrollTo({top:0,behavior:"smooth"})};
function resetForm(){editId=null;document.getElementById("noticeTitle").value="";document.getElementById("noticeContent").value="";document.getElementById("noticeDate").value=todayString();document.getElementById("pinned").checked=false;photoIds.forEach((id,i)=>{document.getElementById(id).value="";document.getElementById(previewIds[i]).style.display="none"})}
async function uploadFile(file){const r=ref(storage,"notice/"+Date.now()+"_"+file.name);await uploadBytes(r,file);return getDownloadURL(r)}
document.getElementById("saveNotice").onclick=async()=>{try{const title=document.getElementById("noticeTitle").value.trim(),content=document.getElementById("noticeContent").value.trim(),selectedDate=document.getElementById("noticeDate").value;if(!title){alert("제목을 입력하세요.");return}if(!content){alert("공지 내용을 입력하세요.");return}if(!selectedDate){alert("📅 작성 날짜를 선택하세요.");return}let oldData={};if(editId){const old=await getDoc(doc(db,"notice",editId));if(old.exists())oldData=old.data()}let images=Array.isArray(oldData.images)?[...oldData.images]:[];const files=photoIds.map(id=>document.getElementById(id).files[0]);if(files[0])oldData.image=await uploadFile(files[0]);for(let i=1;i<files.length;i++)if(files[i])images[i-1]=await uploadFile(files[i]);images=images.filter(Boolean);const data={title,content,image:oldData.image||"",images,pinned:document.getElementById("pinned").checked,date:selectedDate,timestamp:Date.now(),type:"notice"};if(editId){await updateDoc(doc(db,"notice",editId),data);alert("공지가 수정되었습니다.")}else{await addDoc(collection(db,"notice"),data);alert("공지가 등록되었습니다.")}resetForm();await loadNotice()}catch(e){console.error(e);alert("저장 중 오류가 발생했습니다. 오류 내용을 확인해주세요.")}};
window.deleteNotice=async id=>{if(!confirm("정말 삭제하시겠습니까?"))return;await deleteDoc(doc(db,"notice",id));await loadNotice()};window.editNotice=async id=>{editId=id;const s=await getDoc(doc(db,"notice",id));if(!s.exists())return;const n=s.data();document.getElementById("noticeTitle").value=n.title||"";document.getElementById("noticeContent").value=n.content||"";document.getElementById("noticeDate").value=n.date||todayString();document.getElementById("pinned").checked=n.pinned===true;const urls=[n.image||"",...(Array.isArray(n.images)?n.images:[])];urls.slice(0,3).forEach((u,i)=>{if(u){const img=document.getElementById(previewIds[i]);img.src=u;img.style.display="block"}});window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};window.viewNotice=id=>location.href="notice_view.html?id="+encodeURIComponent(id);
document.getElementById("searchBtn").onclick=()=>{const k=document.getElementById("searchText").value.trim().toLowerCase();filteredNotices=k?allNotices.filter(x=>(x.data.title||"").toLowerCase().includes(k)||(x.data.content||"").toLowerCase().includes(k)):[...allNotices];currentPage=1;renderNotice()};loadNotice();
</script></body></html>
