<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>갤러리 보기 | 가수인생활 엔터테인먼트</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}

header{
    background:#050505;
    border-bottom:1px solid #292929;
    padding:22px 20px;
    text-align:center;
}

header h1{
    margin:0;
    color:#FFD700;
    font-size:30px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:45px auto 70px;
}

.image-wrap{
    width:100%;
    text-align:center;
    margin-bottom:32px;
}

.image{
    width:100%;
    max-width:850px;
    max-height:650px;
    object-fit:contain;
    display:block;
    margin:0 auto;
    border-radius:14px;
    border:1px solid #333;
    background:#111;
}

.title{
    font-size:32px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:14px;
}

.date{
    color:#999;
    font-size:14px;
    margin-bottom:28px;
}

.content{
    font-size:18px;
    line-height:1.9;
    color:#ddd;
    white-space:pre-wrap;
    margin-bottom:40px;
    padding:24px;
    background:#151515;
    border:1px solid #2d2d2d;
    border-radius:12px;
}

.back{
    display:inline-block;
    padding:12px 25px;
    background:#FFD700;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.back:hover{
    background:#ffcc00;
}

.message{
    text-align:center;
    margin-top:100px;
    color:#ccc;
}

@media(max-width:600px){
    .container{
        width:94%;
        margin-top:30px;
    }

    header h1{
        font-size:25px;
    }

    .title{
        font-size:25px;
    }

    .content{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🖼 갤러리 보기</h1>
</header>

<div class="container">

    <div class="image-wrap">
        <img id="image" class="image" alt="갤러리 사진" style="display:none;">
    </div>

    <div id="title" class="title"></div>

    <div id="date" class="date"></div>

    <div id="content" class="content"></div>

    <a href="gallery.html" class="back">목록으로</a>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import { 
    getFirestore, 
    doc, 
    getDoc 
} 
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

    apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain:"gasuinent.firebaseapp.com",
    projectId:"gasuinent",
    storageBucket:"gasuinent.firebasestorage.app",
    messagingSenderId:"122370674182",
    appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId:"G-39M5K1M6K7"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const params=new URLSearchParams(location.search);

const id=params.get("id");


async function loadGallery(){

    if(!id){

        showMessage("잘못된 갤러리 주소입니다.");

        return;

    }

    try{

        const snap=await getDoc(
            doc(db,"gallery",id)
        );

        if(!snap.exists()){

            showMessage("사진이 없습니다.");

            return;

        }

        const g=snap.data();

        document.getElementById("title").innerText=
            g.title || "";

        document.getElementById("date").innerText=
            g.date ? "등록일 : " + g.date : "";

        document.getElementById("content").innerText=
            g.content || "";

        const image=
            document.getElementById("image");

        if(g.image){

            image.src=g.image;
            image.style.display="block";

        }else{

            image.style.display="none";

        }

        document.title=
            (g.title || "갤러리 보기") +
            " | 가수인생활 엔터테인먼트";

    }catch(error){

        console.error(error);

        showMessage(
            "갤러리 정보를 불러오는 중 오류가 발생했습니다."
        );

    }

}


function showMessage(text){

    document.querySelector(".container").innerHTML=`

        <div class="message">

            <h2>${text}</h2>

            <br>

            <a 
                href="gallery.html" 
                class="back">
                갤러리 목록으로
            </a>

        </div>

    `;

}


loadGallery();

</script>

</body>
</html>
