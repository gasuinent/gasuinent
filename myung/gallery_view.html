<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>갤러리 보기</title>

<style>

body{
margin:0;
background:#111;
color:#fff;
font-family:Malgun Gothic,sans-serif;
}

header{
background:#222;
padding:20px;
text-align:center;
}

header h1{
margin:0;
color:#FFD700;
font-size:34px;
}

.container{
width:90%;
max-width:1000px;
margin:30px auto;
}

.image{

width:100%;
max-width:800px;
display:block;
margin:auto;
border-radius:10px;
margin-bottom:30px;

}

.title{

font-size:30px;
font-weight:bold;
margin-bottom:20px;

}

.date{

color:#aaa;
margin-bottom:25px;

}

.content{

font-size:18px;
line-height:1.8;
white-space:pre-wrap;
margin-bottom:40px;

}

.back{

display:inline-block;
padding:12px 25px;
background:#FFD700;
color:#000;
text-decoration:none;
border-radius:8px;
font-weight:bold;

}

</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import{

getFirestore,
doc,
getDoc

}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const params=new URLSearchParams(location.search);

const id=params.get("id");
async function loadGallery(){

const snap=await getDoc(doc(db,"gallery",id));

if(!snap.exists()){

document.body.innerHTML="<h2 style='text-align:center;margin-top:100px;'>사진이 없습니다.</h2>";

return;

}

const g=snap.data();

document.getElementById("image").src=g.image;
document.getElementById("title").innerText=g.title;
document.getElementById("date").innerText=g.date;
document.getElementById("content").innerText=g.content;

}

loadGallery();

</script>

</head>

<body>

<header>

<h1>🖼 갤러리 보기</h1>

</header>

<div class="container">

<img
id="image"
class="image">

<div
id="title"
class="title">
</div>

<div
id="date"
class="date">
</div>

<div
id="content"
class="content">
</div>

<a
href="gallery.html"
class="back">

목록으로

</a>

</div>

</body>

</html>
