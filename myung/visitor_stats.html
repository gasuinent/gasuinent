<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방문자 통계</title><style>body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}.wrap{max-width:1000px;margin:30px auto;padding:0 20px}h1{color:#FFD700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#1d1d1d;border:1px solid #444;border-radius:12px;padding:22px}.num{font-size:36px;font-weight:bold;color:#FFD700;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:25px;background:#1d1d1d}th,td{padding:12px;border-bottom:1px solid #444;text-align:center}th{color:#FFD700;background:#292929}button{padding:11px 18px;border:0;border-radius:7px;background:#FFD700;font-weight:bold;cursor:pointer;margin:5px}@media(max-width:700px){.cards{grid-template-columns:1fr}.wrap{padding:0 12px}}</style></head><body><div class="wrap"><h1>📊 방문자 통계</h1><p style="color:#bbb">개인 식별정보 없이 홈페이지 방문 흐름을 통계로 확인합니다.</p><button onclick="location.href='admin.html'">🏠 관리 메인</button><button onclick="location.href='../index.html'">홈페이지 보기</button><div class="cards"><div class="card">오늘 방문 조회수<div id="views" class="num">-</div></div><div class="card">오늘 순 방문자<div id="unique" class="num">-</div></div><div class="card">최근 7일 조회수<div id="week" class="num">-</div></div></div><h2>최근 7일 방문 통계</h2><table><thead><tr><th>날짜</th><th>조회수</th><th>순 방문자</th></tr></thead><tbody id="rows"></tbody></table><h2>오늘 많이 본 페이지</h2><table><thead><tr><th>페이지</th><th>조회수</th></tr></thead><tbody id="pages"></tbody></table></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";import{collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87"};const db=getFirestore(initializeApp(cfg));const day=new Date();const fmt=d=>d.toISOString().slice(0,10);const days=[];for(let i=0;i<7;i++){const d=new Date(day);d.setDate(day.getDate()-i);days.push(fmt(d))}async function load(){let week=0,html='',todayData=null;for(const d of days){const s=await getDoc(doc(db,'visitor_stats',d));const data=s.exists()?s.data():{};const uniqueSnap=await getDocs(query(collection(db,'visitor_unique'),where('date','==',d)));const u=uniqueSnap.size,v=Number(data.views||0);week+=v;if(d===days[0]){todayData=data;document.getElementById('views').textContent=v;document.getElementById('unique').textContent=u}html+=`<tr><td>${d}</td><td>${v}</td><td>${u}</td></tr>`}document.getElementById('week').textContent=week;document.getElementById('rows').innerHTML=html;const pages=(todayData&&todayData.pages)||{};document.getElementById('pages').innerHTML=Object.entries(pages).sort((a,b)=>b[1]-a[1]).map(([p,v])=>`<tr><td>${p}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan="2">아직 통계가 없습니다.</td></tr>'}load().catch(e=>{console.error(e);document.getElementById('rows').innerHTML='<tr><td colspan="3">통계를 불러오지 못했습니다.</td></tr>'});</script></body></html>
