<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>갤러리 | 가수인생활 엔터테인먼트</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Malgun Gothic,"맑은 고딕",sans-serif;
}

header{
    background:#050505;
    border-bottom:1px solid #222;
    padding:22px 30px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.logo{
    color:#e7c45a;
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover,
nav a.active{
    color:#FFD700;
}

.hero{
    text-align:center;
    padding:58px 20px 40px;
}

.hero .en{
    color:#FFD700;
    font-size:16px;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:8px;
}

.hero h1{
    margin:0 0 20px;
    font-size:48px;
}

.hero p{
    margin:0;
    color:#c8c8c8;
    font-size:18px;
}

.container{
    width:92%;
    max-width:1200px;
    margin:0 auto 70px;
}

/* 항상 3열 × 2행 */
.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:22px;
}

.gallery-card{
    min-width:0;
    background:#171717;
    border:1px solid #333;
    border-radius:16px;
    overflow:hidden;
    transition:transform .2s,border-color .2s;
}

.gallery-card:hover{
    transform:translateY(-3px);
    border-color:#8c752b;
}

.gallery-card a{
    color:inherit;
    text-decoration:none;
    display:block;
}

.gallery-image{
    width:100%;
    height:245px;
    display:block;
    object-fit:cover;
    background:#222;
}

.no-image{
    width:100%;
    height:245px;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#666;
}

.gallery-info{
    padding:17px 18px 19px;
}

.gallery-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.gallery-date{
    color:#999;
    font-size:13px;
    margin-bottom:9px;
}

.gallery-content{
    color:#cfcfcf;
    font-size:14px;
    line-height:1.55;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.empty-card{
    visibility:hidden;
}

.list-section{
    margin-top:60px;
}

.list-section h2{
    font-size:24px;
    border-left:4px solid #FFD700;
    padding-left:12px;
    margin-bottom:18px;
}

.gallery-list{
    border-top:1px solid #333;
}

.list-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:15px 5px;
    border-bottom:1px solid #333;
}

.list-item a{
    display:flex;
    align-items:center;
    gap:18px;
    width:100%;
    color:#fff;
    text-decoration:none;
}

.list-thumb{
    width:120px;
    height:78px;
    object-fit:cover;
    border-radius:8px;
    background:#222;
    flex-shrink:0;
}

.list-title{
    font-size:17px;
    font-weight:bold;
}

.list-date{
    color:#999;
    font-size:13px;
    margin-top:7px;
}

.empty-list{
    padding:25px 5px;
    color:#777;
}

@media(max-width:800px){
    .header-inner{
        flex-direction:column;
        align-items:center;
    }

    nav{
        justify-content:center;
    }

    .gallery-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        grid-template-rows:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .gallery-image,
    .no-image{
        height:150px;
    }

    .gallery-info{
        padding:11px;
    }

    .gallery-title{
        font-size:15px;
    }

    .gallery-content{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
<div class="header-inner">
    <div class="logo">가수인생활 엔터테인먼트</div>

    <nav>
        <a href="index.html">홈</a>
        <a href="company.html">회사소개</a>
        <a href="news.html">뉴스</a>
        <a href="notice.html">공지</a>
        <a href="schedule.html">일정</a>
        <a href="gallery.html" class="active">갤러리</a>
        <a href="contact.html">문의</a>
    </nav>
</div>
</header>

<section class="hero">
    <div class="en">GALLERY</div>
    <h1>갤러리</h1>
    <p>공연, 행사, 봉사활동의 현장 모습을 분야별로 기록해 공개합니다.</p>
</section>

<main class="container">

    <div id="galleryGrid" class="gallery-grid"></div>

    <section class="list-section">
        <h2>갤러리 목록</h2>
        <div id="galleryList" class="gallery-list"></div>
    </section>

</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={
    apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain:"gasuinent.firebaseapp.com",
    projectId:"gasuinent",
    storageBucket:"gasuinent.firebasestorage.app",
    messagingSenderId:"122370674182",
    appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId:"G-39M5K1M6K7"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function makeCard(item){
    const image=item.image
        ? `<img class="gallery-image" src="${item.image}" alt="${escapeHtml(item.title)}">`
        : `<div class="no-image">사진 없음</div>`;

    return `
    <article class="gallery-card">
        <a href="gallery_view.html?id=${item.id}">
            ${image}
            <div class="gallery-info">
                <div class="gallery-title">${escapeHtml(item.title)}</div>
                <div class="gallery-date">${escapeHtml(item.date)}</div>
                <div class="gallery-content">${escapeHtml(item.content)}</div>
            </div>
        </a>
    </article>`;
}

async function loadGallery(){
    const snapshot=await getDocs(collection(db,"gallery"));
    const rows=[];

    snapshot.forEach(docItem=>{
        rows.push({
            id:docItem.id,
            ...docItem.data()
        });
    });

    rows.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));

    /*
      1. 고정된 사진 중 앞의 3개를 메인 고정 영역으로 사용
      2. 고정되지 않은 최신 사진으로 남은 칸을 채움
      3. 메인 영역은 무조건 6칸
      4. 메인에 들어간 사진은 아래 목록에서 제외
      5. 7번째 이후 자료가 목록으로 내려감
    */
    const pinnedList=rows
        .filter(item=>item.pinned===true)
        .slice(0,3);

    const pinnedIds=new Set(pinnedList.map(item=>item.id));

    const recentList=rows
        .filter(item=>item.pinned!==true)
        .slice(0,6-pinnedList.length);

    const displayList=[...pinnedList,...recentList];

    const displayIds=new Set(displayList.map(item=>item.id));

    while(displayList.length<6){
        displayList.push(null);
    }

    document.getElementById("galleryGrid").innerHTML=
        displayList
        .map(item=>item
            ? makeCard(item)
            : `<div class="gallery-card empty-card"></div>`)
        .join("");

    const listRows=rows.filter(item=>!displayIds.has(item.id));

    if(listRows.length===0){
        document.getElementById("galleryList").innerHTML=
            `<div class="empty-list">등록된 추가 갤러리가 없습니다.</div>`;
        return;
    }

    document.getElementById("galleryList").innerHTML=
        listRows.map(item=>`
        <div class="list-item">
            <a href="gallery_view.html?id=${item.id}">
                ${item.image
                    ? `<img class="list-thumb" src="${item.image}" alt="${escapeHtml(item.title)}">`
                    : `<div class="list-thumb"></div>`}
                <div>
                    <div class="list-title">${escapeHtml(item.title)}</div>
                    <div class="list-date">${escapeHtml(item.date)}</div>
                </div>
            </a>
        </div>
        `).join("");
}

loadGallery();
</script>

</body>
</html>
