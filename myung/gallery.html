<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리</title>
<style>
body{
margin:0;
background:#111;
color:#fff;
font-family:Malgun Gothic,sans-serif;
}
header{
background:#222;
padding:20px;
text-align:center;
}
header h1{
margin:0;
color:#FFD700;
font-size:34px;
}
.container{
width:90%;
max-width:1200px;
margin:30px auto;
}

/* 항상 6개 고정 - 3열 x 2행 */
.gallery-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery-box{
background:#1b1b1b;
border:1px solid #333;
border-radius:10px;
overflow:hidden;
min-height:300px;
}

.gallery-box.empty{
visibility:hidden;
}

.gallery-box a{
display:block;
color:#fff;
text-decoration:none;
}

.gallery-box img{
width:100%;
height:210px;
object-fit:cover;
display:block;
}

.gallery-info{
padding:16px;
}

.gallery-title{
font-size:20px;
font-weight:bold;
margin-bottom:8px;
}

.gallery-date{
color:#999;
font-size:13px;
}

.gallery-content{
color:#ccc;
font-size:14px;
line-height:1.5;
margin-top:10px;
}

.section-title{
margin-top:45px;
border-left:4px solid #FFD700;
padding-left:12px;
}

.gallery-list{
border-top:1px solid #333;
}

.list-item{
display:flex;
gap:15px;
padding:15px 5px;
border-bottom:1px solid #333;
}

.list-item img{
width:110px;
height:75px;
object-fit:cover;
border-radius:6px;
}

.list-title{
font-size:17px;
font-weight:bold;
}

.list-date{
color:#999;
font-size:13px;
margin-top:7px;
}

@media(max-width:800px){
.gallery-grid{
grid-template-columns:repeat(2,1fr);
}
}

@media(max-width:520px){
.gallery-grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>🖼 갤러리</h1>
</header>

<div class="container">

<div id="galleryGrid" class="gallery-grid"></div>

<h2 class="section-title">갤러리 목록</h2>

<div id="galleryList" class="gallery-list"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


function makeCard(g){

return `

<div class="gallery-box">

<a href="gallery_view.html?id=${g.id}">

${g.image?
`<img src="${g.image}" alt="${g.title||"갤러리 사진"}">`
:
`<div style="height:210px;background:#222;"></div>`
}

<div class="gallery-info">

<div class="gallery-title">
${g.title||""}
</div>

<div class="gallery-date">
${g.date||""}
</div>

<div class="gallery-content">
${g.content||""}
</div>

</div>

</a>

</div>

`;

}


async function loadGallery(){

const snapshot=await getDocs(
collection(db,"gallery")
);

const rows=[];

snapshot.forEach(d=>{

rows.push({
id:d.id,
...d.data()
});

});


/* 전체 최신순 정렬 */
rows.sort(
(a,b)=>
(b.timestamp||0)-
(a.timestamp||0)
);


/* 
1. 상단 3개: 관리자 고정(pinned === true)된 항목을 최신순으로 최대 3개 추출 
*/
const pinnedItems = rows
.filter(g => g.pinned === true)
.slice(0, 3);

const pinnedIds = new Set(pinnedItems.map(g => g.id));


/* 
2. 하단 3개 및 목록을 위해 상단에 들어간 고정 항목을 제외한 나머지 전체 준비 
*/
const remainingRows = rows.filter(g => !pinnedIds.has(g.id));


/* 
하단 3개: 남은 항목 중 최신 3개 추출
(만약 고정 글이 3개보다 적어서 상단 빈자리가 생기면, 남은 최신 글이 위로 올라오지 않도록 
 상단/하단을 정확히 분리하기 위해 고정 글 개수와 상관없이 하단은 최신순 3개를 고정 확보합니다)
*/

// 상단 고정 영역 채우기 (정확히 3개가 되도록 부족하면 최신 일반 글로 채움)
const topSection = [...pinnedItems];
let normalPool = [...remainingRows];

while(topSection.length < 3 && normalPool.length > 0) {
    topSection.push(normalPool.shift());
}

const topIds = new Set(topSection.map(g => g.id));
const afterTopRows = rows.filter(g => !topIds.has(g.id));

// 하단 영역 채우기 (최신순 3개)
const bottomSection = afterTopRows.slice(0, 3);
const bottomIds = new Set(bottomSection.map(g => g.id));

/* 최종 상단 그리드 6개 구성 (상단 3개 + 하단 3개) */
const main = [...topSection, ...bottomSection];

while(main.length < 6){
    main.push(null);
}

document.getElementById(
"galleryGrid"
).innerHTML=

main.map(g=>

g?
makeCard(g):
`<div class="gallery-box empty"></div>`

).join("");


/*
메인 6개(상단 3개 + 하단 3개)에 들어간 자료는 목록에서 제외.
나머지 7번째 데이터부터 목록으로 표시.
*/

const mainIds = new Set(main.filter(g => g).map(g => g.id));
const list = rows.filter(g => !mainIds.has(g.id));


if(list.length===0){

document.getElementById(
"galleryList"
).innerHTML=

`<div style="padding:20px 5px;color:#999;">
등록된 추가 갤러리가 없습니다.
</div>`;

return;

}


document.getElementById(
"galleryList"
).innerHTML=

list.map(g=>`

<a
href="gallery_view.html?id=${g.id}"
style="color:inherit;text-decoration:none;">

<div class="list-item">

${g.image?
`<img src="${g.image}" alt="${g.title||"갤러리 사진"}">`
:
""
}

<div>

<div class="list-title">
${g.title||""}
</div>

<div class="list-date">
${g.date||""}
</div>

</div>

</div>

</a>

`).join("");

}


loadGallery();

</script>

</body>
</html>
