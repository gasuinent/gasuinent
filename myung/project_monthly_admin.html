<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>월별 활동기록 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}.wrap{width:95%;max-width:1100px;margin:28px auto}.card{background:#1e1e1e;border:1px solid #444;border-radius:12px;padding:24px;margin-bottom:24px}h1,h2{color:#FFD700}h1{text-align:center}label{display:block;color:#FFD700;font-weight:bold;margin:16px 0 7px}input,select,textarea{width:100%;padding:12px;background:#181818;color:#fff;border:1px solid #555;border-radius:7px;font-size:16px}textarea{min-height:120px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.btns{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}button{padding:11px 20px;border:0;border-radius:8px;background:#FFD700;color:#000;font-weight:bold;cursor:pointer}.secondary{background:#555;color:#fff}.note{color:#aaa;font-size:14px;line-height:1.6}.list{border-top:1px solid #444;margin-top:20px}.item{padding:18px 0;border-bottom:1px solid #444}.item strong{color:#FFD700}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photos img{width:110px;height:80px;object-fit:cover;border-radius:6px}.docs a{display:block;color:#FFD700;margin-top:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>📅 월별 활동기록 관리</h1><div class="card"><h2>월별 기록 등록</h2><p class="note">MOU 대표 실적을 선택한 뒤 매월 진행한 정기 무료공연·찾아가는 노래교실 기록을 추가합니다.</p><label>대표 실적</label><select id="project"><option value="">실적을 불러오는 중...</option></select><div class="grid"><div><label>활동 월</label><input id="month" type="month"></div><div><label>활동 날짜</label><input id="date" type="date"></div></div><label>활동 제목</label><input id="title" placeholder="예: 2026년 9월 정기 무료공연 및 찾아가는 노래교실"><label>활동 내용</label><textarea id="content" placeholder="공연 및 노래교실에서 진행한 내용을 입력하세요."></textarea><label>활동 결과</label><textarea id="result" placeholder="참여자와 함께한 활동 결과, 문화예술 참여 내용 등을 입력하세요."></textarea><label>관련 사진</label><input id="images" type="file" accept="image/*" multiple><div class="note">사진은 여러 장 선택할 수 있습니다.</div><label>관련 문서</label><input id="documents" type="file" accept="application/pdf,.pdf,image/*" multiple><div class="note">MOU 관련 확인서나 스캔 문서 등 PDF/JPG/PNG를 여러 개 선택할 수 있습니다.</div><div class="btns"><button id="save">월별 기록 저장</button><button class="secondary" onclick="location.href='project_admin.html'">실적관리로 돌아가기</button></div></div><div class="card"><h2>등록된 월별 기록</h2><div id="list" class="list">대표 실적을 선택하면 기록이 표시됩니다.</div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,getDocs,addDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const app=initializeApp(cfg),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id);let projects=[];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function loadProjects(){const s=await getDocs(collection(db,'projects'));projects=[];s.forEach(d=>projects.push({id:d.id,...d.data()}));projects.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$('project').innerHTML='<option value="">대표 실적을 선택하세요</option>'+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.title||'제목 없음')}</option>`).join('')}async function loadRecords(){const pid=$('project').value;if(!pid){$('list').textContent='대표 실적을 선택하면 기록이 표시됩니다.';return}const s=await getDocs(query(collection(db,'project_monthly_records'),orderBy('month','desc')));const rows=[];s.forEach(d=>{const x=d.data();if(x.projectId===pid)rows.push(x)});$('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><div><strong>${esc(x.month||'')}</strong> · ${esc(x.date||'')}<br><b>${esc(x.title||'')}</b></div><p>${esc(x.content||'')}</p><p>${esc(x.result||'')}</p>${Array.isArray(x.photos)&&x.photos.length?`<div class="photos">${x.photos.map((u,i)=>`<img src="${esc(u)}" alt="활동사진 ${i+1}">`).join('')}</div>`:''}${Array.isArray(x.documents)&&x.documents.length?`<div class="docs">${x.documents.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">📄 ${esc(d.name||'관련 문서')}</a>`).join('')}</div>`:''}</div>`).join(''):'등록된 월별 기록이 없습니다.'}$('project').onchange=loadRecords;$('save').onclick=async()=>{try{const projectId=$('project').value;if(!projectId){alert('대표 실적을 선택하세요.');return}const month=$('month').value;if(!month){alert('활동 월을 선택하세요.');return}const title=$('title').value.trim();if(!title){alert('활동 제목을 입력하세요.');return}const photos=[];for(const file of [...$('images').files]){const r=ref(storage,'projects/monthly/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+file.name);await uploadBytes(r,file);photos.push(await getDownloadURL(r))}const documents=[];for(const file of [...$('documents').files]){const r=ref(storage,'projects/documents/monthly/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+file.name);await uploadBytes(r,file);documents.push({name:file.name,url:await getDownloadURL(r),type:file.type||'application/octet-stream'})}await addDoc(collection(db,'project_monthly_records'),{projectId,month,date:$('date').value,title,content:$('content').value.trim(),result:$('result').value.trim(),photos,documents,createdAt:Date.now()});alert('월별 활동기록이 저장되었습니다.');$('month').value='';$('date').value='';$('title').value='';$('content').value='';$('result').value='';$('images').value='';$('documents').value='';await loadRecords()}catch(e){console.error(e);alert('저장 중 오류가 발생했습니다.\n'+(e.message||e))}};loadProjects();</script></body></html>
