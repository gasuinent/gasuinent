<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>실적관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}
header{background:#222;padding:22px;text-align:center;border-bottom:1px solid #444}
header h1{margin:0;color:#FFD700;font-size:34px}
.container{width:95%;max-width:1200px;margin:28px auto}
.card{background:#1e1e1e;border:1px solid #444;border-radius:12px;padding:22px;margin-bottom:24px}
h2{margin:0 0 18px;color:#FFD700}
.form-grid{width:100%;border:1px solid #444;border-radius:8px;overflow:hidden}
.form-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid #444}
.form-row:last-child{border-bottom:0}
.form-label{background:#2d2d2d;padding:14px;font-weight:bold;display:flex;align-items:center}
.form-field{padding:9px;background:#111;display:flex;align-items:center}
input,select,textarea{width:100%;padding:12px;background:#181818;color:#fff;border:1px solid #555;border-radius:7px;font-size:16px}
textarea{min-height:130px;resize:vertical}
button{background:#FFD700;color:#000;border:0;border-radius:8px;padding:11px 20px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#ffcc00}
.btn-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-secondary{background:#555;color:#fff}.btn-secondary:hover{background:#666}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{background:#333;padding:12px;border:1px solid #444}td{padding:10px;border:1px solid #444;text-align:center;color:#ddd}td:nth-child(3){text-align:left}
.small-btn{padding:7px 12px;font-size:14px;margin:2px}
.search{display:flex;gap:8px;margin-bottom:15px}.search input{max-width:360px}
.empty{text-align:center;color:#aaa;padding:25px}
.note{color:#aaa;font-size:14px;margin-top:10px;line-height:1.6}
@media(max-width:700px){.form-row{grid-template-columns:100px 1fr}.form-label{font-size:14px;padding:9px}.form-field{padding:7px}table{font-size:13px;display:block;overflow-x:auto;white-space:nowrap}.search{flex-direction:column}.search input{max-width:none}}
</style>
</head>
<body>
<header><h1>📊 실적관리</h1></header>
<div class="container">
<div class="card">
<h2 id="formTitle">실적 등록</h2>
<div class="form-grid">
<div class="form-row"><div class="form-label">구분</div><div class="form-field"><select id="category"><option>대표 공연</option><option>문화공연</option><option>축제</option><option>복지공연</option><option>봉사활동</option><option>문화예술</option><option>문화예술·봉사활동</option><option>무료공연</option><option>사회환원</option><option>기타</option></select></div></div>
<div class="form-row"><div class="form-label">실적 제목</div><div class="form-field"><input id="title" type="text" placeholder="예: 성주 안포2리 어르신 무료공연"></div></div>
<div class="form-row"><div class="form-label">주최 / 주관</div><div class="form-field"><input id="organizer" type="text" value="한국가수인생활협회 / 나가수공연단·봉사단"></div></div>
<div class="form-row"><div class="form-label">기간 / 날짜</div><div class="form-field"><input id="date" type="text" placeholder="예: 2026.08.19 또는 2026.01 ~ 2026.08"></div></div>
<div class="form-row"><div class="form-label">내용</div><div class="form-field"><textarea id="content" placeholder="공연이나 사업의 내용을 입력하세요."></textarea></div></div>
<div class="form-row"><div class="form-label">실적</div><div class="form-field"><textarea id="result" placeholder="진행 결과, 참여 인원, 활동 성과 등을 입력하세요."></textarea></div></div>
<div class="form-row"><div class="form-label">자세한 내용</div><div class="form-field"><textarea id="detail" placeholder="홈페이지에서 '자세히 보기'를 눌렀을 때 펼쳐질 상세 내용을 입력하세요."></textarea></div></div>
</div>
<div class="btn-row"><button id="saveProject">실적 저장</button><button id="resetProject" class="btn-secondary">입력 초기화</button><button id="adminHome" class="btn-secondary">🏠 관리 메인</button></div>
<p class="note">※ 이곳에서 저장한 실적은 홈페이지의 '실적' 페이지에 추가됩니다. 기존 홈페이지 디자인과 기존 실적은 그대로 유지됩니다.</p>
</div>
<div class="card">
<h2>등록된 실적</h2>
<div class="search"><input id="searchText" type="text" placeholder="실적 제목 검색"><button id="searchBtn">검색</button></div>
<table><thead><tr><th>번호</th><th>구분</th><th>실적 제목</th><th>날짜</th><th>수정</th><th>삭제</th></tr></thead><tbody id="projectBody"></tbody></table>
</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
let editId=null,allProjects=[];
const $=id=>document.getElementById(id);
function resetForm(){editId=null;$('formTitle').textContent='실적 등록';$('category').value='대표 공연';$('title').value='';$('organizer').value='한국가수인생활협회 / 나가수공연단·봉사단';$('date').value='';$('content').value='';$('result').value='';$('detail').value=''}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadProjects(){try{const snap=await getDocs(collection(db,'projects'));allProjects=[];snap.forEach(x=>allProjects.push({id:x.id,data:x.data()}));allProjects.sort((a,b)=>(b.data.createdAt||0)-(a.data.createdAt||0));renderProjects()}catch(e){console.error(e);$('projectBody').innerHTML='<tr><td colspan="6">실적을 불러오지 못했습니다.</td></tr>'}}
function renderProjects(){const key=$('searchText').value.trim().toLowerCase();const items=key?allProjects.filter(x=>(x.data.title||'').toLowerCase().includes(key)||(x.data.content||'').toLowerCase().includes(key)):allProjects;$('projectBody').innerHTML=items.length?items.map((x,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(x.data.category||'')}</td><td>${escapeHtml(x.data.title||'')}</td><td>${escapeHtml(x.data.date||'')}</td><td><button class="small-btn" onclick="editProject('${x.id}')">수정</button></td><td><button class="small-btn" onclick="deleteProject('${x.id}')">삭제</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">등록된 실적이 없습니다.</td></tr>'}
$('saveProject').onclick=async()=>{try{const title=$('title').value.trim();if(!title){alert('실적 제목을 입력하세요.');return}const data={category:$('category').value,title,organizer:$('organizer').value.trim(),date:$('date').value.trim(),content:$('content').value.trim(),result:$('result').value.trim(),detail:$('detail').value.trim(),updatedAt:Date.now()};if(editId){await updateDoc(doc(db,'projects',editId),data);alert('실적이 수정되었습니다.')}else{data.createdAt=Date.now();await addDoc(collection(db,'projects'),data);alert('실적이 등록되었습니다.')}resetForm();await loadProjects()}catch(e){console.error(e);alert('저장 중 오류가 발생했습니다.')}};
$('resetProject').onclick=resetForm;$('adminHome').onclick=()=>location.href='admin.html';$('searchBtn').onclick=renderProjects;$('searchText').addEventListener('keydown',e=>{if(e.key==='Enter')renderProjects()});
window.editProject=async id=>{const snap=await getDoc(doc(db,'projects',id));if(!snap.exists())return;const p=snap.data();editId=id;$('formTitle').textContent='실적 수정';$('category').value=p.category||'대표 공연';$('title').value=p.title||'';$('organizer').value=p.organizer||'';$('date').value=p.date||'';$('content').value=p.content||'';$('result').value=p.result||'';$('detail').value=p.detail||'';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteProject=async id=>{if(!confirm('이 실적을 삭제하시겠습니까?'))return;try{await deleteDoc(doc(db,'projects',id));await loadProjects()}catch(e){console.error(e);alert('삭제 중 오류가 발생했습니다.')}};
loadProjects();
</script>
</body>
</html>
