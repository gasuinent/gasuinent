<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>뉴스관리</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}.container{width:95%;max-width:1200px;margin:30px auto}input,textarea,select{width:100%;padding:12px;border:0;border-radius:8px;font-size:18px;box-sizing:border-box}textarea{height:250px;resize:vertical}button{background:#FFD700;color:#000;border:0;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}button:hover{background:#ffcc00}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#333;padding:12px}td{padding:10px;border-bottom:1px solid #444;text-align:center}.thumb{width:80px;border-radius:5px}.pagination{display:flex;justify-content:center;gap:8px;margin:25px 0 35px}.pagination button{min-width:42px;padding:9px 13px;background:#333;color:#fff;border:1px solid #555}.pagination button.active,.pagination button:hover{background:#FFD700;color:#000}.news-form-grid{width:100%;border:1px solid #444;border-radius:8px;overflow:hidden;margin-top:10px}.form-row{display:grid;grid-template-columns:135px 1fr;min-height:58px;border-bottom:1px solid #444}.form-label{background:#2d2d2d;display:flex;align-items:center;padding:10px 14px;font-size:17px;font-weight:bold}.form-field{background:#111;padding:8px 10px;display:flex;align-items:center;box-sizing:border-box}.form-field input[type=text],.form-field input[type=date],.form-field select{height:42px;padding:8px 12px}.photo-upload{display:grid;grid-template-columns:1fr;gap:8px;width:100%}.photo-upload input[type=file]{font-size:16px}.photo-preview{display:none;max-width:250px;max-height:180px;object-fit:contain;border-radius:8px;border:1px solid #555}.caption-input{font-size:15px!important;padding:9px!important}.form-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}.form-actions button{min-width:150px}.btn-secondary{background:#555!important;color:#fff!important}@media(max-width:700px){.form-row{grid-template-columns:100px 1fr}.form-label{font-size:14px;padding:8px}}
</style></head>
<body>
<header><h1>📰 뉴스관리</h1><div style="margin-top:20px"><input id="searchText" type="text" placeholder="뉴스 검색..." style="width:320px;padding:10px"><button id="searchBtn">검색</button></div></header>
<div class="container"><h2>등록된 뉴스</h2><table><thead><tr><th>번호</th><th>분류</th><th>사진</th><th>제목</th><th>작성일</th><th>보기</th><th>수정</th><th>삭제</th></tr></thead><tbody id="noticeBody"></tbody></table><div id="pagination" class="pagination"></div><hr><h2>뉴스 등록</h2>
<div class="news-form-grid">
<div class="form-row"><div class="form-label">뉴스 제목</div><div class="form-field"><input type="text" id="noticeTitle" placeholder="뉴스 제목을 입력하세요"></div></div>
<div class="form-row"><div class="form-label">📅 작성 날짜</div><div class="form-field"><input type="date" id="noticeDate"></div></div>
<div class="form-row"><div class="form-label">대표사진</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage" accept="image/*"><img id="previewImage" class="photo-preview"><input id="caption1" class="caption-input" type="text" placeholder="사진 설명(캡션) - 선택사항"></div></div></div>
<div class="form-row"><div class="form-label">본문 사진 2</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage2" accept="image/*"><img id="previewImage2" class="photo-preview"><input id="caption2" class="caption-input" type="text" placeholder="사진 설명(캡션) - 선택사항"></div></div></div>
<div class="form-row"><div class="form-label">본문 사진 3</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage3" accept="image/*"><img id="previewImage3" class="photo-preview"><input id="caption3" class="caption-input" type="text" placeholder="사진 설명(캡션) - 선택사항"></div></div></div>
<div class="form-row"><div class="form-label">본문 사진 4</div><div class="form-field"><div class="photo-upload"><input type="file" id="noticeImage4" accept="image/*"><img id="previewImage4" class="photo-preview"><input id="caption4" class="caption-input" type="text" placeholder="사진 설명(캡션) - 선택사항"></div></div></div>
<div class="form-row"><div class="form-label">뉴스 분류</div><div class="form-field"><select id="category"><option value="행사안내">행사안내</option><option value="무료공연">무료공연</option><option value="봉사활동">봉사활동</option><option value="노래교실">노래교실</option><option value="사회환원">사회환원</option><option value="보도자료">보도자료</option></select></div></div>
<div class="form-row"><div class="form-label">📌 공지 / 상단 고정</div><div class="form-field"><input type="checkbox" id="pinned" style="width:20px;height:20px"></div></div>
<div class="form-row"><div class="form-label">🎬 영상센터 연결</div><div class="form-field"><input type="checkbox" id="videoCenter" style="width:20px;height:20px"><span style="margin-left:10px;color:#bbb">체크하면 기사에 「🎬 우리 영상센터에서 공연영상 보기」 버튼이 표시됩니다.</span></div></div>
<div class="form-row"><div class="form-label">뉴스 내용</div><div class="form-field"><textarea id="noticeContent" placeholder="뉴스 내용을 입력하세요. 본문 사진은 [사진② 삽입], [사진③ 삽입], [사진④ 삽입] 위치에 표시됩니다."></textarea></div></div>
</div><div class="form-actions"><button id="saveNotice">뉴스 저장</button><button id="resetNotice" class="btn-secondary">입력 초기화</button><button id="adminHome" class="btn-secondary">🏠 관리 메인</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);let editId=null;
const ids=["noticeImage","noticeImage2","noticeImage3","noticeImage4"],previews=["previewImage","previewImage2","previewImage3","previewImage4"],captions=["caption1","caption2","caption3","caption4"];function today(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}noticeDate.value=today();
ids.forEach((id,i)=>document.getElementById(id).addEventListener("change",function(){const f=this.files[0],img=document.getElementById(previews[i]);if(!f){img.style.display="none";return}const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display="block"};r.readAsDataURL(f)}));
function compressImage(file,max=1800,quality=.82){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);c.toBlob(b=>b?resolve(b):reject(new Error("이미지 변환 실패")),"image/jpeg",quality)};im.onerror=reject;im.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}
async function uploadFile(file){const blob=await compressImage(file);const r=ref(storage,"notice/"+Date.now()+"_"+Math.random().toString(36).slice(2)+".jpg");await uploadBytes(r,blob,{contentType:"image/jpeg"});return getDownloadURL(r)}
const PAGE_SIZE=5;let currentPage=1,allNews=[],filteredNews=[];async function loadNotice(){try{const s=await getDocs(query(collection(db,"notice"),orderBy("timestamp","desc")));allNews=[];s.forEach(x=>allNews.push({id:x.id,data:x.data()}));filteredNews=[...allNews];renderNews()}catch(e){console.error(e);noticeBody.innerHTML='<tr><td colspan="8">뉴스를 불러오지 못했습니다.</td></tr>'}}
function renderNews(){const start=(currentPage-1)*PAGE_SIZE,items=filteredNews.slice(start,start+PAGE_SIZE);noticeBody.innerHTML=items.length?items.map((it,i)=>{const n=it.data;return `<tr><td>${start+i+1}</td><td>${n.category||"행사안내"}</td><td>${n.image?`<img src="${n.image}" class="thumb">`:"-"}</td><td>${n.title||""}</td><td>${n.date||""}</td><td><button onclick="viewNotice('${it.id}')">보기</button></td><td><button onclick="editNotice('${it.id}')">수정</button></td><td><button onclick="deleteNotice('${it.id}')">삭제</button></td></tr>`}).join(""):'<tr><td colspan="8">등록된 뉴스가 없습니다.</td></tr>';const total=Math.ceil(filteredNews.length/PAGE_SIZE);pagination.innerHTML=total>1?Array.from({length:total},(_,i)=>`<button class="${i+1===currentPage?'active':''}" onclick="changePage(${i+1})">${i+1}</button>`).join(""):""}
window.changePage=p=>{currentPage=p;renderNews();scrollTo({top:0,behavior:"smooth"})};
function resetForm(){editId=null;noticeTitle.value="";noticeContent.value="";category.value="행사안내";pinned.checked=false;videoCenter.checked=false;noticeDate.value=today();ids.forEach((id,i)=>{document.getElementById(id).value="";document.getElementById(previews[i]).style.display="none";document.getElementById(captions[i]).value=""})}
saveNotice.onclick=async()=>{try{const title=noticeTitle.value.trim(),content=noticeContent.value.trim();if(!title){alert("제목을 입력하세요.");return}if(!noticeDate.value){alert("작성 날짜를 선택하세요.");return}let old={};if(editId){const s=await getDoc(doc(db,"notice",editId));if(s.exists())old=s.data()}let image=old.image||"",images=Array.isArray(old.images)?[...old.images]:[];const files=ids.map(id=>document.getElementById(id).files[0]);if(files[0])image=await uploadFile(files[0]);for(let i=1;i<4;i++)if(files[i])images[i-1]=await uploadFile(files[i]);images=images.filter(Boolean);let oldCaps=Array.isArray(old.imageCaptions)?[...old.imageCaptions]:[];const caps=captions.map(id=>document.getElementById(id).value.trim());if(caps[0])oldCaps[0]=caps[0];for(let i=1;i<4;i++)if(caps[i])oldCaps[i]=caps[i];oldCaps=oldCaps.slice(0,4);const data={title,content,image,images,category:category.value,pinned:pinned.checked,videoCenter:videoCenter.checked,date:noticeDate.value,timestamp:Date.now(),imageCaption:oldCaps[0]||"",imageCaptions:oldCaps};if(editId){await updateDoc(doc(db,"notice",editId),data);alert("뉴스가 수정되었습니다.")}else{await addDoc(collection(db,"notice"),data);alert("뉴스가 등록되었습니다.")}resetForm();await loadNotice()}catch(e){console.error(e);alert("저장 중 오류가 발생했습니다. 이미지 용량을 줄이는 중이거나 저장 중 오류가 발생했습니다.")}};
resetNotice.onclick=resetForm;adminHome.onclick=()=>location.href="admin.html";window.deleteNotice=async id=>{if(!confirm("정말 삭제하시겠습니까?"))return;await deleteDoc(doc(db,"notice",id));await loadNotice()};window.editNotice=async id=>{editId=id;const s=await getDoc(doc(db,"notice",id));if(!s.exists())return;const n=s.data();noticeTitle.value=n.title||"";noticeContent.value=n.content||"";noticeDate.value=n.date||today();category.value=n.category||"행사안내";pinned.checked=n.pinned===true;videoCenter.checked=n.videoCenter===true;const urls=[n.image||"",...(Array.isArray(n.images)?n.images:[])],caps=Array.isArray(n.imageCaptions)?n.imageCaptions:[];urls.slice(0,4).forEach((u,i)=>{if(u){const im=document.getElementById(previews[i]);im.src=u;im.style.display="block"}});caps.slice(0,4).forEach((v,i)=>document.getElementById(captions[i]).value=v||"");scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};window.viewNotice=id=>location.href="../notice_view.html?id="+encodeURIComponent(id);searchBtn.onclick=()=>{const k=searchText.value.trim().toLowerCase();filteredNews=k?allNews.filter(x=>(x.data.title||"").toLowerCase().includes(k)||(x.data.content||"").toLowerCase().includes(k)):[...allNews];currentPage=1;renderNews()};loadNotice();
</script></body></html>
