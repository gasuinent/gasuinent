<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공지 보기</title>

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}

.container{
    width:90%;
    max-width:900px;
    margin:60px auto;
}

h1{
    color:#FFD700;
    font-size:42px;
    margin-bottom:15px;
}

.info{
    color:#bbb;
    margin-bottom:30px;
}

#content{
    font-size:20px;
    line-height:1.9;
    white-space:pre-wrap;
}

button{
    margin-top:40px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#FFD700;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffcc00;
}

</style>

</head>

<body>

<div class="container">

<h1 id="title">불러오는 중...</h1>

<div class="info" id="date"></div>

<div id="content"></div>

<button onclick="history.back()">
목록으로
</button>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain: "gasuinent.firebaseapp.com",
    projectId: "gasuinent",
    storageBucket: "gasuinent.firebasestorage.app",
    messagingSenderId: "122370674182",
    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId: "G-39M5K1M6K7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const id = params.get("id");

if(id){

const snap = await getDoc(doc(db,"notice",id));

if(snap.exists()){

const n = snap.data();

document.getElementById("title").textContent = n.title;
document.getElementById("date").textContent = n.date;
document.getElementById("content").textContent = n.content;

}

}

</script>

</body>
</html>
