<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스관리</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}
header{
    background:#222;
    padding:20px;
    text-align:center;
}
header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}
.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}
input,textarea,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
    box-sizing:border-box;
}
textarea{
    height:250px;
    resize:vertical;
}
label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}
.date-label{
    font-size:24px;
    color:#FFD700;
}
.date-input{
    height:58px;
    font-size:24px;
    font-weight:bold;
    padding:10px 16px;
    background:#fff;
    color:#111;
}
button{
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    padding:12px 25px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#ffcc00;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th{
    background:#333;
    padding:12px;
}
td{
    padding:10px;
    border-bottom:1px solid #444;
    text-align:center;
}
.thumb{
    width:80px;
    border-radius:5px;
}
.news-form-grid{
    width:100%;
    border:1px solid #444;
    border-radius:8px;
    overflow:hidden;
    margin-top:10px;
}
.form-row{
    display:grid;
    grid-template-columns:125px 1fr;
    min-height:58px;
    border-bottom:1px solid #444;
}
.form-row:last-child{
    border-bottom:none;
}
.form-label{
    background:#2d2d2d;
    display:flex;
    align-items:center;
    padding:10px 14px;
    font-size:17px;
    font-weight:bold;
    box-sizing:border-box;
}
.form-field{
    background:#111;
    padding:8px 10px;
    display:flex;
    align-items:center;
    box-sizing:border-box;
}
.form-field input[type="text"],
.form-field input[type="date"],
.form-field select{
    width:100%;
    height:42px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    font-size:17px;
    box-sizing:border-box;
}
.form-field input[type="file"]{
    font-size:16px;
}
.form-field textarea{
    width:100%;
    height:130px;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:17px;
    box-sizing:border-box;
    resize:vertical;
}
.checkbox-field{
    justify-content:flex-start;
}
.checkbox-field input{
    width:20px;
    height:20px;
}
.calendar-icon{
    font-size:30px;
    margin-right:7px;
    line-height:1;
}
.content-row{
    min-height:150px;
}

</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    getDoc,
    updateDoc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain: "gasuinent.firebaseapp.com",
    projectId: "gasuinent",
    storageBucket: "gasuinent.firebasestorage.app",
    messagingSenderId: "122370674182",
    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId: "G-39M5K1M6K7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.db = db;
window.storage = storage;
window.editId = null;
</script>
</head>

<body>

<header>
<h1>📰 뉴스관리</h1>

<div style="margin-top:20px">
<input
id="searchText"
type="text"
placeholder="뉴스 검색..."
style="width:320px;padding:10px;border-radius:6px;border:none;">
<button id="searchBtn">검색</button>
</div>
</header>

<div class="container">

<h2>등록된 뉴스</h2>

<table>
<tr>
<th>번호</th>
<th>분류</th>
<th>사진</th>
<th>제목</th>
<th>작성일</th>
<th>보기</th>
<th>수정</th>
<th>삭제</th>
</tr>

<tbody id="noticeBody"></tbody>
</table>

<hr>

<h2>뉴스 등록</h2>

<div class="news-form-grid">

<div class="form-row">
    <div class="form-label">뉴스 제목</div>
    <div class="form-field">
        <input type="text" id="noticeTitle" placeholder="뉴스 제목을 입력하세요">
    </div>
</div>

<div class="form-row">
    <div class="form-label">
        <span class="calendar-icon">📅</span> 작성 날짜
    </div>
    <div class="form-field">
        <input type="date" id="noticeDate">
    </div>
</div>

<div class="form-row">
    <div class="form-label">사진 선택</div>
    <div class="form-field">
        <input type="file" id="noticeImage">
        <img id="previewImage" style="max-width:250px;margin-top:10px;display:none;border-radius:8px;">
    </div>
</div>

<div class="form-row">
    <div class="form-label">뉴스 분류</div>
    <div class="form-field">
        <select id="category">
            <option value="행사안내">행사안내</option>
            <option value="무료공연">무료공연</option>
            <option value="봉사활동">봉사활동</option>
            <option value="노래교실">노래교실</option>
            <option value="사회환원">사회환원</option>
            <option value="보도자료">보도자료</option>
        </select>
    </div>
</div>

<div class="form-row">
    <div class="form-label">📌 공지 / 상단 고정</div>
    <div class="form-field checkbox-field">
        <input type="checkbox" id="pinned">
    </div>
</div>

<div class="form-row content-row">
    <div class="form-label">뉴스 내용</div>
    <div class="form-field">
        <textarea id="noticeContent" placeholder="뉴스 내용을 입력하세요"></textarea>
    </div>
</div>

</div>

<button id="saveNotice">뉴스 저장</button>

<button
onclick="location.href='admin.html'"
style="
margin-left:15px;
padding:12px 25px;
background:#555;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;">
🏠 관리 메인
</button>

<script type="module">
import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    getDoc,
    updateDoc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const db = window.db;
const storage = window.storage;

function getToday(){
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2,"0");
    const d = String(now.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
}

/* 처음 열었을 때 오늘 날짜를 기본값으로 넣음 */
document.getElementById("noticeDate").value = getToday();

document.getElementById("noticeImage").onchange = function () {

    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const img = document.getElementById("previewImage");
        img.src = e.target.result;
        img.style.display = "block";
    };

    reader.readAsDataURL(file);
};

document.getElementById("saveNotice").onclick = async () => {

    let title = document.getElementById("noticeTitle").value.trim();
    let content = document.getElementById("noticeContent").value.trim();
    let selectedDate = document.getElementById("noticeDate").value;
    let file = document.getElementById("noticeImage").files[0];

    if(title == ""){
        alert("제목을 입력하세요.");
        return;
    }

    if(!selectedDate){
        alert("📅 작성 날짜를 선택하세요.");
        return;
    }

    let imageUrl = "";

    if(window.editId){

        const snap = await getDoc(doc(db,"notice",window.editId));

        if(snap.exists()){
            imageUrl = snap.data().image || "";
        }
    }

    if(file){

        const storageRef = ref(
            storage,
            "notice/" + Date.now() + "_" + file.name
        );

        await uploadBytes(storageRef,file);
        imageUrl = await getDownloadURL(storageRef);
    }

    const data = {
        title:title,
        content:content,
        image:imageUrl,
        category:document.getElementById("category").value,
        pinned:document.getElementById("pinned").checked,

        /* 사용자가 직접 지정한 날짜 */
        date:selectedDate,

        /* 목록 정렬용 등록/수정 시간 */
        timestamp:Date.now()
    };

    if(window.editId){

        await updateDoc(
            doc(db,"notice",window.editId),
            data
        );

        alert("뉴스가 수정되었습니다.");
        window.editId = null;

    }else{

        await addDoc(
            collection(db,"notice"),
            data
        );

        alert("뉴스가 등록되었습니다.");
    }

    document.getElementById("noticeTitle").value = "";
    document.getElementById("noticeContent").value = "";
    document.getElementById("category").value = "행사안내";
    document.getElementById("pinned").checked = false;
    document.getElementById("noticeImage").value = "";
    document.getElementById("previewImage").style.display = "none";

    /* 다음 작성은 오늘 날짜를 기본값으로 시작 */
    document.getElementById("noticeDate").value = getToday();

    loadNotice();
};

async function loadNotice(){

    const q = query(
        collection(db,"notice"),
        orderBy("timestamp","desc")
    );

    const snapshot = await getDocs(q);

    let html = "";
    let no = 1;

    snapshot.forEach(docItem => {

        const n = docItem.data();

        html += `
        <tr>
        <td>${no++}</td>
        <td>${n.category || "행사안내"}</td>
        <td>
        ${n.image ?
        `<img src="${n.image}" class="thumb">`
        : "-"}
        </td>
        <td>${n.title || ""}</td>
        <td>${n.date || ""}</td>
        <td>
        <button onclick="viewNotice('${docItem.id}')">보기</button>
        </td>
        <td>
        <button onclick="editNotice('${docItem.id}')">수정</button>
        </td>
        <td>
        <button onclick="deleteNotice('${docItem.id}')">삭제</button>
        </td>
        </tr>
        `;
    });

    document.getElementById("noticeBody").innerHTML = html;
}

async function deleteNotice(id){

    if(!confirm("정말 삭제하시겠습니까?")) return;

    await deleteDoc(doc(db,"notice",id));
    loadNotice();
}

window.deleteNotice = deleteNotice;

async function editNotice(id){

    window.editId = id;

    const snap = await getDoc(doc(db,"notice",id));

    if(!snap.exists()) return;

    const n = snap.data();

    document.getElementById("noticeTitle").value = n.title || "";
    document.getElementById("noticeContent").value = n.content || "";

    /* 기존 뉴스의 지정 날짜를 불러옴 */
    document.getElementById("noticeDate").value =
        n.date || getToday();

    document.getElementById("category").value =
        n.category || "행사안내";

    document.getElementById("pinned").checked =
        n.pinned === true;

    const img = document.getElementById("previewImage");

    if(n.image){
        img.src = n.image;
        img.style.display = "block";
    }else{
        img.style.display = "none";
    }

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}

window.editNotice = editNotice;

window.viewNotice = function(id){
    location.href = "../notice_view.html?id=" + id;
};

document.getElementById("searchBtn").onclick = async () => {

    const keyword =
        document.getElementById("searchText").value.toLowerCase();

    const snapshot = await getDocs(collection(db,"notice"));

    let html = "";
    let no = 1;

    snapshot.forEach(docItem => {

        const n = docItem.data();

        if(
            (n.title || "").toLowerCase().includes(keyword) ||
            (n.content || "").toLowerCase().includes(keyword)
        ){

            html += `
            <tr>
            <td>${no++}</td>
            <td>${n.category || "행사안내"}</td>
            <td>
            ${n.image ?
            `<img src="${n.image}" class="thumb">`
            : "-"}
            </td>
            <td>${n.title || ""}</td>
            <td>${n.date || ""}</td>
            <td>
            <button onclick="viewNotice('${docItem.id}')">보기</button>
            </td>
            <td>
            <button onclick="editNotice('${docItem.id}')">수정</button>
            </td>
            <td>
            <button onclick="deleteNotice('${docItem.id}')">삭제</button>
            </td>
            </tr>
            `;
        }
    });

    document.getElementById("noticeBody").innerHTML = html;
};

loadNotice();

</script>

</div>
</body>
</html>
