<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 관리</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}.container{width:95%;max-width:1200px;margin:30px auto}input,textarea,select{width:100%;padding:12px;border:none;border-radius:8px;font-size:18px;box-sizing:border-box}textarea{height:220px;resize:vertical}label{display:block;margin-top:20px;margin-bottom:8px;font-weight:bold}button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}button:hover{background:#ffcc00}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#333;padding:12px}td{padding:10px;border-bottom:1px solid #444;text-align:center}.date-label{display:flex;align-items:center;gap:10px;font-size:22px}.date-icon{font-size:28px}#fileDate{height:50px;font-size:18px}.file-info{margin-top:10px;color:#aaa}.empty{padding:30px;color:#aaa;text-align:center}.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin:25px 0 35px}.pagination button{min-width:42px;padding:9px 13px;background:#333;color:#fff;border:1px solid #555}.pagination button:hover,.pagination button.active{background:#FFD700;color:#000;border-color:#FFD700}.pagination button.arrow{background:#555}.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}.photo-box{background:#1b1b1b;border:1px solid #444;border-radius:8px;padding:15px}.photo-preview{display:block;width:100%;height:180px;object-fit:contain;background:#222;border-radius:6px;margin-top:10px}.photo-note{color:#aaa;font-size:14px;margin-top:8px}@media(max-width:700px){.photo-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>📁 자료실 관리</h1><div style="margin-top:20px"><input id="searchText" type="text" placeholder="자료 검색..." style="width:320px;padding:10px;border-radius:6px;border:none"><button id="searchBtn">검색</button><button id="allBtn" style="margin-left:8px;background:#555;color:#fff">전체보기</button></div></header>
<div class="container">
<h2>등록된 자료</h2>
<table><thead><tr><th>번호</th><th>자료명</th><th>분류</th><th>등록일</th><th>보기</th><th>수정</th><th>삭제</th></tr></thead><tbody id="fileBody"></tbody></table>
<div id="pagination" class="pagination"></div><hr>
<h2 id="formTitle">자료 등록</h2>
<label>자료 제목</label><input type="text" id="fileTitle">
<label>자료 분류</label><select id="fileCategory"><option>공식뉴스</option><option>행사일정</option><option>공지자료</option><option>행사자료</option><option>신청서·양식</option><option>기타자료</option></select>
<label class="date-label"><span class="date-icon">📅</span><span>작성 날짜</span></label><input type="date" id="fileDate">
<label>파일 선택</label><input type="file" id="fileUpload"><div id="fileInfo" class="file-info"></div>
<div class="photo-row">
<div class="photo-box"><label style="margin-top:0">사진 1 선택</label><input type="file" id="photo1" accept="image/*"><img id="photo1Preview" class="photo-preview" style="display:none"><div id="photo1Info" class="photo-note"></div></div>
<div class="photo-box"><label style="margin-top:0">사진 2 선택</label><input type="file" id="photo2" accept="image/*"><img id="photo2Preview" class="photo-preview" style="display:none"><div id="photo2Info" class="photo-note"></div></div>
</div>
<label>자료 설명</label><textarea id="fileContent"></textarea>
<button id="saveFile">자료 저장</button><button id="cancelEdit" style="display:none;margin-left:15px;background:#777;color:#fff">수정 취소</button><button onclick="location.href='admin.html'" style="margin-left:15px;background:#555;color:#fff">🏠 관리 메인</button>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,getDoc,updateDoc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);let editId=null;const PAGE_SIZE=5;let currentPage=1,allFiles=[],filteredFiles=[];
function todayString(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};document.getElementById("fileDate").value=todayString();
function setupPreview(inputId,imgId,infoId){document.getElementById(inputId).addEventListener("change",function(){const f=this.files[0],img=document.getElementById(imgId),info=document.getElementById(infoId);if(f){img.src=URL.createObjectURL(f);img.style.display="block";info.textContent="선택된 사진: "+f.name}else{img.style.display="none";info.textContent=""}})}
setupPreview("photo1","photo1Preview","photo1Info");setupPreview("photo2","photo2Preview","photo2Info");
document.getElementById("fileUpload").addEventListener("change",function(){const f=this.files[0];document.getElementById("fileInfo").textContent=f?"선택된 파일: "+f.name:""});
async function uploadImage(file){if(!file)return"";const r=ref(storage,"files/photos/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+file.name);await uploadBytes(r,file);return await getDownloadURL(r)}
document.getElementById("saveFile").addEventListener("click",async()=>{try{const title=document.getElementById("fileTitle").value.trim(),category=document.getElementById("fileCategory").value,selectedDate=document.getElementById("fileDate").value,content=document.getElementById("fileContent").value.trim(),file=document.getElementById("fileUpload").files[0],p1=document.getElementById("photo1").files[0],p2=document.getElementById("photo2").files[0];if(!title)return alert("자료 제목을 입력하세요.");if(!selectedDate)return alert("작성 날짜를 선택하세요.");let data={title,category,content,date:selectedDate,timestamp:Date.now(),fileUrl:"",fileName:"",photo1Url:"",photo2Url:""};if(editId){const s=await getDoc(doc(db,"files",editId));if(s.exists()){const old=s.data();data.fileUrl=old.fileUrl||"";data.fileName=old.fileName||"";data.photo1Url=old.photo1Url||"";data.photo2Url=old.photo2Url||""}}if(file){const r=ref(storage,"files/"+Date.now()+"_"+file.name);await uploadBytes(r,file);data.fileUrl=await getDownloadURL(r);data.fileName=file.name}if(p1)data.photo1Url=await uploadImage(p1);if(p2)data.photo2Url=await uploadImage(p2);if(editId){await updateDoc(doc(db,"files",editId),data);alert("자료가 수정되었습니다.")}else{await addDoc(collection(db,"files"),data);alert("자료가 등록되었습니다.")}resetForm();await loadFiles()}catch(e){console.error(e);alert("자료 저장 중 오류가 발생했습니다.\n\n"+e.message)}});
function resetForm(){editId=null;document.getElementById("formTitle").textContent="자료 등록";document.getElementById("saveFile").textContent="자료 저장";document.getElementById("cancelEdit").style.display="none";document.getElementById("fileTitle").value="";document.getElementById("fileCategory").value="공식뉴스";document.getElementById("fileDate").value=todayString();document.getElementById("fileUpload").value="";document.getElementById("photo1").value="";document.getElementById("photo2").value="";document.getElementById("photo1Preview").style.display="none";document.getElementById("photo2Preview").style.display="none";document.getElementById("photo1Info").textContent="";document.getElementById("photo2Info").textContent="";document.getElementById("fileContent").value="";document.getElementById("fileInfo").textContent=""}
async function loadFiles(){const q=query(collection(db,"files"),orderBy("timestamp","desc")),snap=await getDocs(q);allFiles=[];snap.forEach(item=>allFiles.push({id:item.id,data:item.data()}));filteredFiles=[...allFiles];currentPage=1;renderFiles()}
function renderFiles(){const start=(currentPage-1)*PAGE_SIZE,pageItems=filteredFiles.slice(start,start+PAGE_SIZE);let html="";if(!pageItems.length)html='<tr><td colspan="7" class="empty">등록된 자료가 없습니다.</td></tr>';else pageItems.forEach((item,index)=>{const f=item.data;html+=`<tr><td>${start+index+1}</td><td>${escapeHtml(f.title||"")}</td><td>${escapeHtml(f.category||"기타자료")}</td><td>${escapeHtml(f.date||"")}</td><td><button onclick="viewFile('${item.id}')">보기</button></td><td><button onclick="editFile('${item.id}')">수정</button></td><td><button onclick="deleteFile('${item.id}')">삭제</button></td></tr>`});document.getElementById("fileBody").innerHTML=html;renderPagination()}
function renderPagination(){const p=document.getElementById("pagination"),total=Math.ceil(filteredFiles.length/PAGE_SIZE);if(total<=1){p.innerHTML="";return}let h="";if(currentPage>1)h+=`<button class="arrow" onclick="changePage(${currentPage-1})">◀</button>`;for(let i=1;i<=total;i++)h+=`<button class="${i===currentPage?"active":""}" onclick="changePage(${i})">${i}</button>`;if(currentPage<total)h+=`<button class="arrow" onclick="changePage(${currentPage+1})">▶</button>`;p.innerHTML=h}
window.changePage=p=>{currentPage=p;renderFiles();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("searchBtn").addEventListener("click",()=>{const k=document.getElementById("searchText").value.toLowerCase().trim();filteredFiles=k?allFiles.filter(x=>{const f=x.data;return(f.title||"").toLowerCase().includes(k)||(f.content||"").toLowerCase().includes(k)||(f.category||"").toLowerCase().includes(k)}):[...allFiles];currentPage=1;renderFiles()});document.getElementById("allBtn").addEventListener("click",()=>{document.getElementById("searchText").value="";filteredFiles=[...allFiles];currentPage=1;renderFiles()});
window.editFile=async id=>{const s=await getDoc(doc(db,"files",id));if(!s.exists())return alert("자료를 찾을 수 없습니다.");const f=s.data();editId=id;document.getElementById("formTitle").textContent="자료 수정";document.getElementById("saveFile").textContent="자료 수정 저장";document.getElementById("cancelEdit").style.display="inline-block";document.getElementById("fileTitle").value=f.title||"";document.getElementById("fileCategory").value=f.category||"기타자료";document.getElementById("fileDate").value=f.date||todayString();document.getElementById("fileContent").value=f.content||"";document.getElementById("fileUpload").value="";document.getElementById("photo1").value="";document.getElementById("photo2").value="";document.getElementById("fileInfo").textContent=f.fileName?"현재 파일: "+f.fileName+" (새 파일 선택 시 교체)":"현재 첨부 파일 없음";document.getElementById("photo1Info").textContent=f.photo1Url?"현재 사진 1 있음 (새 사진 선택 시 교체)":"현재 사진 1 없음";document.getElementById("photo2Info").textContent=f.photo2Url?"현재 사진 2 있음 (새 사진 선택 시 교체)":"현재 사진 2 없음";window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
document.getElementById("cancelEdit").addEventListener("click",()=>{resetForm();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})});window.deleteFile=async id=>{if(!confirm("정말 삭제하시겠습니까?"))return;try{await deleteDoc(doc(db,"files",id));alert("자료가 삭제되었습니다.");await loadFiles()}catch(e){alert("자료 삭제 중 오류가 발생했습니다.\n\n"+e.message)}};window.viewFile=id=>location.href="file_view.html?id="+encodeURIComponent(id);function escapeHtml(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")};loadFiles();
</script>
</body>
</html>
