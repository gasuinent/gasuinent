<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>자료실 관리</title>

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}

header{
    background:#222;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

input,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
    box-sizing:border-box;
}

textarea{
    height:220px;
    resize:vertical;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

button{
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    padding:12px 25px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ffcc00;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#333;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #444;
    text-align:center;
}

</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import{
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
getDoc,
updateDoc,
query,
orderBy
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import{
getStorage,
ref,
uploadBytes,
getDownloadURL
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={

apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const storage=getStorage(app);

window.db=db;
window.storage=storage;
window.editId=null;

</script>

</head>

<body>

<header>

<h1>📁 자료실 관리</h1>

<div style="margin-top:20px">

<input
id="searchText"
type="text"
placeholder="자료 검색..."
style="width:320px;padding:10px;border-radius:6px;border:none;">

<button id="searchBtn">검색</button>

</div>

</header>

<div class="container">

<h2>등록된 자료</h2>

<table>

<tr>

<th>번호</th>
<th>자료명</th>
<th>등록일</th>
<th>보기</th>
<th>수정</th>
<th>삭제</th>

</tr>

<tbody id="fileBody"></tbody>

</table>

<hr>

<h2>자료 등록</h2>

<label>자료 제목</label>

<input
type="text"
id="fileTitle">

<label>파일 선택</label>

<input
type="file"
id="fileUpload">

<label>자료 설명</label>

<textarea
id="fileContent"></textarea>

<button id="saveFile">

자료 저장

</button>

<script type="module">
import{
collection,
addDoc,
getDocs,
deleteDoc,
doc,
getDoc,
updateDoc,
query,
orderBy
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import{
ref,
uploadBytes,
getDownloadURL
}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const db=window.db;
const storage=window.storage;

document.getElementById("saveFile").onclick=async()=>{

let title=document.getElementById("fileTitle").value.trim();
let content=document.getElementById("fileContent").value.trim();
let file=document.getElementById("fileUpload").files[0];

if(title==""){
    alert("자료 제목을 입력하세요.");
    return;
}

let fileUrl="";
let fileName="";

if(window.editId){

    const snap=await getDoc(doc(db,"files",window.editId));

    if(snap.exists()){

        fileUrl=snap.data().fileUrl||"";
        fileName=snap.data().fileName||"";

    }

}

if(file){

    const storageRef=ref(
        storage,
        "files/"+Date.now()+"_"+file.name
    );

    await uploadBytes(storageRef,file);

    fileUrl=await getDownloadURL(storageRef);

    fileName=file.name;

}

const data={

title:title,
content:content,
fileUrl:fileUrl,
fileName:fileName,
date:new Date().toISOString().slice(0,10),
timestamp:Date.now()

};

if(window.editId){

    await updateDoc(
        doc(db,"files",window.editId),
        data
    );

    alert("자료가 수정되었습니다.");

    window.editId=null;

}else{

    await addDoc(
        collection(db,"files"),
        data
    );

    alert("자료가 등록되었습니다.");

}

document.getElementById("fileTitle").value="";
document.getElementById("fileContent").value="";
document.getElementById("fileUpload").value="";

loadFiles();

};

async function loadFiles(){

const q=query(
collection(db,"files"),
orderBy("timestamp","desc")
);

const snapshot=await getDocs(q);

let html="";
let no=1;
 snapshot.forEach(docItem=>{

const f=docItem.data();

html+=`

<tr>

<td>${no++}</td>

<td>${f.title}</td>

<td>${f.date}</td>

<td>
<button onclick="viewFile('${docItem.id}')">
보기
</button>
</td>

<td>
<button onclick="editFile('${docItem.id}')">
수정
</button>
</td>

<td>
<button onclick="deleteFile('${docItem.id}')">
삭제
</button>
</td>

</tr>

`;

});

document.getElementById("fileBody").innerHTML=html;

}

async function deleteFile(id){

if(!confirm("정말 삭제하시겠습니까?")) return;

await deleteDoc(doc(db,"files",id));

loadFiles();

}

window.deleteFile=deleteFile;

async function editFile(id){

window.editId=id;

const snap=await getDoc(doc(db,"files",id));

if(!snap.exists()) return;

const f=snap.data();

document.getElementById("fileTitle").value=f.title;
document.getElementById("fileContent").value=f.content;

window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});

}

window.editFile=editFile;

window.viewFile=function(id){

location.href="file_view.html?id="+id;

};

document.getElementById("searchBtn").onclick=async()=>{

const keyword=document.getElementById("searchText").value.toLowerCase();

const snapshot=await getDocs(collection(db,"files"));

let html="";
let no=1;

snapshot.forEach(docItem=>{

const f=docItem.data();

if(

f.title.toLowerCase().includes(keyword) ||

f.content.toLowerCase().includes(keyword)

){

html+=`

<tr>

<td>${no++}</td>

<td>${f.title}</td>

<td>${f.date}</td>

<td><button onclick="viewFile('${docItem.id}')">보기</button></td>

<td><button onclick="editFile('${docItem.id}')">수정</button></td>

<td><button onclick="deleteFile('${docItem.id}')">삭제</button></td>

</tr>

`;

}

});
document.getElementById("fileBody").innerHTML=html;

};

loadFiles();

</script>

</div>

</body>

</html>
