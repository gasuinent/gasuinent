<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>미담 관리 | 가수인생활 엔터테인먼트</title><style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}.container{width:95%;max-width:1100px;margin:30px auto}h1{color:#FFD700;text-align:center}h2{margin-top:35px}.form{border:1px solid #444;border-radius:8px;overflow:hidden}.row{display:grid;grid-template-columns:125px 1fr;border-bottom:1px solid #444}.label{background:#2d2d2d;padding:14px;font-weight:bold;display:flex;align-items:center}.field{background:#111;padding:10px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:0;border-radius:6px;font-size:16px}.field textarea{min-height:150px;resize:vertical}.actions{text-align:center;margin:18px 0}.actions button,.list button{background:#FFD700;color:#000;border:0;border-radius:7px;padding:11px 20px;font-weight:bold;cursor:pointer;margin:4px}.list{width:100%;border-collapse:collapse}.list th,.list td{padding:10px;border-bottom:1px solid #444;text-align:center}.list th{background:#333}.thumb{width:80px;height:55px;object-fit:cover;border-radius:5px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo-box{display:flex;flex-direction:column;gap:8px}.photo-box input[type=file]{font-size:15px}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid #555;display:none}.help{color:#aaa;font-size:14px;margin-top:8px}@media(max-width:700px){.row{grid-template-columns:95px 1fr}.label{font-size:14px;padding:9px}.container{width:92%}.photos{grid-template-columns:1fr}.actions button{width:100%;max-width:320px}}
</style></head><body><div class="container"><h1>❤️ 미담 관리</h1><p style="color:#bbb;text-align:center;line-height:1.7">작지만 의미 있는 도움의 사례를 6하원칙으로 간단하게 기록합니다.</p><h2>미담 등록</h2><div class="form">
<div class="row"><div class="label">제목</div><div class="field"><input id="title" placeholder="예: 고장 난 전기차단기를 교체했습니다"></div></div>
<div class="row"><div class="label">언제</div><div class="field"><input id="date" type="date"></div></div>
<div class="row"><div class="label">어디서</div><div class="field"><input id="location" placeholder="시설명 또는 장소"></div></div>
<div class="row"><div class="label">누가</div><div class="field"><input id="who" placeholder="가수인생활 엔터테인먼트 / 나가수봉사단 등"></div></div>
<div class="row"><div class="label">무엇을</div><div class="field"><input id="what" placeholder="전기차단기 교체 등"></div></div>
<div class="row"><div class="label">왜</div><div class="field"><input id="why" placeholder="시설 이용에 불편이 발생하여"></div></div>
<div class="row"><div class="label">어떻게</div><div class="field"><input id="how" placeholder="현장을 확인하고 필요한 조치를 지원"></div></div>
<div class="row"><div class="label">사진 3장</div><div class="field"><div class="photos">
<div class="photo-box"><input id="image1" type="file" accept="image/*"><img id="p1" class="preview"><span class="help">사진 1</span></div>
<div class="photo-box"><input id="image2" type="file" accept="image/*"><img id="p2" class="preview"><span class="help">사진 2</span></div>
<div class="photo-box"><input id="image3" type="file" accept="image/*"><img id="p3" class="preview"><span class="help">사진 3</span></div>
</div><div class="help">사진은 3장까지 등록할 수 있습니다.</div></div></div>
<div class="row"><div class="label">내용</div><div class="field"><textarea id="content" placeholder="짧은 미담 내용을 작성하세요"></textarea></div></div></div>
<div class="actions"><button id="save">미담 저장</button><button onclick="location.href='admin.html'">관리 메인</button><button onclick="location.href='../midam.html'">미담 확인</button></div>
<h2>등록된 미담</h2><table class="list"><thead><tr><th>사진</th><th>제목</th><th>날짜</th><th>장소</th><th>삭제</th></tr></thead><tbody id="body"></tbody></table></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";
const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(cfg),db=getFirestore(app),storage=getStorage(app);const $=id=>document.getElementById(id);$('date').value=new Date().toISOString().slice(0,10);
['image1','image2','image3'].forEach((id,i)=>$(id).addEventListener('change',()=>{const f=$(id).files[0],p=$('p'+(i+1));if(!f){p.style.display='none';p.removeAttribute('src');return}if(!f.type.startsWith('image/')){alert('이미지 파일만 선택해주세요.');$(id).value='';p.style.display='none';return}const r=new FileReader();r.onload=e=>{p.src=e.target.result;p.style.display='block'};r.readAsDataURL(f)}));
function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function uploadPhoto(file,index){const safe=file.name.replace(/[^a-zA-Z0-9가-힣._-]/g,'_');const r=ref(storage,'midam/'+Date.now()+'_'+index+'_'+safe);await uploadBytes(r,file);return await getDownloadURL(r)}
async function load(){const b=$('body');try{const s=await getDocs(query(collection(db,'midam'),orderBy('timestamp','desc')));let h='';s.forEach(x=>{const d=x.data(),imgs=Array.isArray(d.images)?d.images:[];h+=`<tr><td>${imgs[0]?`<img class="thumb" src="${esc(imgs[0])}">`:'-'}</td><td>${esc(d.title)}</td><td>${esc(d.date)}</td><td>${esc(d.location)}</td><td><button onclick="del('${x.id}')">삭제</button></td></tr>`});b.innerHTML=h||'<tr><td colspan="5">등록된 미담이 없습니다.</td></tr>'}catch(e){console.error(e);b.innerHTML='<tr><td colspan="5">불러오지 못했습니다.</td></tr>'}}
$('save').onclick=async()=>{const title=$('title').value.trim(),date=$('date').value,location=$('location').value.trim();if(!title||!date||!location){alert('제목, 날짜, 장소는 입력해주세요.');return}const btn=$('save');btn.disabled=true;btn.textContent='사진 업로드 중...';try{const files=['image1','image2','image3'].map(id=>$(id).files[0]).filter(Boolean);const images=[];for(let i=0;i<files.length;i++)images.push(await uploadPhoto(files[i],i+1));await addDoc(collection(db,'midam'),{title,date,location,who:$('who').value.trim(),what:$('what').value.trim(),why:$('why').value.trim(),how:$('how').value.trim(),images,image:images[0]||'',content:$('content').value.trim(),timestamp:Date.now()});alert('미담이 등록되었습니다.');['title','location','who','what','why','how','content'].forEach(id=>$(id).value='');['image1','image2','image3'].forEach(id=>$(id).value='');['p1','p2','p3'].forEach(id=>{$(id).style.display='none';$(id).removeAttribute('src')});load()}catch(e){console.error(e);alert('저장 중 오류가 발생했습니다. 사진 파일과 Firebase Storage 설정을 확인해주세요.')}finally{btn.disabled=false;btn.textContent='미담 저장'}};
window.del=async id=>{if(!confirm('이 미담을 삭제하시겠습니까?'))return;try{await deleteDoc(doc(db,'midam',id));load()}catch(e){console.error(e);alert('삭제 중 오류가 발생했습니다.')}};load();
</script></body></html>
