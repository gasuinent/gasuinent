<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 관리</title>
<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Malgun Gothic,sans-serif;
}
header{
    background:#222;
    padding:20px;
    text-align:center;
}
header h1{
    margin:0;
    color:#FFD700;
    font-size:34px;
}
.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}
input,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:18px;
    box-sizing:border-box;
}
textarea{
    height:220px;
    resize:vertical;
}
label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}
button{
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    padding:12px 25px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#ffcc00;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th{
    background:#333;
    padding:12px;
}
td{
    padding:10px;
    border-bottom:1px solid #444;
    text-align:center;
}
.thumb{
    width:90px;
    border-radius:6px;
}
.pin-button{
    background:#555;
    color:#fff;
    padding:8px 12px;
    font-size:14px;
}
.pin-button.pinned{
    background:#FFD700;
    color:#000;
}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
import {
getStorage,
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"
};

const app=initializeApp(firebaseConfig);
window.db=getFirestore(app);
window.storage=getStorage(app);
window.editId=null;
</script>
</head>

<body>
<header>
<h1>🖼 갤러리 관리</h1>
<div style="margin-top:20px">
<input
id="searchText"
type="text"
placeholder="사진 검색..."
style="width:320px;padding:10px;border-radius:6px;border:none;">
<button id="searchBtn">검색</button>
</div>
</header>

<div class="container">

<h2>등록된 사진</h2>

<table>
<tr>
<th>번호</th>
<th>사진</th>
<th>제목</th>
<th>등록일</th>
<th>고정</th>
<th>보기</th>
<th>수정</th>
<th>삭제</th>
</tr>
<tbody id="galleryBody"></tbody>
</table>

<hr>

<h2>사진 등록</h2>

<label>사진 제목</label>
<input type="text" id="galleryTitle">

<label>사진 선택</label>
<input type="file" id="galleryImage">

<img
id="previewImage"
style="max-width:250px;margin-top:10px;display:none;border-radius:8px;">

<label>사진 설명</label>
<textarea id="galleryContent"></textarea>

<button id="saveGallery">사진 저장</button>

<button
onclick="location.href='admin.html'"
style="
margin-left:15px;
background:#555;
color:#fff;
border:none;
border-radius:8px;
padding:12px 25px;
font-size:17px;
font-weight:bold;
cursor:pointer;">
🏠 관리 메인
</button>

<script type="module">
import {
collection,
addDoc,
getDocs,
deleteDoc,
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

import {
ref,
uploadBytes,
getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-storage.js";

const db=window.db;
const storage=window.storage;

document.getElementById("galleryImage").onchange=function(){
const file=this.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=function(e){
const img=document.getElementById("previewImage");
img.src=e.target.result;
img.style.display="block";
};
reader.readAsDataURL(file);
};

async function getRows(){
const snapshot=await getDocs(collection(db,"gallery"));
const rows=[];
snapshot.forEach(d=>{
rows.push({id:d.id,...d.data()});
});
rows.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
return rows;
}

document.getElementById("saveGallery").onclick=async()=>{
let title=document.getElementById("galleryTitle").value.trim();
let content=document.getElementById("galleryContent").value.trim();
let file=document.getElementById("galleryImage").files[0];

if(title===""){
alert("사진 제목을 입력하세요.");
return;
}

let imageUrl="";
let oldData={};

if(window.editId){
const snap=await getDoc(doc(db,"gallery",window.editId));
if(snap.exists()){
oldData=snap.data();
imageUrl=oldData.image||"";
}
}

if(file){
const storageRef=ref(storage,"gallery/"+Date.now()+"_"+file.name);
await uploadBytes(storageRef,file);
imageUrl=await getDownloadURL(storageRef);
}

const data={
title:title,
content:content,
image:imageUrl,
date:new Date().toISOString().slice(0,10),
timestamp:oldData.timestamp||Date.now(),
pinned:oldData.pinned===true
};

if(window.editId){
await updateDoc(doc(db,"gallery",window.editId),data);
alert("사진이 수정되었습니다.");
window.editId=null;
}else{
data.pinned=false;
await addDoc(collection(db,"gallery"),data);
alert("사진이 등록되었습니다.");
}

document.getElementById("galleryTitle").value="";
document.getElementById("galleryContent").value="";
document.getElementById("galleryImage").value="";
document.getElementById("previewImage").style.display="none";

loadGallery();
};

async function togglePin(id){
const rows=await getRows();
const target=rows.find(g=>g.id===id);
if(!target)return;

if(target.pinned===true){
await updateDoc(doc(db,"gallery",id),{pinned:false});
loadGallery();
return;
}

const pinnedCount=rows.filter(g=>g.pinned===true).length;

if(pinnedCount>=3){
alert("상단 고정은 최대 3개까지만 가능합니다.");
return;
}

await updateDoc(doc(db,"gallery",id),{pinned:true});
loadGallery();
}

window.togglePin=togglePin;

async function deleteGallery(id){
if(!confirm("정말 삭제하시겠습니까?"))return;
await deleteDoc(doc(db,"gallery",id));
loadGallery();
}
window.deleteGallery=deleteGallery;

async function editGallery(id){
window.editId=id;

const snap=await getDoc(doc(db,"gallery",id));
if(!snap.exists())return;

const g=snap.data();

document.getElementById("galleryTitle").value=g.title||"";
document.getElementById("galleryContent").value=g.content||"";

const img=document.getElementById("previewImage");

if(g.image){
img.src=g.image;
img.style.display="block";
}else{
img.style.display="none";
}

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}
window.editGallery=editGallery;

window.viewGallery=function(id){
location.href="gallery_view.html?id="+id;
};

function renderGallery(rows){
let html="";
let no=1;

rows.forEach(g=>{
html+=`
<tr>
<td>${no++}</td>
<td>${g.image?`<img src="${g.image}" class="thumb">`:"-"}</td>
<td>${g.title||""}</td>
<td>${g.date||""}</td>
<td>
<button
class="pin-button ${g.pinned===true?"pinned":""}"
onclick="togglePin('${g.id}')">
${g.pinned===true?"★ 고정됨":"☆ 고정"}
</button>
</td>
<td>
<button onclick="viewGallery('${g.id}')">보기</button>
</td>
<td>
<button onclick="editGallery('${g.id}')">수정</button>
</td>
<td>
<button onclick="deleteGallery('${g.id}')">삭제</button>
</td>
</tr>`;
});

document.getElementById("galleryBody").innerHTML=html;
}

async function loadGallery(){
renderGallery(await getRows());
}

document.getElementById("searchBtn").onclick=async()=>{
const keyword=document.getElementById("searchText").value.toLowerCase();
const rows=await getRows();

const filtered=rows.filter(g=>
(g.title||"").toLowerCase().includes(keyword) ||
(g.content||"").toLowerCase().includes(keyword)
);

renderGallery(filtered);
};

loadGallery();
</script>

</div>
</body>
</html>
