<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공연일정 관리</title>

<style>

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:"Malgun Gothic",sans-serif;
}

header{
    background:#222;
    color:#FFD700;
    text-align:center;
    padding:25px;
}

.container{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #555;
    padding:12px;
    text-align:center;
}

th{
    background:#333;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    font-size:16px;
}

textarea{
    height:140px;
}

button{
    padding:12px 25px;
    margin-top:15px;
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.edit-btn{
    background:#FFD700;
}

.delete-btn{
    background:#e53935;
    color:#fff;
}

.view-btn{
    background:#555;
    color:#fff;
}

.back{
    float:right;
}

.form-title{
    margin-top:40px;
    color:#FFD700;
}

</style>
</head>

<body>

<header>
    <h1>📅 공연일정 관리</h1>
</header>

<div class="container">

<h2>등록된 공연</h2>

<table>

<thead>
<tr>
    <th>번호</th>
    <th>행사명</th>
    <th>날짜</th>
    <th>보기</th>
    <th>수정</th>
    <th>삭제</th>
</tr>
</thead>

<tbody id="eventBody">

<tr>
    <td colspan="6">
        등록된 일정이 없습니다.
    </td>
</tr>

</tbody>

</table>


<h2 class="form-title">공연 일정 등록</h2>


<label>행사명</label>

<input
    type="text"
    id="eventTitle"
    placeholder="행사명을 입력하세요"
>


<label>공연 내용</label>

<textarea
    id="eventContent"
    placeholder="공연 내용을 입력하세요"
></textarea>


<label>공연 날짜</label>

<input
    type="date"
    id="eventDate"
>


<label>공연 장소</label>

<input
    type="text"
    id="eventPlace"
    placeholder="공연 장소를 입력하세요"
>


<button id="saveEvent">
    공연 등록
</button>


<button
    class="back"
    onclick="location.href='admin.html'">
    관리자 메인
</button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    deleteDoc,
    updateDoc,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain: "gasuinent.firebaseapp.com",

    projectId: "gasuinent",

    storageBucket: "gasuinent.firebasestorage.app",

    messagingSenderId: "122370674182",

    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId: "G-39M5K1M6K7"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let editId = null;


/* =========================
   등록 / 수정
========================= */

document.getElementById("saveEvent").onclick =
async function(){

    const title =
        document.getElementById("eventTitle").value.trim();

    const content =
        document.getElementById("eventContent").value.trim();

    const date =
        document.getElementById("eventDate").value;

    const place =
        document.getElementById("eventPlace").value.trim();


    if(title === ""){

        alert("행사명을 입력하세요.");

        return;
    }


    try{

        /* 수정 */

        if(editId){

            await updateDoc(
                doc(db,"schedule",editId),
                {
                    title:title,
                    content:content,
                    date:date,
                    place:place,
                    timestamp:Date.now()
                }
            );

            alert("행사가 수정되었습니다.");

            editId = null;

            document.getElementById("saveEvent").textContent =
                "공연 등록";
        }


        /* 신규 등록 */

        else{

            await addDoc(
                collection(db,"schedule"),
                {
                    title:title,
                    content:content,
                    date:date,
                    place:place,
                    timestamp:Date.now()
                }
            );

            alert("행사가 등록되었습니다.");
        }


        clearForm();

        loadEvent();

    }
    catch(error){

        console.error(error);

        alert(
            "저장 실패\n\n" +
            error.message
        );
    }

};


/* =========================
   입력창 초기화
========================= */

function clearForm(){

    document.getElementById("eventTitle").value = "";

    document.getElementById("eventContent").value = "";

    document.getElementById("eventDate").value = "";

    document.getElementById("eventPlace").value = "";

}


/* =========================
   등록된 일정 불러오기
========================= */

async function loadEvent(){

    try{

        const q = query(
            collection(db,"schedule"),
            orderBy("timestamp","desc")
        );


        const snapshot =
            await getDocs(q);


        let html = "";

        let no = 1;


        snapshot.forEach((docItem)=>{

            const event =
                docItem.data();


            html += `

            <tr>

                <td>
                    ${no++}
                </td>

                <td>
                    ${event.title || ""}
                </td>

                <td>
                    ${event.date || ""}
                </td>

                <td>
                    <button
                        class="view-btn"
                        onclick="viewEvent('${docItem.id}')">
                        보기
                    </button>
                </td>

                <td>
                    <button
                        class="edit-btn"
                        onclick="editEvent('${docItem.id}')">
                        수정
                    </button>
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteEvent('${docItem.id}')">
                        삭제
                    </button>
                </td>

            </tr>

            `;

        });


        if(html === ""){

            html = `

            <tr>

                <td colspan="6">
                    등록된 일정이 없습니다.
                </td>

            </tr>

            `;
        }


        document.getElementById("eventBody").innerHTML =
            html;

    }
    catch(error){

        console.error(error);

        document.getElementById("eventBody").innerHTML = `

        <tr>

            <td colspan="6">
                일정을 불러오지 못했습니다.
            </td>

        </tr>

        `;
    }

}


/* =========================
   삭제
========================= */

async function deleteEvent(id){

    if(
        !confirm("정말 이 행사를 삭제하시겠습니까?")
    ){

        return;
    }


    try{

        await deleteDoc(
            doc(db,"schedule",id)
        );


        alert("행사가 삭제되었습니다.");

        loadEvent();

    }
    catch(error){

        console.error(error);

        alert("삭제에 실패했습니다.");

    }

}


window.deleteEvent = deleteEvent;


/* =========================
   보기
========================= */

function viewEvent(id){

    window.location.href =
        "../schedule_view.html?id=" + id;

}


window.viewEvent = viewEvent;


/* =========================
   수정
========================= */

async function editEvent(id){

    try{

        const snap =
            await getDoc(
                doc(db,"schedule",id)
            );


        if(!snap.exists()){

            alert("행사를 찾을 수 없습니다.");

            return;
        }


        const event =
            snap.data();


        editId = id;


        document.getElementById("eventTitle").value =
            event.title || "";


        document.getElementById("eventContent").value =
            event.content || "";


        document.getElementById("eventDate").value =
            event.date || "";


        document.getElementById("eventPlace").value =
            event.place || "";


        document.getElementById("saveEvent").textContent =
            "행사 수정";


        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    }
    catch(error){

        console.error(error);

        alert("행사를 불러오지 못했습니다.");

    }

}


window.editEvent = editEvent;


/* =========================
   처음 실행
========================= */

loadEvent();

</script>

</body>
</html>
