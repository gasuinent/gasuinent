<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공연일정 관리</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:"Malgun Gothic",sans-serif;
}

header{
    background:#222;
    color:#FFD700;
    text-align:center;
    padding:25px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

h2{
    color:#FFD700;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #555;
    padding:12px;
    text-align:center;
}

th{
    background:#333;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
}

input,textarea{
    width:100%;
    padding:12px;
    box-sizing:border-box;
    font-size:16px;
    border-radius:5px;
    border:1px solid #555;
}

textarea{
    height:130px;
}

.pin-box{
    margin-top:20px;
    padding:15px;
    background:#1c1c1c;
    border:1px solid #555;
    border-radius:8px;
}

.pin-box label{
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
}

.pin-box input{
    width:auto;
}

button{
    padding:12px 25px;
    margin-top:15px;
    background:#FFD700;
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn{
    background:#e53935;
    color:#fff;
}

.view-btn{
    background:#555;
    color:#fff;
}

.cancel-btn{
    background:#777;
    color:#fff;
    margin-left:8px;
}

.back{
    float:right;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:25px 0 35px;
}

.pagination button{
    min-width:42px;
    padding:9px 13px;
    margin-top:0;
    background:#333;
    color:#fff;
    border:1px solid #555;
}

.pagination button:hover,
.pagination button.active{
    background:#FFD700;
    color:#000;
    border-color:#FFD700;
}

.pagination button.arrow{
    background:#555;
}

.empty{
    padding:30px;
    color:#aaa;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <h1>📅 공연일정 관리</h1>
</header>

<div class="container">

<h2>등록된 공연</h2>

<table>

<thead>
<tr>
    <th>번호</th>
    <th>행사명</th>
    <th>날짜</th>
    <th>고정</th>
    <th>보기</th>
    <th>수정</th>
    <th>삭제</th>
</tr>
</thead>

<tbody id="eventBody"></tbody>

</table>

<div id="pagination" class="pagination"></div>

<h2 style="margin-top:45px;">공연 일정 등록</h2>

<label>행사명</label>
<input type="text" id="eventTitle" placeholder="행사명을 입력하세요">

<label>공연 내용</label>
<textarea id="eventContent" placeholder="공연 내용을 입력하세요"></textarea>

<label>공연 날짜</label>
<input type="date" id="eventDate">

<label>공연 장소</label>
<input type="text" id="eventPlace" placeholder="공연 장소를 입력하세요">

<div class="pin-box">
    <label>
        <input type="checkbox" id="eventPinned">
        📌 일정 고정
    </label>

    <div style="color:#aaa;margin-top:8px;">
        고정 일정은 최대 2개까지 가능합니다.
    </div>
</div>

<button id="saveEvent">공연 등록</button>

<button id="cancelEdit" class="cancel-btn" style="display:none;">
    수정 취소
</button>

<button class="back" onclick="location.href='admin.html'">
    관리자 메인
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    deleteDoc,
    updateDoc,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {

    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain: "gasuinent.firebaseapp.com",

    projectId: "gasuinent",

    storageBucket: "gasuinent.firebasestorage.app",

    messagingSenderId: "122370674182",

    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId: "G-39M5K1M6K7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editId = null;

const PAGE_SIZE = 5;
let currentPage = 1;
let allEvents = [];

const titleInput = document.getElementById("eventTitle");
const contentInput = document.getElementById("eventContent");
const dateInput = document.getElementById("eventDate");
const placeInput = document.getElementById("eventPlace");
const pinnedInput = document.getElementById("eventPinned");
const saveButton = document.getElementById("saveEvent");
const cancelButton = document.getElementById("cancelEdit");
const eventBody = document.getElementById("eventBody");
const pagination = document.getElementById("pagination");


/* 고정 일정 개수 확인 */

async function getPinnedCount(excludeId = null){

    const q = query(
        collection(db,"schedule"),
        orderBy("timestamp","desc")
    );

    const snapshot = await getDocs(q);

    let count = 0;

    snapshot.forEach(item => {

        if(excludeId && item.id === excludeId){
            return;
        }

        if(item.data().pinned === true){
            count++;
        }
    });

    return count;
}


/* 등록 / 수정 */

saveButton.onclick = async function(){

    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    const date = dateInput.value;
    const place = placeInput.value.trim();
    const pinned = pinnedInput.checked;

    if(title === ""){
        alert("행사명을 입력하세요.");
        titleInput.focus();
        return;
    }

    try{

        if(!editId){

            if(pinned){

                const count = await getPinnedCount();

                if(count >= 2){
                    alert("고정 일정은 최대 2개까지만 가능합니다.");
                    return;
                }
            }

            await addDoc(
                collection(db,"schedule"),
                {
                    title:title,
                    content:content,
                    date:date,
                    place:place,
                    pinned:pinned,
                    timestamp:Date.now()
                }
            );

            alert("공연이 등록되었습니다.");

        }else{

            if(pinned){

                const count = await getPinnedCount(editId);

                if(count >= 2){
                    alert("이미 고정 일정이 2개 있습니다.");
                    return;
                }
            }

            await updateDoc(
                doc(db,"schedule",editId),
                {
                    title:title,
                    content:content,
                    date:date,
                    place:place,
                    pinned:pinned,
                    timestamp:Date.now()
                }
            );

            alert("공연이 수정되었습니다.");
        }

        clearForm();
        await loadEvent();

    }catch(error){

        console.error(error);

        alert(
            "저장에 실패했습니다.\n\n" +
            (error.message || error)
        );
    }
};


/* 목록 불러오기 */

async function loadEvent(){

    try{

        const q = query(
            collection(db,"schedule"),
            orderBy("timestamp","desc")
        );

        const snapshot = await getDocs(q);

        allEvents = [];

        snapshot.forEach(item => {

            allEvents.push({
                id:item.id,
                data:item.data()
            });

        });

        const totalPages = Math.max(
            1,
            Math.ceil(allEvents.length / PAGE_SIZE)
        );

        if(currentPage > totalPages){
            currentPage = totalPages;
        }

        renderEvents();

    }catch(error){

        console.error(error);

        eventBody.innerHTML = `
        <tr>
            <td colspan="7" class="empty">
                일정을 불러오지 못했습니다.
            </td>
        </tr>
        `;

        pagination.innerHTML = "";
    }
}


/* 행사 표시 - 한 페이지 5개 */

function renderEvents(){

    const start = (currentPage - 1) * PAGE_SIZE;

    const pageItems = allEvents.slice(
        start,
        start + PAGE_SIZE
    );

    let html = "";

    if(pageItems.length === 0){

        html = `
        <tr>
            <td colspan="7" class="empty">
                등록된 일정이 없습니다.
            </td>
        </tr>
        `;

    }else{

        pageItems.forEach((item,index) => {

            const event = item.data;

            html += `
            <tr>

                <td>${start + index + 1}</td>

                <td>${escapeHtml(event.title || "")}</td>

                <td>${escapeHtml(event.date || "")}</td>

                <td>
                    ${
                        event.pinned === true
                        ? "📌 고정"
                        : ""
                    }
                </td>

                <td>
                    <button
                        class="view-btn"
                        onclick="viewEvent('${item.id}')">
                        보기
                    </button>
                </td>

                <td>
                    <button
                        onclick="editEvent('${item.id}')">
                        수정
                    </button>
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteEvent('${item.id}')">
                        삭제
                    </button>
                </td>

            </tr>
            `;
        });
    }

    eventBody.innerHTML = html;

    renderPagination();
}


/* 페이지 번호 */

function renderPagination(){

    const totalPages = Math.ceil(
        allEvents.length / PAGE_SIZE
    );

    if(totalPages <= 1){

        pagination.innerHTML = "";
        return;
    }

    let html = "";

    if(currentPage > 1){

        html += `
        <button
            class="arrow"
            onclick="changePage(${currentPage - 1})">
            ◀
        </button>
        `;
    }

    for(let i = 1; i <= totalPages; i++){

        html += `
        <button
            class="${i === currentPage ? "active" : ""}"
            onclick="changePage(${i})">
            ${i}
        </button>
        `;
    }

    if(currentPage < totalPages){

        html += `
        <button
            class="arrow"
            onclick="changePage(${currentPage + 1})">
            ▶
        </button>
        `;
    }

    pagination.innerHTML = html;
}


window.changePage = function(page){

    const totalPages = Math.ceil(
        allEvents.length / PAGE_SIZE
    );

    if(page < 1 || page > totalPages){
        return;
    }

    currentPage = page;

    renderEvents();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};


/* 삭제 */

async function deleteEvent(id){

    if(!confirm("정말 삭제하시겠습니까?")){
        return;
    }

    try{

        await deleteDoc(
            doc(db,"schedule",id)
        );

        alert("삭제되었습니다.");

        await loadEvent();

    }catch(error){

        console.error(error);

        alert(
            "삭제에 실패했습니다.\n\n" +
            (error.message || error)
        );
    }
}

window.deleteEvent = deleteEvent;


/* 보기 */

function viewEvent(id){

    window.location.href =
        "../schedule_view.html?id=" +
        encodeURIComponent(id);
}

window.viewEvent = viewEvent;


/* 수정 */

async function editEvent(id){

    try{

        const snap = await getDoc(
            doc(db,"schedule",id)
        );

        if(!snap.exists()){

            alert("행사를 찾을 수 없습니다.");
            return;
        }

        const event = snap.data();

        editId = id;

        titleInput.value = event.title || "";
        contentInput.value = event.content || "";
        dateInput.value = event.date || "";
        placeInput.value = event.place || "";
        pinnedInput.checked = event.pinned === true;

        saveButton.textContent = "공연 수정";
        cancelButton.style.display = "inline-block";

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    }catch(error){

        console.error(error);

        alert("행사를 불러오지 못했습니다.");
    }
}

window.editEvent = editEvent;


/* 수정 취소 */

cancelButton.onclick = function(){

    clearForm();

};


/* 입력창 초기화 */

function clearForm(){

    editId = null;

    titleInput.value = "";
    contentInput.value = "";
    dateInput.value = "";
    placeInput.value = "";
    pinnedInput.checked = false;

    saveButton.textContent = "공연 등록";
    cancelButton.style.display = "none";
}


/* HTML 문자 처리 */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* 처음 실행 */

loadEvent();

</script>

</body>
</html>
