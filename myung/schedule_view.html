<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>행사 보기</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Malgun Gothic,sans-serif;
}

header{
    background:#222;
    padding:20px;
    text-align:center;
}

header h1{
    color:#FFD700;
    margin:0;
}

.container{
    width:90%;
    max-width:1000px;
    margin:40px auto;
}

#title{
    font-size:34px;
    font-weight:bold;
    margin-bottom:20px;
}

#date{
    color:#aaa;
    margin-bottom:15px;
}

#place{
    color:#FFD700;
    font-size:20px;
    margin-bottom:30px;
}

#content{
    font-size:22px;
    line-height:1.8;
    white-space:pre-wrap;
}

button{
    margin-top:40px;
    padding:15px 35px;
    background:#FFD700;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

</style>

</head>

<body>

<header>

<h1>📅 행사 보기</h1>

</header>

<div class="container">

<div id="title"></div>

<div id="date"></div>

<div id="place"></div>

<div id="content"></div>

<button onclick="history.back()">
목록으로 돌아가기
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain: "gasuinent.firebaseapp.com",
projectId: "gasuinent",
storageBucket: "gasuinent.firebasestorage.app",
messagingSenderId: "122370674182",
appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId: "G-39M5K1M6K7"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function loadEvent(){

    if(!id){
        document.getElementById("title").innerHTML = "행사를 찾을 수 없습니다.";
        return;
    }

    const snap = await getDoc(doc(db,"schedule",id));

    if(!snap.exists()){
        document.getElementById("title").innerHTML = "행사가 존재하지 않습니다.";
        return;
    }

    const event = snap.data();

    document.getElementById("title").innerHTML = event.title;
    document.getElementById("date").innerHTML = "📅 " + event.date;
    document.getElementById("place").innerHTML = "📍 " + event.place;
    document.getElementById("content").innerHTML = event.content;

}

loadEvent();

</script>
</body>
</html>
