<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 상세보기 | 가수인생활 엔터테인먼트</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:"Noto Sans KR","Malgun Gothic",Arial,sans-serif}
.wrap{width:min(1000px,calc(100% - 36px));margin:0 auto}
header{background:#050505;border-bottom:1px solid #222}
.head{min-height:78px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:20px;font-weight:800}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{color:#f0c94d}
.back{padding:9px 13px;border:1px solid #444;border-radius:8px;background:#222;color:#fff;text-decoration:none;font-size:13px}
.article{margin:48px auto 70px;background:#111;border:1px solid #333;border-radius:18px;overflow:hidden}
.article-head{padding:34px 42px 26px;border-bottom:1px solid #333}
.kicker{color:#f0c94d;font-size:13px;font-weight:800;letter-spacing:.15em;margin-bottom:12px}
h1{margin:0;font-size:38px;line-height:1.3}
.meta{margin-top:15px;color:#aaa;font-size:14px}
.hero{width:100%;background:#151515;text-align:center}
.hero img{display:block;width:100%;max-height:650px;object-fit:contain;background:#111}
.no-image{padding:120px 20px;color:#777}
.article-body{padding:34px 42px 45px}
.article-body p{margin:0;white-space:pre-wrap;color:#ddd;font-size:17px;line-height:1.9}
.file-box{margin-top:30px;padding-top:20px;border-top:1px solid #333}
.file-box a{color:#f0c94d;text-decoration:none}
.error{text-align:center;padding:100px 20px;color:#aaa}
@media(max-width:650px){
.article-head{padding:26px 22px 22px}
.article-body{padding:25px 22px 35px}
h1{font-size:28px}
.article-body p{font-size:15px}
}
</style>
</head>
<body>
<header>
<div class="wrap head">
<a class="brand" href="gallery.html">
<img src="logo.png" alt="가수인생활 엔터테인먼트">
<span>가수인생활 <b>엔터테인먼트</b></span>
</a>
<a class="back" href="gallery.html">← 갤러리로 돌아가기</a>
</div>
</header>

<main class="wrap">
<article class="article" id="article">
<div class="error">자료를 불러오는 중입니다.</div>
</article>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
authDomain:"gasuinent.firebaseapp.com",
projectId:"gasuinent",
storageBucket:"gasuinent.firebasestorage.app",
messagingSenderId:"122370674182",
appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
measurementId:"G-39M5K1M6K7"
};

const db=getFirestore(initializeApp(firebaseConfig));

function esc(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

const id=new URLSearchParams(location.search).get("id");
const article=document.getElementById("article");

async function load(){
if(!id){
article.innerHTML='<div class="error">잘못된 접근입니다.</div>';
return;
}
try{
const snap=await getDoc(doc(db,"gallery",id));
if(!snap.exists()){
article.innerHTML='<div class="error">갤러리 자료를 찾을 수 없습니다.</div>';
return;
}
const g=snap.data();
const title=esc(g.title||"갤러리");
const date=esc(g.date||"");
const content=esc(g.content||"");
const image=g.image||"";

article.innerHTML=`
<div class="article-head">
<div class="kicker">GALLERY</div>
<h1>${title}</h1>
${date?`<div class="meta">📅 ${date}</div>`:""}
</div>
<div class="hero">
${image?`<img src="${esc(image)}" alt="${title}">`:`<div class="no-image">등록된 사진이 없습니다.</div>`}
</div>
<div class="article-body">
<p>${content||"등록된 내용이 없습니다."}</p>
${g.fileUrl?`<div class="file-box"><a href="${esc(g.fileUrl)}" target="_blank" rel="noopener">첨부파일 보기</a></div>`:""}
</div>`;
}catch(e){
console.error(e);
article.innerHTML='<div class="error">상세 내용을 불러오지 못했습니다.</div>';
}
}
load();
</script>
</body>
</html>
