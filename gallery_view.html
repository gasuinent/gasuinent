<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>갤러리 상세보기 | 가수인생활 엔터테인먼트</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:"Malgun Gothic",sans-serif;
}

header{
    height:70px;
    background:#050505;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
}

.header-inner{
    width:92%;
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#FFD700;
    font-size:18px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#FFD700;
}

.container{
    width:92%;
    max-width:1000px;
    margin:55px auto 80px;
}

.back{
    display:inline-block;
    margin-bottom:25px;
    padding:10px 18px;
    border:1px solid #FFD700;
    border-radius:20px;
    color:#FFD700;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    background:#FFD700;
    color:#000;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:18px;
    overflow:hidden;
}

.image-box{
    width:100%;
    background:#111;
    text-align:center;
}

.image-box img{
    width:100%;
    max-height:650px;
    object-fit:contain;
    display:block;
    margin:auto;
}

.no-image{
    height:350px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:20px;
}

.content{
    padding:30px;
}

.content h1{
    margin:0 0 15px;
    font-size:32px;
    color:#fff;
}

.date{
    color:#aaa;
    margin-bottom:25px;
}

.description{
    color:#ddd;
    font-size:17px;
    line-height:1.9;
    white-space:pre-wrap;
}

.error{
    text-align:center;
    padding:100px 20px;
    color:#aaa;
    font-size:20px;
}

@media(max-width:700px){

    nav{
        display:none;
    }

    .container{
        width:94%;
        margin-top:35px;
    }

    .content{
        padding:22px;
    }

    .content h1{
        font-size:25px;
    }

    .description{
        font-size:15px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            가수인생활 엔터테인먼트
        </div>

        <nav>
            <a href="index.html">홈</a>
            <a href="news.html">뉴스</a>
            <a href="notice.html">공지</a>
            <a href="schedule.html">일정</a>
            <a href="projects.html">실적</a>
            <a href="files.html">자료실</a>
            <a href="video.html">영상센터</a>
            <a href="gallery.html">갤러리</a>
        </nav>

    </div>

</header>


<div class="container">

    <a href="gallery.html" class="back">
        ← 갤러리로 돌아가기
    </a>

    <div id="detail"></div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig={

    apiKey:
    "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain:
    "gasuinent.firebaseapp.com",

    projectId:
    "gasuinent",

    storageBucket:
    "gasuinent.firebasestorage.app",

    messagingSenderId:
    "122370674182",

    appId:
    "1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId:
    "G-39M5K1M6K7"
};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* 주소에서 id 가져오기 */

const params=
new URLSearchParams(
    window.location.search
);

const id=params.get("id");


const detail=
document.getElementById("detail");


/* id가 없을 경우 */

if(!id){

    detail.innerHTML=`
        <div class="error">
            갤러리 정보를 찾을 수 없습니다.
        </div>
    `;

}else{

    loadGallery();

}


/* 갤러리 상세정보 */

async function loadGallery(){

    try{

        const snap=
        await getDoc(
            doc(db,"gallery",id)
        );


        if(!snap.exists()){

            detail.innerHTML=`
                <div class="error">
                    해당 갤러리 자료가 존재하지 않습니다.
                </div>
            `;

            return;

        }


        const g=snap.data();


        let imageHTML="";


        if(g.image){

            imageHTML=`
                <div class="image-box">

                    <img
                        src="${escapeAttribute(g.image)}"
                        alt="${escapeAttribute(g.title || "갤러리 사진")}"
                    >

                </div>
            `;

        }else{

            imageHTML=`
                <div class="image-box">

                    <div class="no-image">
                        사진이 없습니다.
                    </div>

                </div>
            `;

        }


        detail.innerHTML=`

            <div class="card">

                ${imageHTML}

                <div class="content">

                    <h1>
                        ${escapeHtml(g.title || "")}
                    </h1>

                    ${
                        g.date
                        ?
                        `<div class="date">
                            📅 ${escapeHtml(g.date)}
                        </div>`
                        :
                        ""
                    }

                    <div class="description">
                        ${escapeHtml(g.content || "등록된 설명이 없습니다.")}
                    </div>

                </div>

            </div>

        `;


    }catch(error){

        console.error(
            "갤러리 상세 오류:",
            error
        );

        detail.innerHTML=`
            <div class="error">
                갤러리 내용을 불러오지 못했습니다.
                <br><br>
                ${escapeHtml(error.message || "")}
            </div>
        `;

    }

}


/* HTML 문자 처리 */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll('"',"&quot;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");

}

</script>

</body>
</html>
