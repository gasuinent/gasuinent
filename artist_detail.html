<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain: "gasuinent.firebaseapp.com",

    projectId: "gasuinent",

    storageBucket: "gasuinent.firebasestorage.app",

    messagingSenderId: "122370674182",

    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId: "G-39M5K1M6K7"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==========================
   기본 대표가수 정보
   ========================== */

const defaultArtist = {

    photoUrl: "lee-myungro.jpg",

    stageName: "이명로",

    genre: "대표 아티스트 · CEO",

    shortIntro:
        "대한민국 가수이자 가수인생활 엔터테인먼트 대표입니다.",

    profile:
        "공연기획, 아티스트 매니지먼트, 신인가수 발굴 및 육성, 문화예술 공연과 지역문화 활성화를 위해 전국의 다양한 공연과 문화행사를 기획·운영하고 있습니다.",

    career: [
        "대한민국 가수",
        "가수인생활 엔터테인먼트 대표",
        "한국가수인생활협회 회장",
        "나가수공연단 단장",
        "전국 공연 및 축제 기획",
        "신인가수 발굴 및 육성"
    ].join("\n"),

    songs: ""

};


/* ==========================
   화면 표시
   ========================== */

function showArtist(artist) {

    const photo =
        artist.photoUrl ||
        "logo.png";

    const name =
        artist.stageName ||
        artist.name ||
        "소속가수";

    const genre =
        artist.genre ||
        "가수";

    const intro =
        artist.shortIntro ||
        "";

    const profile =
        artist.profile ||
        artist.description ||
        "";

    const career =
        artist.career ||
        artist.history ||
        "";

    const songs =
        artist.songs ||
        artist.representativeSongs ||
        artist.representativeSong ||
        "";

    document.title =
        name + " | 가수인생활 엔터테인먼트";


    document.getElementById("artistPhoto").src =
        photo;

    document.getElementById("artistPhoto").alt =
        name;

    document.getElementById("artistName").textContent =
        name;

    document.getElementById("artistGenre").textContent =
        genre;

    document.getElementById("artistIntro").textContent =
        intro;

    document.getElementById("artistProfile").textContent =
        profile;

    document.getElementById("artistCareer").textContent =
        career;

    document.getElementById("artistSongs").textContent =
        songs;


    const infoList =
        document.getElementById("artistInfoList");

    infoList.innerHTML = "";


    if (artist.realName) {

        infoList.innerHTML +=
            "<li>본명 : " +
            artist.realName +
            "</li>";

    }

    if (artist.genre) {

        infoList.innerHTML +=
            "<li>장르 : " +
            artist.genre +
            "</li>";

    }

    if (artist.agency) {

        infoList.innerHTML +=
            "<li>소속 : " +
            artist.agency +
            "</li>";

    }

    if (artist.phone) {

        infoList.innerHTML +=
            "<li>연락처 : " +
            artist.phone +
            "</li>";

    }


    const video =
        document.getElementById("artistVideo");

    video.innerHTML = "";

    if (artist.videoUrl) {

        video.innerHTML =
            '<a href="' +
            artist.videoUrl +
            '" target="_blank" rel="noopener">' +
            "▶ 공연 영상 보기" +
            "</a>";

    }


    const social =
        document.getElementById("artistSocial");

    social.innerHTML = "";

    if (artist.youtubeUrl) {

        social.innerHTML +=
            '<a href="' +
            artist.youtubeUrl +
            '" target="_blank" rel="noopener">' +
            "YouTube" +
            "</a>";

    }

    if (artist.instagramUrl) {

        social.innerHTML +=
            '<a href="' +
            artist.instagramUrl +
            '" target="_blank" rel="noopener">' +
            "Instagram" +
            "</a>";

    }

}


/* ==========================
   Firebase 가수 상세정보
   ========================== */

async function loadArtistDetail() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const artistId =
        params.get("id");


    /* id가 없으면 기존 대표가수 표시 */

    if (!artistId) {

        showArtist(defaultArtist);

        return;

    }


    try {

        const artistRef =
            doc(
                db,
                "artists",
                artistId
            );

        const artistSnap =
            await getDoc(artistRef);


        if (artistSnap.exists()) {

            showArtist(
                artistSnap.data()
            );

        } else {

            showArtist(defaultArtist);

        }


    } catch (error) {

        console.error(
            "가수 상세정보 불러오기 오류:",
            error
        );

        showArtist(defaultArtist);

    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadArtistDetail
);

</script>
