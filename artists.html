<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain: "gasuinent.firebaseapp.com",
    projectId: "gasuinent",
    storageBucket: "gasuinent.firebasestorage.app",
    messagingSenderId: "122370674182",
    appId: "1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId: "G-39M5K1M6K7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadArtists() {

    const grid = document.getElementById("artistGrid");

    if (!grid) {
        return;
    }

    try {

        const snapshot = await getDocs(
            collection(db, "artists")
        );

        let html = "";

        snapshot.forEach(function(item) {

            const artist = item.data();

            const image = artist.photoUrl || "logo.png";

            const name =
                artist.stageName ||
                artist.name ||
                "소속가수";

            const genre =
                artist.genre ||
                "가수";

            const intro =
                artist.shortIntro ||
                "";

            html += `
                <div
                    class="artist-card"
                    onclick="location.href='artist_detail.html?id=${item.id}'"
                    style="cursor:pointer;"
                >

                    <img
                        src="${image}"
                        alt="${name}"
                    >

                    <h3>${name}</h3>

                    <p>
                        ${genre}<br>
                        ${intro}
                    </p>

                </div>
            `;

        });

        html += `
            <div class="artist-card">

                <img
                    src="logo.png"
                    alt="신인가수 모집"
                >

                <h3>신인가수 모집</h3>

                <p>
                    트로트 · 발라드 · K-POP<br>
                    오디션 상시 접수
                </p>

            </div>
        `;

        if (snapshot.empty) {

            html += `
                <div class="artist-card">

                    <img
                        src="logo.png"
                        alt="아티스트 준비중"
                    >

                    <h3>아티스트 준비중</h3>

                    <p>
                        새로운 아티스트 영입 진행 중<br>
                        Coming Soon
                    </p>

                </div>
            `;

        }

        grid.innerHTML = html;

    } catch (error) {

        console.error(
            "소속가수 불러오기 오류:",
            error
        );

        grid.innerHTML = `
            <div class="artist-card">

                <img
                    src="logo.png"
                    alt="아티스트 준비중"
                >

                <h3>아티스트 준비중</h3>

                <p>
                    새로운 아티스트 영입 진행 중<br>
                    Coming Soon
                </p>

            </div>
        `;

    }

}

document.addEventListener(
    "DOMContentLoaded",
    loadArtists
);

</script>
