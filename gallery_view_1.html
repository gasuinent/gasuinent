<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 임시 1번 보기</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}
header{background:#222;padding:20px;text-align:center}
header h1{margin:0;color:#FFD700;font-size:34px}
.container{width:95%;max-width:1000px;margin:40px auto}
.card{background:#181818;border:1px solid #444;border-radius:10px;padding:30px}
h2{margin-top:0;font-size:30px}
.date{color:#aaa;margin:12px 0 25px}
.galleryImage{display:block;max-width:100%;max-height:70vh;margin:0 auto 30px;border-radius:8px;object-fit:contain}
.content{font-size:18px;line-height:1.8;white-space:pre-wrap}
button{background:#FFD700;color:#000;border:none;border-radius:8px;padding:12px 25px;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#ffcc00}
.notice{color:#aaa;margin-bottom:20px}
</style>
</head>
<body>
<header>
<h1>🖼 갤러리 임시 1번 보기</h1>
</header>

<div class="container">
<div class="notice">현재 컴퓨터에 임시 저장된 사진을 보여주는 테스트 페이지입니다.</div>
<div id="view"></div>
<br>
<button onclick="location.href='gallery_1.html'">목록으로</button>
</div>

<script>
const DB_NAME="gasuinent_gallery_temp_1";
const STORE_NAME="photos";

function openDB(){
    return new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,1);
        request.onupgradeneeded=e=>{
            const db=e.target.result;
            if(!db.objectStoreNames.contains(STORE_NAME)){
                const store=db.createObjectStore(STORE_NAME,{keyPath:"id",autoIncrement:true});
                store.createIndex("timestamp","timestamp");
            }
        };
        request.onsuccess=e=>resolve(e.target.result);
        request.onerror=()=>reject(request.error);
    });
}

async function getPhoto(id){
    const db=await openDB();
    return new Promise((resolve,reject)=>{
        const req=db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).get(Number(id));
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
    });
}

function escapeHtml(str){
    return String(str).replace(/[&<>"']/g,m=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
}

(async()=>{
    const params=new URLSearchParams(location.search);
    const id=params.get("id");
    const view=document.getElementById("view");

    if(!id){
        view.innerHTML="<div class='card'>사진 번호가 없습니다.</div>";
        return;
    }

    try{
        const g=await getPhoto(id);

        if(!g){
            view.innerHTML="<div class='card'>사진을 찾을 수 없습니다.</div>";
            return;
        }

        view.innerHTML=`
<div class="card">
<h2>${escapeHtml(g.title||"")}</h2>
<div class="date">${escapeHtml(g.date||"")}</div>
${g.image ? `<img src="${g.image}" class="galleryImage">` : ""}
<div class="content">${escapeHtml(g.content||"")}</div>
</div>`;
    }catch(err){
        console.error(err);
        view.innerHTML="<div class='card'>사진을 불러오는 중 오류가 발생했습니다.</div>";
    }
})();
</script>
<script type="module" src="visitor_tracker.js"></script>
</body>
</html>
