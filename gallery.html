<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>갤러리 | 가수인생활 엔터테인먼트</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:"Malgun Gothic",sans-serif;
}

/* =========================
   상단 메뉴
========================= */

header{
    height:70px;
    background:#050505;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
}

.header-inner{
    width:92%;
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#FFD700;
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

nav{
    display:flex;
    gap:22px;
    align-items:center;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#FFD700;
}

nav a.active{
    color:#FFD700;
    font-weight:bold;
}

/* =========================
   제목
========================= */

.hero{
    text-align:center;
    padding:55px 20px 35px;
}

.hero-small{
    color:#FFD700;
    font-size:15px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.hero h1{
    margin:0;
    font-size:48px;
    font-weight:800;
}

.hero p{
    margin:18px 0 0;
    color:#cfcfcf;
    font-size:18px;
}

/* =========================
   갤러리
========================= */

.gallery-wrap{
    width:92%;
    max-width:1200px;
    margin:10px auto 0;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

/* =========================
   카드
========================= */

.gallery-card{
    background:#151515;
    border:1px solid #303030;
    border-radius:18px;
    overflow:hidden;
    transition:transform .2s,border-color .2s;
}

.gallery-card:hover{
    transform:translateY(-3px);
    border-color:#8d7315;
}

/* =========================
   사진
========================= */

.gallery-image{
    width:100%;
    height:260px;
    background:#222;
    position:relative;
    overflow:hidden;
}

.gallery-image img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.no-image{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#888;
    font-size:18px;
    background:
        linear-gradient(
            135deg,
            #252525,
            #171717
        );
}

/* =========================
   카드 내용
========================= */

.gallery-content{
    padding:16px 18px 18px;
}

.gallery-content h2{
    margin:0 0 10px;
    font-size:21px;
    color:#fff;
    line-height:1.35;
}

.gallery-content .date{
    color:#aaa;
    font-size:13px;
    margin-bottom:8px;
}

.gallery-content p{
    margin:0;
    color:#ccc;
    font-size:14px;
    line-height:1.5;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

/* =========================
   자세히 보기
========================= */

.view-btn{
    display:inline-block;
    margin-top:14px;
    padding:9px 16px;
    border:1px solid #FFD700;
    border-radius:20px;
    color:#FFD700;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.view-btn:hover{
    background:#FFD700;
    color:#000;
}

/* =========================
   좌우 페이지 이동
========================= */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin:35px 0 55px;
}

.page-arrow{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid #FFD700;
    background:#111;
    color:#FFD700;
    font-size:23px;
    cursor:pointer;
}

.page-arrow:hover:not(:disabled){
    background:#FFD700;
    color:#000;
}

.page-arrow:disabled{
    opacity:.3;
    cursor:default;
}

.page-info{
    color:#fff;
    font-size:16px;
    min-width:60px;
    text-align:center;
}

/* =========================
   없음
========================= */

.empty{
    grid-column:1 / -1;
    padding:80px 20px;
    text-align:center;
    color:#888;
    font-size:18px;
}

/* =========================
   모바일
========================= */

@media(max-width:900px){

    nav{
        gap:10px;
    }

    nav a{
        font-size:12px;
    }

    .gallery-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .gallery-image{
        height:230px;
    }
}

@media(max-width:600px){

    header{
        height:auto;
        padding:15px 0;
    }

    .header-inner{
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero{
        padding:40px 15px 25px;
    }

    .hero h1{
        font-size:36px;
    }

    .hero p{
        font-size:15px;
    }

    .gallery-grid{
        grid-template-columns:1fr;
    }

    .gallery-image{
        height:230px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            가수인생활 엔터테인먼트
        </div>

        <nav>
            <a href="index.html">홈</a>
            <a href="company.html">회사소개</a>
            <a href="group.html">함께하는 단체</a>
            <a href="artists.html">소속가수</a>
            <a href="news.html">뉴스</a>
            <a href="notice.html">공지</a>
            <a href="schedule.html">일정</a>
            <a href="projects.html">실적</a>
            <a href="files.html">자료실</a>
            <a href="video.html">영상센터</a>
            <a href="gallery.html" class="active">갤러리</a>
            <a href="contact.html">문의</a>
        </nav>

    </div>

</header>


<section class="hero">

    <div class="hero-small">
        GALLERY
    </div>

    <h1>갤러리</h1>

    <p>
        공연, 행사, 봉사활동 등의 현장 모습을 분야별로 기록해 공개합니다.
    </p>

</section>


<main class="gallery-wrap">

    <div id="galleryGrid" class="gallery-grid"></div>


    <div
        id="pagination"
        class="pagination"
        style="display:none;">

        <button
            id="prevBtn"
            class="page-arrow"
            type="button">
            ←
        </button>

        <div
            id="pageInfo"
            class="page-info">
            1 / 1
        </div>

        <button
            id="nextBtn"
            class="page-arrow"
            type="button">
            →
        </button>

    </div>

</main>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain:
        "gasuinent.firebaseapp.com",

    projectId:
        "gasuinent",

    storageBucket:
        "gasuinent.firebasestorage.app",

    messagingSenderId:
        "122370674182",

    appId:
        "1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId:
        "G-39M5K1M6K7"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   설정
========================= */

const PAGE_SIZE = 6;

let currentPage = 1;

let galleryItems = [];


/* =========================
   갤러리 불러오기
========================= */

async function loadGallery(){

    const grid =
        document.getElementById("galleryGrid");

    try{

        const q = query(
            collection(db,"gallery"),
            orderBy("timestamp","desc")
        );

        const snapshot =
            await getDocs(q);

        galleryItems = [];

        snapshot.forEach(item => {

            galleryItems.push({

                id:item.id,

                data:item.data()

            });

        });


        /* 고정된 사진을 먼저 표시 */

        galleryItems.sort((a,b)=>{

            const ap =
                a.data.pinned === true ? 1 : 0;

            const bp =
                b.data.pinned === true ? 1 : 0;

            if(ap !== bp){

                return bp - ap;

            }

            return (
                (b.data.timestamp || 0) -
                (a.data.timestamp || 0)
            );

        });


        currentPage = 1;

        renderGallery();

    }

    catch(error){

        console.error(
            "갤러리 불러오기 오류:",
            error
        );

        grid.innerHTML = `
            <div class="empty">
                갤러리를 불러오지 못했습니다.
            </div>
        `;

    }

}


/* =========================
   갤러리 표시
========================= */

function renderGallery(){

    const grid =
        document.getElementById("galleryGrid");

    const start =
        (currentPage - 1) * PAGE_SIZE;

    const items =
        galleryItems.slice(
            start,
            start + PAGE_SIZE
        );


    if(items.length === 0){

        grid.innerHTML = `
            <div class="empty">
                등록된 사진이 없습니다.
            </div>
        `;

        document.getElementById(
            "pagination"
        ).style.display = "none";

        return;

    }


    let html = "";


    items.forEach(item=>{

        const g = item.data;


        const title =
            escapeHtml(
                g.title || ""
            );


        const content =
            escapeHtml(
                g.content || ""
            );


        const date =
            escapeHtml(
                g.date || ""
            );


        let imageHTML = "";


        /*
         * 기존 Firebase gallery.image 사용
         */

        if(g.image){

            imageHTML = `

                <img
                    src="${escapeAttribute(g.image)}"
                    alt="${escapeAttribute(
                        g.title ||
                        "갤러리 사진"
                    )}"
                    loading="lazy"
                    onerror="
                        this.style.display='none';
                        this.parentElement
                            .querySelector('.no-image')
                            .style.display='flex';
                    "
                >

                <div
                    class="no-image"
                    style="display:none;">
                    사진 없음
                </div>

            `;

        }

        else{

            imageHTML = `

                <div class="no-image">
                    사진 없음
                </div>

            `;

        }


        html += `

            <article class="gallery-card">

                <div class="gallery-image">

                    ${imageHTML}

                </div>


                <div class="gallery-content">

                    <h2>
                        ${title}
                    </h2>


                    ${
                        date
                        ?
                        `
                        <div class="date">
                            📅 ${date}
                        </div>
                        `
                        :
                        ""
                    }


                    ${
                        content
                        ?
                        `
                        <p>
                            ${content}
                        </p>
                        `
                        :
                        ""
                    }


                    <a
                        class="view-btn"
                        href="gallery_view.html?id=${encodeURIComponent(
                            item.id
                        )}">
                        자세히 보기 →
                    </a>

                </div>

            </article>

        `;

    });


    grid.innerHTML = html;

    renderPagination();

}


/* =========================
   페이지 버튼
========================= */

function renderPagination(){

    const pagination =
        document.getElementById(
            "pagination"
        );

    const prevBtn =
        document.getElementById(
            "prevBtn"
        );

    const nextBtn =
        document.getElementById(
            "nextBtn"
        );

    const pageInfo =
        document.getElementById(
            "pageInfo"
        );


    const totalPages =
        Math.ceil(
            galleryItems.length /
            PAGE_SIZE
        );


    if(totalPages <= 1){

        pagination.style.display =
            "none";

        return;

    }


    pagination.style.display =
        "flex";


    pageInfo.textContent =
        currentPage +
        " / " +
        totalPages;


    prevBtn.disabled =
        currentPage <= 1;

    nextBtn.disabled =
        currentPage >= totalPages;

}


/* =========================
   이전 버튼
========================= */

document
    .getElementById("prevBtn")
    .onclick = function(){

        if(currentPage <= 1){

            return;

        }


        currentPage--;

        renderGallery();


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    };


/* =========================
   다음 버튼
========================= */

document
    .getElementById("nextBtn")
    .onclick = function(){

        const totalPages =
            Math.ceil(
                galleryItems.length /
                PAGE_SIZE
            );


        if(currentPage >= totalPages){

            return;

        }


        currentPage++;

        renderGallery();


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    };


/* =========================
   HTML 문자 처리
========================= */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        );

}


/* =========================
   시작
========================= */

loadGallery();

</script>

</body>
</html>
