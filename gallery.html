<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | 가수인생활 엔터테인먼트</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Malgun Gothic,"맑은 고딕",sans-serif;
}

header{
    background:#050505;
    border-bottom:1px solid #292929;
    padding:22px 20px;
}

.nav{
    width:92%;
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.logo{
    color:#e7c45a;
    font-size:20px;
    font-weight:bold;
    white-space:nowrap;
}

.nav-links{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.nav-links a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

.nav-links a:hover,
.nav-links a.active{
    color:#FFD700;
}

.hero{
    text-align:center;
    padding:58px 20px 40px;
}

.hero .en{
    color:#FFD700;
    font-size:16px;
    font-weight:bold;
    letter-spacing:5px;
    margin-bottom:8px;
}

.hero h1{
    margin:0 0 20px;
    font-size:48px;
}

.hero p{
    margin:0;
    color:#c8c8c8;
    font-size:18px;
}

.container{
    width:92%;
    max-width:1200px;
    margin:0 auto 70px;
}

/* 항상 3열 × 2행 = 6칸 */
.gallery-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,auto);
    gap:20px;
}

.gallery-box{
    min-width:0;
    background:#171717;
    border:1px solid #333;
    border-radius:12px;
    overflow:hidden;
    min-height:310px;
}

.gallery-box a{
    display:block;
    height:100%;
    color:#fff;
    text-decoration:none;
}

.gallery-box img,
.gallery-empty-image{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
    background:#222;
}

.gallery-empty-image{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#666;
    font-size:15px;
}

.gallery-info{
    padding:16px;
}

.gallery-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.gallery-date{
    color:#999;
    font-size:13px;
}

.gallery-content{
    color:#ccc;
    font-size:14px;
    line-height:1.5;
    margin-top:10px;
    min-height:42px;
}

.section-title{
    margin:48px 0 18px;
    font-size:24px;
    border-left:4px solid #FFD700;
    padding-left:12px;
}

.gallery-list{
    border-top:1px solid #333;
}

.list-item{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 10px;
    border-bottom:1px solid #292929;
}

.list-item a{
    display:flex;
    align-items:center;
    gap:18px;
    width:100%;
    color:#fff;
    text-decoration:none;
}

.list-item img,
.list-thumb-empty{
    width:110px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    background:#222;
    flex-shrink:0;
}

.list-title{
    font-weight:bold;
}

.list-date{
    font-size:12px;
    color:#999;
    margin-top:5px;
}

.no-list{
    padding:20px 5px;
    color:#777;
}

/* 화면이 좁아져도 갤러리 3열 구조는 유지 */
@media(max-width:800px){
    .nav{
        flex-direction:column;
    }

    .nav-links{
        justify-content:center;
    }

    .gallery-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:10px;
    }

    .gallery-box{
        min-height:240px;
    }

    .gallery-box img,
    .gallery-empty-image{
        height:140px;
    }

    .gallery-info{
        padding:10px;
    }

    .gallery-title{
        font-size:15px;
    }

    .gallery-content{
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
가수인생활 <span>엔터테인먼트</span>
</div>

<div class="nav-links">
<a href="index.html">홈</a>
<a href="news.html">뉴스</a>
<a href="schedule.html">일정</a>
<a href="video.html">영상센터</a>
<a href="gallery.html" class="active">갤러리</a>
<a href="contact.html">문의</a>
</div>

</div>
</header>

<section class="hero">

<div class="en">GALLERY</div>

<h1>갤러리</h1>

<p>
공연, 행사, 봉사활동의 현장 모습을 분야별로 기록해 공개합니다.
</p>

</section>

<main class="container">

<div id="galleryGrid" class="gallery-grid"></div>

<h2 class="section-title">갤러리 목록</h2>

<div id="galleryList" class="gallery-list"></div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig={

    apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",
    authDomain:"gasuinent.firebaseapp.com",
    projectId:"gasuinent",
    storageBucket:"gasuinent.firebasestorage.app",
    messagingSenderId:"122370674182",
    appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",
    measurementId:"G-39M5K1M6K7"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function makeCard(g){

    if(!g){

        return `
        <div class="gallery-box">

            <div class="gallery-empty-image">
                사진을 등록해주세요
            </div>

            <div class="gallery-info">

                <div class="gallery-title">
                    -
                </div>

                <div class="gallery-date">
                    -
                </div>

                <div class="gallery-content">
                    -
                </div>

            </div>

        </div>
        `;

    }


    const image=g.image

        ? `<img src="${g.image}" alt="${escapeHtml(g.title)}">`

        : `<div class="gallery-empty-image">
               사진 없음
           </div>`;


    return `

    <div class="gallery-box">

        <a href="gallery_view.html?id=${g.id}">

            ${image}

            <div class="gallery-info">

                <div class="gallery-title">
                    ${escapeHtml(g.title)}
                </div>

                <div class="gallery-date">
                    ${escapeHtml(g.date)}
                </div>

                <div class="gallery-content">
                    ${escapeHtml(g.content)}
                </div>

            </div>

        </a>

    </div>

    `;

}


async function loadGallery(){

    const snapshot=await getDocs(
        collection(db,"gallery")
    );

    const rows=[];


    snapshot.forEach(docItem=>{

        rows.push({

            id:docItem.id,
            ...docItem.data()

        });

    });


    /* 최신순 */

    rows.sort(

        (a,b)=>
        (b.timestamp||0)-
        (a.timestamp||0)

    );


    /*
       ① 관리자가 고정한 사진 중 최대 3개
    */

    const pinned=rows

        .filter(g=>g.pinned===true)

        .slice(0,3);


    /*
       ② 고정되지 않은 최신 사진으로
          남은 칸을 채움
    */

    const normal=rows

        .filter(g=>g.pinned!==true);


    const latest=normal

        .slice(0,6-pinned.length);


    /*
       ③ 메인은 정확히 6칸
    */

    const main=[...pinned,...latest];


    while(main.length<6){

        main.push(null);

    }


    document.getElementById(
        "galleryGrid"
    ).innerHTML=

        main.map(g=>makeCard(g)).join("");


    /*
       ④ 메인 6칸에 들어간 자료는
          목록에서 제외
    */

    const mainIds=new Set(

        main

        .filter(g=>g)

        .map(g=>g.id)

    );


    /*
       ⑤ 7번째부터 목록
    */

    const list=rows.filter(

        g=>!mainIds.has(g.id)

    );


    if(list.length===0){

        document.getElementById(
            "galleryList"
        ).innerHTML=

        `<div class="no-list">
            등록된 추가 갤러리가 없습니다.
         </div>`;

        return;

    }


    document.getElementById(
        "galleryList"
    ).innerHTML=

        list.map(g=>`

        <div class="list-item">

            <a href="gallery_view.html?id=${g.id}">

                ${
                    g.image

                    ? `<img
                        src="${g.image}"
                        alt="${escapeHtml(g.title)}">`

                    : `<div class="list-thumb-empty"></div>`
                }

                <div>

                    <div class="list-title">
                        ${escapeHtml(g.title)}
                    </div>

                    <div class="list-date">
                        ${escapeHtml(g.date)}
                    </div>

                </div>

            </a>

        </div>

        `).join("");

}


loadGallery();

</script>

</body>
</html>
