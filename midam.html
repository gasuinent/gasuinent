<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>미담 | 가수인생활 엔터테인먼트</title><style>:root{--bg:#080808;--panel:#151518;--gold:#e0b354;--gold2:#f2cf7a;--text:#f6f2e9;--muted:#c9c1b5;--line:#34343a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;line-height:1.72}.wrap{max-width:1240px;margin:auto;padding:0 24px}header{background:#050505;border-bottom:1px solid var(--line)}.head{min-height:86px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand b{color:var(--gold2)}.back{padding:10px 16px;border:1px solid #765e31;border-radius:999px;color:var(--gold2);text-decoration:none}.hero{text-align:center;padding:65px 0 45px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(44px,7vw,72px);margin:10px 0}.hero p{font-size:20px;color:var(--muted);margin:auto;max-width:760px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:55px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#222}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.body{padding:25px}.date{color:var(--gold);font-weight:800;font-size:15px}.card h2{font-size:27px;margin:7px 0 12px}.summary{color:var(--muted);white-space:pre-line}.empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed #594a2c;border-radius:24px;grid-column:1/-1}@media(max-width:760px){.wrap{padding:0 18px}.list{grid-template-columns:1fr}.card h2{font-size:23px}.hero{padding:50px 0 35px}.hero p{font-size:17px}.photos{grid-template-columns:1fr 1fr}.photos img:first-child{grid-column:1/-1}}
</style></head><body><header><div class="wrap head"><a class="brand" href="index.html">가수인생활 <b>엔터테인먼트</b></a><a class="back" href="index.html">홈으로</a></div></header><div class="hero"><div class="wrap"><div class="eyebrow">GOOD STORY</div><h1>미담</h1><p>작지만 따뜻한 도움의 순간을 기록합니다.<br>언제, 어디서, 누가, 무엇을, 왜, 어떻게 했는지 간단하게 남깁니다.</p></div></div><main class="wrap"><div id="list" class="list"><div class="empty">등록된 미담이 없습니다.</div></div></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const db=getFirestore(initializeApp(cfg));function esc(v){return String(v||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}async function load(){const box=document.getElementById('list');try{const s=await getDocs(query(collection(db,'midam'),orderBy('timestamp','desc')));let h='';s.forEach(x=>{const d=x.data(),imgs=Array.isArray(d.images)?d.images.filter(Boolean).slice(0,3):(d.image?[d.image]:[]);h+=`<article class="card">${imgs.length?`<div class="photos">${imgs.map((u,i)=>`<img src="${esc(u)}" alt="미담 사진 ${i+1}">`).join('')}</div>`:''}<div class="body"><div class="date">${esc(d.date)} · ${esc(d.location)}</div><h2>${esc(d.title)}</h2><div class="summary">${esc(d.content)}</div></div></article>`});box.innerHTML=h||'<div class="empty">등록된 미담이 없습니다.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">미담을 불러오지 못했습니다.</div>'}}load();</script></body></html>
