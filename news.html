*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;line-height:1.72}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.wrap{max-width:1240px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:100;background:#050505;border-bottom:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28)}.head{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;white-space:nowrap;flex:0 0 auto}.brand img{width:54px;height:54px;object-fit:contain;border-radius:50%}.brand b{color:var(--gold2)}.desktop-nav{display:flex;align-items:center;justify-content:flex-end;gap:1px;flex-wrap:nowrap}.desktop-nav a{padding:10px 7px;border-radius:9px;color:var(--muted);font-size:14px;font-weight:850;white-space:nowrap}.desktop-nav a:hover,.desktop-nav a.active{background:rgba(224,179,84,.13);color:var(--gold2)}.menu-btn{display:none;width:58px;height:58px;border:1px solid var(--line);border-radius:18px;background:#141519;color:var(--gold2);font-size:30px;cursor:pointer}.mobile-nav{display:none;position:fixed;inset:86px 0 0;z-index:1000;background:rgba(0,0,0,.985);padding:22px;overflow-y:auto;border-top:1px solid var(--line)}.mobile-nav.open{display:block}.mobile-nav a{display:block;max-width:620px;margin:0 auto 10px;padding:15px 18px;border:1px solid var(--line);border-radius:14px;background:#111217;color:var(--text);font-size:19px;font-weight:800}.mobile-nav a:hover,.mobile-nav a.active{background:var(--gold);color:#111;border-color:var(--gold)}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.18em;font-size:22px}h2{font-size:clamp(40px,6vw,66px);line-height:1.2;margin:12px 0 20px}.lead{font-size:clamp(20px,3vw,31px);color:var(--muted);max-width:900px;margin:auto}.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:30px 0 46px}.filters button{padding:14px 24px;border-radius:999px;border:1px solid var(--line);background:#090909;color:var(--muted);font-weight:900;font-size:20px}.filters button.active{background:var(--gold);color:#111}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:34px;padding:44px}.card p{font-size:19px;color:var(--muted);line-height:1.78}.news-card{display:flex;flex-direction:column;height:100%}.news-card .btn{margin-top:auto;align-self:flex-start}.btn{display:inline-block;margin-top:22px;padding:16px 28px;border:2px solid var(--gold);border-radius:999px;color:var(--gold2);font-size:21px;font-weight:900;background:transparent;cursor:pointer}footer{text-align:center;padding:80px 20px;color:#aaa}footer img{width:160px;height:160px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 24px}@media(max-width:1020px){.desktop-nav{display:none}.menu-btn{display:block}.mobile-nav{inset:86px 0 0}}@media(max-width:760px){.wrap{padding:0 21px}.head{min-height:78px}.brand{font-size:18px}.brand img{width:50px;height:50px}.menu-btn{width:50px;height:50px;font-size:26px}.mobile-nav{inset:78px 0 0;padding:15px}.mobile-nav a{font-size:17px;padding:12px 15px}.eyebrow{font-size:14px}.lead{font-size:18px}.grid{grid-template-columns:1fr}.card{padding:27px 23px;border-radius:24px}.card p{font-size:17px}.filters{gap:8px;margin:20px 0 30px}.filters button{font-size:15px;padding:10px 14px}.btn{font-size:17px;padding:12px 18px}footer{padding:48px 20px}footer img{width:112px;height:112px}}

<main><section id="news"><div class="wrap"><div class="section-head" style="text-align:center;margin-bottom:56px"><div class="eyebrow">OFFICIAL NEWS CHANNEL</div><h2>가수인생활 공식 뉴스</h2><p class="lead">무료공연, 봉사활동, 노래교실, 사회환원과 행사 소식을 기록하고 공개합니다.</p></div><div aria-label="뉴스 분류" class="filters"><button class="active" data-filter="전체" type="button">전체</button><button data-filter="행사안내" type="button">행사안내</button><button data-filter="무료공연" type="button">무료공연</button><button data-filter="봉사활동" type="button">봉사활동</button><button data-filter="노래교실" type="button">노래교실</button><button data-filter="사회환원" type="button">사회환원</button><button data-filter="보도자료" type="button">보도자료</button></div><div class="grid" id="newsGrid"></div></div></section></main>

<script>
document.addEventListener('DOMContentLoaded',()=>{const menuBtn=document.getElementById('menuBtn'),mobileNav=document.getElementById('mobileNav');function closeMobileMenu(){mobileNav.classList.remove('open');mobileNav.setAttribute('aria-hidden','true');menuBtn.setAttribute('aria-expanded','false');menuBtn.textContent='☰';document.body.style.overflow=''}menuBtn.addEventListener('click',()=>{const open=!mobileNav.classList.contains('open');mobileNav.classList.toggle('open',open);mobileNav.setAttribute('aria-hidden',String(!open));menuBtn.setAttribute('aria-expanded',String(open));menuBtn.textContent=open?'×':'☰';document.body.style.overflow=open?'hidden':''});mobileNav.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMobileMenu));window.addEventListener('resize',()=>{if(window.innerWidth>1020)closeMobileMenu()})});
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87"};const db=getFirestore(initializeApp(firebaseConfig));
async function loadNews(){try{const q=query(collection(db,"news"),orderBy("timestamp","desc"));const snapshot=await getDocs(q);const notices=[];snapshot.forEach(x=>notices.push({id:x.id,...x.data()}));const isPinned=n=>n.pinned===true||n.isPinned===true||n.fixed===true||n.isFixed===true||n.notice===true||n.isNotice===true;const pinnedNews=notices.filter(isPinned),normalNews=notices.filter(n=>!isPinned(n)),allNews=[...pinnedNews.slice(0,2),...normalNews].slice(0,6);function makeCard(n){const pinned=isPinned(n);return `<div class="card news-card" data-category="${n.category||''}">${n.image?`<img src="${n.image}" style="width:100%;border-radius:15px;margin-bottom:20px;">`:''}${pinned?`<div style="display:inline-block;padding:7px 13px;margin-bottom:14px;border-radius:999px;background:#3a3120;color:#f2cf7a;font-weight:900;font-size:15px">📌 공지/고정</div>`:''}<h3 style="font-size:32px;line-height:1.35;margin:0 0 26px">${n.title||''}</h3><div style="color:#bbb;margin-bottom:15px">📅 ${n.date||''}</div><p style="font-size:17px;line-height:1.7;color:#ddd">${(n.content||'').substring(0,150)}...</p><a class="btn" href="news_view.html?id=${encodeURIComponent(n.id)}">자세히 보기</a></div>`}function showAllNews(){document.getElementById('newsGrid').innerHTML=allNews.map(makeCard).join('')||'<div class="card" style="grid-column:1/-1;text-align:center"><h3>뉴스</h3><p>등록된 뉴스가 없습니다.</p></div>'}function showCategory(category){const rows=notices.filter(n=>n.category===category);document.getElementById('newsGrid').innerHTML=rows.map(makeCard).join('')||`<div class="card" style="grid-column:1/-1;text-align:center"><h3>${category}</h3><p>등록된 뉴스가 없습니다.</p></div>`}document.querySelectorAll('.filters button[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filters button[data-filter]').forEach(b=>b.classList.remove('active'));button.classList.add('active');button.dataset.filter==='전체'?showAllNews():showCategory(button.dataset.filter)}));showAllNews()}catch(e){console.error(e);document.getElementById('newsGrid').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center"><p>뉴스를 불러오지 못했습니다.</p></div>'}}loadNews();
</script>
