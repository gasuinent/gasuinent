epeat(2,minmax(0,1fr));gap:28px}.card{background:#151518;border:1px solid #34343a;border-radius:34px;padding:44px}.card p{font-size:19px;color:#c9c1b5;line-height:1.78}.news-card{display:flex;flex-direction:column;min-height:430px}.news-card .btn{margin-top:auto;align-self:flex-start}.btn{display:inline-block;margin-top:22px;padding:16px 28px;border:2px solid #e0b354;border-radius:999px;color:#f2cf7a;font-size:21px;font-weight:900}footer{text-align:center;padding:80px 20px;color:#aaa}footer img{width:160px;height:160px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 24px}.news-card h3{font-size:32px;line-height:1.38;margin:0 0 30px}.news-card .summary{font-size:17px;line-height:1.7;color:#c9c1b5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 12px}@media(max-width:1020px){.desktop-nav{display:none}.menu-btn{display:block}}@media(max-width:760px){.wrap{padding:0 21px}.head{min-height:78px}.brand{font-size:18px}.brand img{width:50px;height:50px}.menu-btn{width:50px;height:50px;font-size:26px}.mobile-nav{inset:78px 0 0;padding:15px}.mobile-nav a{font-size:17px;padding:12px 15px}.eyebrow{font-size:14px}.lead{font-size:18px}.grid{grid-template-columns:1fr}.card{padding:27px 23px}.card p{font-size:17px}.filters{gap:8px;margin:20px 0 30px}.filters button{font-size:15px;padding:10px 14px}.btn{font-size:17px;padding:12px 18px}.news-card{min-height:390px}.news-card h3{font-size:27px;margin-bottom:24px}.news-card .summary{font-size:16px;-webkit-line-clamp:3}footer{padding:48px 20px}footer img{width:112px;height:112px}}</style></head><body><header><div class="wrap head"><a class="brand" href="index.html"><img src="logo.png"><span>가수인생활 <b>엔터테인먼트</b></span></a><nav class="desktop-nav"><a href="index.html">홈</a><a href="about.html">회사소개</a><a href="partners.html">함께하는 단체</a><a href="artists.html">소속가수</a><a class="active" href="news.html">뉴스</a><a href="midam.html">미담</a><a href="notice.html">공지</a><a href="schedule.html">일정</a><a href="projects.html">실적</a><a href="resources.html">자료실</a><a href="video.html">영상센터</a><a href="gallery.html">갤러리</a><a href="contact.html">문의</a></nav><button class="menu-btn" id="menuBtn">☰</button></div></header><nav class="mobile-nav" id="mobileNav"><a href="index.html">홈</a><a href="about.html">회사소개</a><a href="partners.html">함께하는 단체</a><a href="artists.html">소속가수</a><a class="active" href="news.html">공식 뉴스</a><a href="midam.html">미담</a><a href="notice.html">공지사항</a><a href="schedule.html">행사일정</a><a href="projects.html">주요 실적</a><a href="resources.html">자료실</a><a href="video.html">영상센터</a><a href="gallery.html">갤러리</a><a href="contact.html">문의</a></nav><main><section><div class="wrap"><div style="text-align:center;margin:82px 0 56px"><div class="eyebrow">OFFICIAL NEWS CHANNEL</div><h2>가수인생활 공식 뉴스</h2><p class="lead">무료공연, 봉사활동, 노래교실, 사회환원과 행사 소식을 기록하고 공개합니다.</p></div><div class="filters"><button class="active" data-filter="전체">전체</button><button data-filter="행사안내">행사안내</button><button data-filter="무료공연">무료공연</button><button data-filter="봉사활동">봉사활동</button><button data-filter="노래교실">노래교실</button><button data-filter="사회환원">사회환원</button><button data-filter="보도자료">보도자료</button></div><div class="grid" id="newsGrid"></div></div></section></main><footer><img src="logo.png"><div>© 2026 가수인생활 엔터테인먼트. All rights reserved.</div></footer><script>const mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav');mb.onclick=()=>{const o=!mn.classList.contains('open');mn.classList.toggle('open',o);mb.textContent=o?'×':'☰'};</script><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87"};const db=getFirestore(initializeApp(cfg));async function loadNews(){try{const[newsSnap,noticeSnap]=await Promise.all([getDocs(collection(db,'news')),getDocs(collection(db,'notice'))]);const rows=[];newsSnap.forEach(x=>rows.push({id:x.id,...x.data()}));noticeSnap.forEach(x=>rows.push({id:x.id,...x.data()}));rows.sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));const pinned=n=>n.pinned===true||n.isPinned===true||n.fixed===true||n.isFixed===true||n.notice===true||n.isNotice===true;const top=()=>rows.slice(0,6);function card(n){const summary=(n.content||'').replace(/\s+/g,' ').trim();return `<div class="card news-card" data-category="${n.category||''}">${n.image?`<img src="${n.image}" style="width:100%;border-radius:15px;margin-bottom:24px">`:''}${pinned(n)?'<div style="color:#f2cf7a;font-weight:900;margin-bottom:14px">📌 공지/고정</div>':''}<h3>${n.title||''}</h3><div style="color:#bbb;margin-bottom:22px">📅 ${n.date||''}</div><p class="summary">${summary}</p><a class="btn" href="news_view.html?id=${encodeURIComponent(n.id)}">자세히 보기</a></div>`}function render(filter){const data=filter==='전체'?top():rows.filter(n=>n.category===filter);document.getElementById('newsGrid').innerHTML=data.map(card).join('')||`<div class="card" style="grid-column:1/-1;text-align:center"><h3>${filter}</h3><p>등록된 뉴스가 없습니다.</p></div>`}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render('전체')}catch(e){console.error(e);document.getElementById('newsGrid').innerHTML='<div class="card"><p>뉴스를 불러오지 못했습니다.</p></div>'}}loadNews();</script><script type="module" src="visitor_tracker.js"></script>
