<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>뉴스 상세보기</title><style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}header{background:#222;padding:20px;text-align:center;position:relative}header h1{margin:0;color:#FFD700;font-size:34px}.close-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid #666;border-radius:50%;background:#111;color:#fff;font-size:28px;font-weight:bold;line-height:42px;text-align:center;text-decoration:none}.container{width:90%;max-width:1000px;margin:40px auto}#title{font-size:42px;font-weight:bold;line-height:1.4;margin-bottom:25px}#reporter{color:#FFD700;font-size:18px;margin-bottom:25px;border-bottom:1px solid #444;padding-bottom:15px}#image{width:100%;max-height:600px;object-fit:contain;border-radius:10px;margin-bottom:8px;display:none}#caption{text-align:center;color:#aaa;margin-bottom:30px;font-size:15px}#content{font-size:21px;line-height:2;white-space:normal}.article-photo{display:block;width:100%;max-height:600px;object-fit:contain;border-radius:10px;margin:35px 0 8px}.article-photo-caption{text-align:center;color:#aaa;margin-bottom:30px;font-size:15px}.related{display:flex;align-items:center;background:#1a1a1a;border:1px solid #444;border-radius:10px;padding:15px;margin-bottom:15px}.related a{color:#FFD700;font-size:20px;font-weight:bold;text-decoration:none}.articleNav{display:flex;justify-content:space-between;align-items:center;margin:40px 0;gap:20px}button{padding:14px 30px;background:#FFD700;color:#000;border:0;border-radius:8px;cursor:pointer;font-size:18px;font-weight:bold}button:disabled{background:#555;color:#aaa;cursor:not-allowed}@media(max-width:700px){.container{width:94%;margin:25px auto}#title{font-size:30px}#content{font-size:18px}.article-photo{max-height:500px}.articleNav{flex-wrap:wrap;justify-content:center}.close-btn{right:12px;width:42px;height:42px;font-size:25px;line-height:38px}}
</style></head><body><header><h1>📰 뉴스 상세보기</h1><a class="close-btn" href="news.html" aria-label="뉴스 목록으로">×</a></header><div class="container"><div id="title">뉴스를 불러오는 중입니다...</div><div id="reporter"></div><img id="image"><div id="caption"></div><div id="content"></div><h2 style="margin-top:70px;color:#FFD700;">📰 관련 뉴스</h2><div id="relatedNotice"></div><div class="articleNav"><button id="prevBtn">◀ 이전 뉴스</button><button onclick="location.href='news.html'">📰 뉴스 목록</button><button id="nextBtn">다음 뉴스 ▶</button></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,doc,getDoc,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const app=initializeApp(firebaseConfig),db=getFirestore(app),params=new URLSearchParams(location.search),id=params.get("id");function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}function photoHtml(url,caption,index){if(!url)return"";return `<img class="article-photo" src="${esc(url)}" alt="뉴스 사진 ${index}"><div class="article-photo-caption">${esc(caption||"")}</div>`}function renderContent(content,photos,caps){const text=String(content||"");const re=/\[사진\s*([②③④234])\s*삽입\]/g;let html="",last=0,m;while((m=re.exec(text))){html+=esc(text.slice(last,m.index)).replace(/\n/g,"<br>");const idx={"②":0,"③":1,"④":2,"2":0,"3":1,"4":2}[m[1]];if(idx!==undefined&&photos[idx])html+=photoHtml(photos[idx],caps[idx]||"",idx+2);last=re.lastIndex}html+=esc(text.slice(last)).replace(/\n/g,"<br>");return html}async function load(){if(!id)return;const s=await getDoc(doc(db,"notice",id));if(!s.exists()){title.textContent="뉴스가 존재하지 않습니다.";return}const n=s.data();title.textContent=n.title||"";reporter.innerHTML=`📅 ${esc(n.date||"")} &nbsp; | &nbsp; ✍ 가수인생활 엔터테인먼트`;if(n.image){image.src=n.image;image.style.display="block";caption.textContent=n.imageCaption||""}const photos=Array.isArray(n.images)?n.images.filter(Boolean).slice(0,3):[];const caps=Array.isArray(n.imageCaptions)?n.imageCaptions:[];content.innerHTML=renderContent(n.content||"",photos,caps);loadRelated(n.category||"");loadNav()}async function loadRelated(cat){const s=await getDocs(query(collection(db,"notice"),orderBy("timestamp","desc")));let h="",c=0;s.forEach(x=>{if(x.id===id||c>=3)return;const n=x.data();if((n.category||"")!==cat)return;h+=`<div class="related"><a href="notice_view.html?id=${x.id}">${esc(n.title||"")}</a></div>`;c++});relatedNotice.innerHTML=h||"<p style='color:#aaa'>관련 뉴스가 없습니다.</p>"}async function loadNav(){const s=await getDocs(query(collection(db,"notice"),orderBy("timestamp","desc"))),list=[];s.forEach(x=>list.push({id:x.id}));const i=list.findIndex(x=>x.id===id);if(i>=0&&i<list.length-1)prevBtn.onclick=()=>location.href="notice_view.html?id="+list[i+1].id;else{prevBtn.disabled=true;prevBtn.textContent="첫 뉴스"}if(i>0)nextBtn.onclick=()=>location.href="notice_view.html?id="+list[i-1].id;else{nextBtn.disabled=true;nextBtn.textContent="마지막 뉴스"}}load();
</script><script type="module" src="visitor_tracker.js"></script>
</body></html>
