<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 상세보기</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Malgun Gothic,sans-serif}
header{background:#222;padding:20px;text-align:center}header h1{margin:0;color:#FFD700;font-size:34px}
.container{width:90%;max-width:1000px;margin:40px auto}
#title{font-size:42px;font-weight:bold;line-height:1.4;margin-bottom:25px}
#reporter{color:#FFD700;font-size:18px;margin-bottom:25px;border-bottom:1px solid #444;padding-bottom:15px}
#image{width:100%;max-height:600px;object-fit:contain;border-radius:10px;margin-bottom:15px;display:none}
#caption{text-align:center;color:#aaa;margin-bottom:30px}
#content{font-size:21px;line-height:2;white-space:normal}
.article-photo{display:block;width:100%;max-height:600px;object-fit:contain;border-radius:10px;margin:35px 0 10px}
.article-photo-caption{text-align:center;color:#aaa;margin-bottom:30px}
#relatedNews{margin-top:20px}
.related{display:flex;gap:15px;align-items:center;background:#1a1a1a;border:1px solid #444;border-radius:10px;padding:15px;margin-bottom:15px}
.related img{width:140px;height:90px;object-fit:cover;border-radius:8px}.related a{color:#FFD700;font-size:20px;font-weight:bold;text-decoration:none}
.articleNav{display:flex;justify-content:space-between;align-items:center;margin:40px 0;gap:20px}
button{padding:14px 30px;background:#FFD700;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:18px;font-weight:bold}button:hover{background:#ffcc00}button:disabled{background:#555;color:#aaa;cursor:default}
@media(max-width:700px){.container{width:94%;margin:25px auto}#title{font-size:30px}#content{font-size:18px}.article-photo{max-height:500px}.articleNav{flex-wrap:wrap;justify-content:center}}
</style>
</head>
<body>
<header><h1>📰 뉴스</h1></header>
<div class="container">
<div id="title">뉴스를 불러오는 중입니다...</div>
<div id="reporter"></div>
<img id="image">
<div id="caption"></div>
<div id="content"></div>
<h2 style="margin-top:70px;color:#FFD700;">📰 관련 기사</h2>
<div id="relatedNews"></div>
<div class="articleNav"><button id="prevBtn">◀ 이전 기사</button><button onclick="location.href='myung/news.html'">📰 뉴스 목록</button><button id="nextBtn">다음 기사 ▶</button></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),params=new URLSearchParams(location.search),id=params.get("id");
function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}
function photoHtml(url,index){if(!url)return"";return `<img class="article-photo" src="${url}" alt="기사 관련 사진 ${index}"><div class="article-photo-caption">▲ 기사 관련 사진 ${index}</div>`}
function renderArticleContent(content,photos){
  const text=String(content||"");
  const markerPattern=/\[사진\s*([②③④234])\s*삽입\]/g;
  let html="",last=0,match;
  while((match=markerPattern.exec(text))!==null){
    html+=esc(text.slice(last,match.index)).replace(/\n/g,"<br>");
    const raw=match[1];
    const number={"②":0,"③":1,"④":2,"2":0,"3":1,"4":2}[raw];
    if(number!==undefined&&photos[number]) html+=photoHtml(photos[number],number+2);
    last=markerPattern.lastIndex;
  }
  html+=esc(text.slice(last)).replace(/\n/g,"<br>");
  return html;
}
async function loadNews(){if(!id){document.getElementById("title").textContent="뉴스를 찾을 수 없습니다.";return}const snap=await getDoc(doc(db,"notice",id));if(!snap.exists()){document.getElementById("title").textContent="뉴스가 존재하지 않습니다.";return}const news=snap.data();document.getElementById("title").textContent=news.title||"";document.getElementById("reporter").innerHTML=`📅 ${esc(news.date||"")} &nbsp;&nbsp; | &nbsp;&nbsp; ✍ 가수인생활 엔터테인먼트`;if(news.image){const image=document.getElementById("image");image.src=news.image;image.style.display="block";document.getElementById("caption").textContent="▲ 기사 관련 사진"}const photos=Array.isArray(news.images)?news.images.filter(Boolean).slice(0,3):[];document.getElementById("content").innerHTML=renderArticleContent(news.content||"",photos)}
async function loadRelatedNews(){if(!id)return;const currentSnap=await getDoc(doc(db,"notice",id));if(!currentSnap.exists())return;const category=currentSnap.data().category||"";const q=query(collection(db,"notice"),orderBy("timestamp","desc"));const snap=await getDocs(q);let html="",count=0;snap.forEach(item=>{if(item.id===id)return;const news=item.data();if((news.category||"")!==category||count>=3)return;html+=`<div class="related"><img src="${news.image||'logo.png'}"><div><a href="news_view.html?id=${item.id}">${esc(news.title||"")}</a><div style="margin-top:8px;color:#aaa;font-size:14px;">📅 ${esc(news.date||"")}</div></div></div>`;count++});document.getElementById("relatedNews").innerHTML=html||"<p style='color:#aaa;'>관련 기사가 없습니다.</p>"}
async function loadPrevNext(){if(!id)return;const q=query(collection(db,"notice"),orderBy("timestamp","desc"));const snap=await getDocs(q);const list=[];snap.forEach(item=>list.push({id:item.id,...item.data()}));const index=list.findIndex(item=>item.id===id),prevBtn=document.getElementById("prevBtn"),nextBtn=document.getElementById("nextBtn");if(index>=0&&index<list.length-1)prevBtn.onclick=()=>location.href="news_view.html?id="+list[index+1].id;else{prevBtn.disabled=true;prevBtn.innerHTML="첫 기사"}if(index>0)nextBtn.onclick=()=>location.href="news_view.html?id="+list[index-1].id;else{nextBtn.disabled=true;nextBtn.innerHTML="마지막 기사"}}
loadNews();loadRelatedNews();loadPrevNext();
</script>
</body>
</html>
