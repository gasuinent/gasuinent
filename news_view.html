<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>뉴스 상세보기</title>
<style>body{margin:0;background:#111;color:#fff;font-family:"Malgun Gothic",sans-serif}header{background:#222;padding:20px;text-align:center;position:relative}header h1{margin:0;color:#FFD700;font-size:34px}.close-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid #666;border-radius:50%;background:#111;color:#fff;font-size:28px;line-height:42px;text-align:center;text-decoration:none}.container{width:90%;max-width:1000px;margin:40px auto}.title{font-size:42px;font-weight:bold;line-height:1.4;margin-bottom:20px}.meta{color:#FFD700;font-size:18px;margin-bottom:25px;border-bottom:1px solid #444;padding-bottom:15px}.content{font-size:21px;line-height:2;white-space:pre-wrap}.article-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:30px 0}.article-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid #555}.caption{text-align:center;color:#aaa;font-size:14px;margin-top:-12px}.articleNav{display:flex;justify-content:space-between;align-items:center;margin:45px 0;gap:15px}button{padding:14px 25px;background:#FFD700;color:#000;border:none;border-radius:8px;cursor:pointer;font-size:17px;font-weight:bold}@media(max-width:700px){.container{width:94%;margin:25px auto}.title{font-size:30px}.content{font-size:18px}.article-photos{grid-template-columns:1fr}.articleNav{flex-wrap:wrap;justify-content:center}.close-btn{right:12px;width:42px;height:42px;line-height:38px}}</style></head>
<body><header><h1>📰 뉴스 상세보기</h1><a class="close-btn" href="news.html" title="뉴스 메인으로">×</a></header>
<div class="container"><div id="title" class="title">뉴스를 불러오는 중입니다...</div><div id="meta" class="meta"></div><div id="photos" class="article-photos"></div><div id="content" class="content"></div><div class="articleNav"><button id="prevBtn">◀ 이전 기사</button><button onclick="location.href='news.html'">📰 뉴스 목록</button><button id="nextBtn">다음 기사 ▶</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";import{getFirestore,doc,getDoc,collection,getDocs,query,orderBy}from"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",authDomain:"gasuinent.firebaseapp.com",projectId:"gasuinent",storageBucket:"gasuinent.firebasestorage.app",messagingSenderId:"122370674182",appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",measurementId:"G-39M5K1M6K7"};const db=getFirestore(initializeApp(cfg));const id=new URLSearchParams(location.search).get("id");
async function findNews(){for(const col of ["news","notice"]){const s=await getDoc(doc(db,col,id));if(s.exists())return{collection:col,id,data:s.data()}}return null}
function esc(v){return String(v??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}
function renderPhotos(n){const urls=[];if(n.image)urls.push(n.image);if(Array.isArray(n.images))for(const u of n.images){if(u&&!urls.includes(u))urls.push(u);if(urls.length>=3)break}document.getElementById("photos").innerHTML=urls.slice(0,3).map((u,i)=>`<div><img src="${u}" alt="기사 사진 ${i+1}"><div class="caption">▲ 기사 사진 ${i+1}</div></div>`).join("")}
async function load(){if(!id)return;const item=await findNews();if(!item){document.getElementById("title").textContent="뉴스가 존재하지 않습니다.";return}const n=item.data;document.getElementById("title").textContent=n.title||"";document.getElementById("meta").innerHTML=`📅 ${esc(n.date||"")} &nbsp;&nbsp; | &nbsp;&nbsp; ${esc(n.category||"뉴스")}`;renderPhotos(n);document.getElementById("content").textContent=n.content||"등록된 뉴스 내용이 없습니다.";await loadPrevNext(item)}
async function loadPrevNext(current){const list=[];for(const col of ["news","notice"]){const snap=await getDocs(query(collection(db,col),orderBy("timestamp","desc")));snap.forEach(x=>{const d=x.data();if(col==="news"||d.category||d.type==="news")list.push({id:x.id,col,data:d})})}list.sort((a,b)=>(b.data.timestamp||0)-(a.data.timestamp||0));const index=list.findIndex(x=>x.id===current.id&&x.col===current.collection),prev=document.getElementById("prevBtn"),next=document.getElementById("nextBtn");if(index>=0&&index<list.length-1)prev.onclick=()=>location.href=`news_view.html?id=${list[index+1].id}`;else{prev.disabled=true;prev.textContent="첫 기사"}if(index>0)next.onclick=()=>location.href=`news_view.html?id=${list[index-1].id}`;else{next.disabled=true;next.textContent="마지막 기사"}}
load().catch(e=>{console.error(e);document.getElementById("title").textContent="뉴스 정보를 불러오지 못했습니다."});
</script><script type="module" src="visitor_tracker.js"></script>
</body></html>
