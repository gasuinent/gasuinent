name: Enable visitor tracker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject visitor tracker into public HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[]
          for p in Path('.').glob('*.html'):
              if p.name.startswith('visitor_'):
                  continue
              s=p.read_text(encoding='utf-8')
              marker='<script type="module" src="visitor_tracker.js"></script>'
              if marker in s:
                  continue
              if '</body>' not in s:
                  continue
              p.write_text(s.replace('</body>', marker+'\n</body>'), encoding='utf-8')
              files.append(str(p))
          print('updated:', files)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/enable-visitor-tracker.yml
      - name: Commit visitor tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' visitor_tracker.js .github/workflows/enable-visitor-tracker.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "방문자 통계 오늘부터 자동 집계 적용"
          git push
