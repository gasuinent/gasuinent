<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>자료실 | 가수인생활 엔터테인먼트</title>

<meta
content="가수인생활 엔터테인먼트 공식 홈페이지 자료실"
name="description">

<style>

:root{
    --bg:#080808;
    --panel:#151518;
    --gold:#e0b354;
    --gold2:#f2cf7a;
    --text:#f6f2e9;
    --muted:#c9c1b5;
    --line:#34343a;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
    line-height:1.7;
}

a{
    color:inherit;
    text-decoration:none;
}

.wrap{
    max-width:1240px;
    margin:auto;
    padding:0 24px;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#050505;
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
}

.head{
    min-height:86px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:900;
    white-space:nowrap;
}

.brand img{
    width:54px;
    height:54px;
    object-fit:contain;
    border-radius:50%;
}

.brand b{
    color:var(--gold2);
}

.desktop-nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:1px;
    flex-wrap:nowrap;
}

.desktop-nav a{
    padding:10px 7px;
    border-radius:9px;
    color:var(--muted);
    font-size:14px;
    font-weight:850;
    white-space:nowrap;
}

.desktop-nav a:hover,
.desktop-nav a.active{
    background:rgba(224,179,84,.13);
    color:var(--gold2);
}

.menu-btn{
    display:none;
    width:58px;
    height:58px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#141519;
    color:var(--gold2);
    font-size:30px;
    cursor:pointer;
}

.mobile-nav{
    display:none;
    position:fixed;
    inset:86px 0 0;
    z-index:1000;
    background:rgba(0,0,0,.985);
    padding:22px;
    overflow-y:auto;
    border-top:1px solid var(--line);
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    max-width:620px;
    margin:0 auto 10px;
    padding:15px 18px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#111217;
    color:var(--text);
    font-size:19px;
    font-weight:800;
}

.mobile-nav a:hover,
.mobile-nav a.active{
    background:var(--gold);
    color:#111;
    border-color:var(--gold);
}

/* =========================
   MAIN
========================= */

main{
    min-height:70vh;
}

section{
    padding:82px 0;
}

.section-head{
    text-align:center;
    margin-bottom:50px;
}

.eyebrow{
    color:var(--gold);
    font-weight:900;
    letter-spacing:.18em;
    font-size:22px;
}

h1{
    font-size:clamp(42px,6vw,70px);
    line-height:1.2;
    margin:14px 0 18px;
}

.lead{
    font-size:20px;
    color:var(--muted);
}

/* =========================
   CATEGORY GRID
========================= */

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:26px;
}

.category-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:28px;
    padding:30px;
}

.category-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.category-title h2{
    margin:0;
    color:var(--gold2);
    font-size:30px;
}

.category-icon{
    font-size:30px;
}

.latest-box{
    background:#101116;
    border:1px solid #3b3529;
    border-radius:18px;
    padding:22px;
    min-height:150px;
}

.latest-label{
    color:var(--gold);
    font-size:14px;
    font-weight:900;
    margin-bottom:8px;
}

.latest-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:8px;
}

.latest-date{
    color:#aaa;
    font-size:14px;
}

.latest-content{
    color:var(--muted);
    margin-top:10px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.action-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.btn{
    display:inline-block;
    padding:11px 20px;
    border:1px solid var(--gold);
    border-radius:999px;
    color:var(--gold2);
    font-weight:900;
    background:transparent;
    cursor:pointer;
}

.btn.fill{
    background:var(--gold);
    color:#111;
}

.btn:hover{
    opacity:.85;
}

/* =========================
   CATEGORY LIST
========================= */

.category-list{
    display:none;
    margin-top:20px;
    border-top:1px solid #403a2e;
    padding-top:20px;
}

.category-list.open{
    display:block;
}

.list-title{
    color:var(--gold2);
    font-size:20px;
    font-weight:900;
    margin-bottom:12px;
}

.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 4px;
    border-bottom:1px solid #303035;
}

.file-item:last-child{
    border-bottom:none;
}

.file-info{
    min-width:0;
}

.file-name{
    font-size:18px;
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.file-date{
    color:#999;
    font-size:14px;
}

.file-open{
    flex:0 0 auto;
    padding:8px 15px;
    border:1px solid #806b3c;
    border-radius:999px;
    color:var(--gold2);
    font-size:14px;
    font-weight:800;
}

/* =========================
   EMPTY / LOADING
========================= */

.loading{
    text-align:center;
    color:#aaa;
    padding:25px;
}

.empty{
    color:#888;
    padding:20px 0;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:70px 20px;
    color:#aaa;
    border-top:1px solid var(--line);
}

footer img{
    width:130px;
    height:130px;
    object-fit:contain;
    border-radius:50%;
    display:block;
    margin:0 auto 20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:1020px){

    .desktop-nav{
        display:none;
    }

    .menu-btn{
        display:block;
    }

}

@media(max-width:760px){

    .wrap{
        padding:0 20px;
    }

    .head{
        min-height:78px;
    }

    .brand{
        font-size:18px;
    }

    .brand img{
        width:50px;
        height:50px;
    }

    .menu-btn{
        width:50px;
        height:50px;
        font-size:26px;
    }

    .mobile-nav{
        inset:78px 0 0;
        padding:15px;
    }

    .mobile-nav a{
        font-size:17px;
        padding:12px 15px;
    }

    section{
        padding:55px 0;
    }

    .section-head{
        margin-bottom:30px;
    }

    .eyebrow{
        font-size:15px;
    }

    h1{
        font-size:42px;
    }

    .lead{
        font-size:17px;
    }

    .category-grid{
        grid-template-columns:1fr;
        gap:18px;
    }

    .category-card{
        padding:23px 20px;
        border-radius:22px;
    }

    .category-title h2{
        font-size:24px;
    }

    .latest-title{
        font-size:19px;
    }

    .file-item{
        align-items:flex-start;
    }

    .file-name{
        white-space:normal;
    }

    footer{
        padding:45px 20px;
    }

    footer img{
        width:110px;
        height:110px;
    }

}

</style>

</head>

<main>

<section>

<div class="wrap">

<div class="section-head">

<div class="eyebrow">
RESOURCES
</div>

<h1>자료실</h1>

<p class="lead">
관리자에서 등록한 자료를 분류별로 확인하실 수 있습니다.
</p>

</div>


<div class="category-grid" id="categoryGrid">

자료를 불러오는 중입니다...

<footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:"AIzaSyDTiST7xB7YFnuzdPJ8q418qmx_d5LJupo",

    authDomain:"gasuinent.firebaseapp.com",

    projectId:"gasuinent",

    storageBucket:"gasuinent.firebasestorage.app",

    messagingSenderId:"122370674182",

    appId:"1:122370674182:web:3bb831917d8d6ed36d7d87",

    measurementId:"G-39M5K1M6K7"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   자료 분류
========================= */

const categories = [

    {
        name:"공식뉴스",
        icon:"📰"
    },

    {
        name:"행사일정",
        icon:"📅"
    },

    {
        name:"공지자료",
        icon:"📢"
    },

    {
        name:"행사자료",
        icon:"🎤"
    },

    {
        name:"신청서·양식",
        icon:"📄"
    },

    {
        name:"기타자료",
        icon:"📁"
    }

];


/* =========================
   자료 불러오기
========================= */

async function loadResources(){

    const grid =
        document.getElementById("categoryGrid");

    try{

        const q = query(
            collection(db,"files"),
            orderBy("timestamp","desc")
        );

        const snapshot = await getDocs(q);

        const allFiles = [];

        snapshot.forEach(docItem => {

            allFiles.push({
                id:docItem.id,
                ...docItem.data()
            });

        });


        let html = "";


        categories.forEach((category,index)=>{

            const files = allFiles.filter(
                file => (file.category || "기타자료")
                    === category.name
            );


            const latest = files.length
                ? files[0]
                : null;


            html += `

            <div class="category-card">

                <div class="category-title">

                    <h2>
                        ${category.icon}
                        ${category.name}
                    </h2>

                </div>


                <div class="latest-box">

                    <div class="latest-label">
                        최신 자료
                    </div>

                    ${
                        latest
                        ?

                        `

                        <div class="latest-title">
                            ${escapeHtml(latest.title)}
                        </div>

                        <div class="latest-date">
                            ${latest.date || ""}
                        </div>

                        ${
                            latest.content
                            ?

                            `<div class="latest-content">
                                ${escapeHtml(latest.content)}
                            </div>`

                            : ""
                        }

                        <div class="action-row">

                            <a
                            class="btn fill"
                           href="myung/file_view.html?id=${latest.id}">
                            자세히 보기
                            </a>

                        </div>

                        `

                        :

                        `<div class="empty">
                            등록된 자료가 없습니다.
                        </div>`

                    }

                </div>


                ${
                    files.length > 0

                    ?

                    `

                    <div class="action-row">

                        <button
                        class="btn"
                        onclick="toggleCategory(${index})">
                        전체 목록 보기
                        </button>

                    </div>


                    <div
                    class="category-list"
                    id="categoryList${index}">

                        <div class="list-title">
                            ${category.name} 전체 자료
                        </div>

                        ${
                            files.map(file => `

                                <div class="file-item">

                                    <div class="file-info">

                                        <div class="file-name">
                                            ${escapeHtml(file.title)}
                                        </div>

                                        <div class="file-date">
                                            ${file.date || ""}
                                        </div>

                                    </div>

                                    <a
                                    class="file-open"
                                   href="myung/file_view.html?id=${file.id}">
                                    자세히 보기
                                    </a>

                                </div>

                            `).join("")
                        }

                    </div>

                    `

                    :

                    ""

                }

            </div>

            `;

        });


        grid.innerHTML = html;


    }catch(error){

        console.error(error);

        grid.innerHTML = `

            <div class="loading">

                자료를 불러오지 못했습니다.<br>

                잠시 후 다시 확인해 주세요.

            </div>

        `;

    }

}


/* =========================
   HTML 문자 보호
========================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   분류 전체 목록 열기
========================= */

window.toggleCategory = function(index){

    const list =
        document.getElementById(
            "categoryList"+index
        );

    if(!list) return;

    const isOpen =
        list.classList.contains("open");

    list.classList.toggle("open",!isOpen);

};


/* =========================
   모바일 메뉴
========================= */

const menuBtn =
    document.getElementById("menuBtn");

const mobileNav =
    document.getElementById("mobileNav");


function closeMobileMenu(){

    mobileNav.classList.remove("open");

    menuBtn.setAttribute(
        "aria-expanded",
        "false"
    );

    menuBtn.textContent="☰";

    document.body.style.overflow="";

}


menuBtn.addEventListener("click",()=>{

    const open =
        !mobileNav.classList.contains("open");

    mobileNav.classList.toggle(
        "open",
        open
    );

    menuBtn.setAttribute(
        "aria-expanded",
        String(open)
    );

    menuBtn.textContent =
        open ? "×" : "☰";

    document.body.style.overflow =
        open ? "hidden" : "";

});


mobileNav
.querySelectorAll("a")
.forEach(a=>{

    a.addEventListener(
        "click",
        closeMobileMenu
    );

});


window.addEventListener(
    "resize",
    ()=>{

        if(window.innerWidth > 1020){

            closeMobileMenu();

        }

    }
);


/* =========================
   시작
========================= */

loadResources();

</script>
